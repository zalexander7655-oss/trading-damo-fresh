<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Trading Master</title>
<style>body{margin:0;font-family:Arial;background:#eef6f7;min-height:100vh}.topbar{display:flex;justify-content:space-between;padding:15px}.topbar button{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}.center{text-align:center;padding:20px;max-width:700px;margin:auto}.main-top-space{height:30px}.logo-main{width:180px;max-width:60%;margin-bottom:10px}#mainPage{background:#ffffff;min-height:100vh;color:#1e2329}#mainPage h1.one-line{font-size:46px;font-weight:900;color:#1e2329;margin:0 0 15px 0}p.welcome-name{margin:0 0 25px 0;color:#474d57}button.green{background:#F0B90B;color:#1e2329;padding:14px 30px;font-size:18px;border:none;border-radius:10px;cursor:pointer;margin-top:15px;min-width:220px;font-weight:bold}.bottom-left{position:fixed;bottom:15px;left:15px}.bottom-left button{background:#facc15;padding:12px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.bottom-right{position:fixed;bottom:15px;right:15px}.bottom-right button{background:#F0B90B;color:#1e2329;padding:12px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}</style>
</head>
<body>
<div id="mainPage">
<div class="topbar">
<button style="background:#8b5cf6;color:white" onclick="location.href='purchase.html'">Purchases</button>
<button style="background:#ef4444;color:white" onclick="logout()">Logout</button>
</div>
<div class="center">
<div class="main-top-space"></div>
<img src="logo_transparent.png" class="logo-main" alt="Trading Master Logo">
<h1 class="one-line">Welcome to Trading Master</h1>
<p id="welcomeUser" class="welcome-name"></p>
<button class="green" onclick="location.href='demo-trading.html'">Start Now Trading</button>
</div>
<div class="bottom-left"><button onclick="location.href='help.html'">Help</button></div>
<div class="bottom-right"><button onclick="location.href='real-trading.html'">Real Trading</button></div>
</div>

<script>
let last = localStorage.getItem('tm_last');
if(!last){
  window.location.href='login.html';
} else {
  let u = JSON.parse(localStorage.getItem('tm_user_'+last)||'null');
  if(!u){
    window.location.href='login.html';
  } else {
    document.getElementById('welcomeUser').innerText='Welcome '+(u.fname||u.email);
    
    let cleanEmail = last.toLowerCase().trim();
    localStorage.setItem('current_user_email', cleanEmail);
    localStorage.setItem('email', cleanEmail);

    // If new user, set balance 0 for that email only
    if(localStorage.getItem('bal_' + cleanEmail) === null){
      localStorage.setItem('bal_' + cleanEmail, '0');
    }

    // If user purchased, add balance to same email
    let pendingDemo = localStorage.getItem('pending_demo');
    if(pendingDemo){
      let oldBal = Number(localStorage.getItem('bal_' + cleanEmail) || 0);
      let newBal = oldBal + Number(pendingDemo);
      localStorage.setItem('bal_' + cleanEmail, newBal.toString());
      localStorage.removeItem('pending_demo');
      localStorage.removeItem('pending_real');
    }
  }
}

function logout(){
  localStorage.removeItem('tm_last');
  window.location.href='login.html';
}
</script>
</body>
</html>
