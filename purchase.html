<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Demo Balance</title>
<style>
body{font-family: Arial; background:#0f172a; color:white; text-align:center; padding:15px;}
.plan{background:#1e293b; padding:18px; margin:10px 0; border-radius:12px; cursor:pointer; border:2px solid transparent; font-weight:bold;}
.plan.selected{border-color:#22c55e; background:#14532d;}
button{padding:12px 25px; background:#22c55e; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; width:100%;}
input{padding:12px; width:90%; margin:10px 0; border-radius:6px; border:none;}
.box{background:#1e293b; padding:20px; border-radius:12px; margin-top:20px;}
</style>
</head>
<body>
<h2>Select Demo Plan</h2>
<p>Login as: <b id="userEmail"></b></p>

<div class="plan" onclick="selectPlan(20, 1, this)">Pay $1 - Get $20 Demo</div>
<div class="plan" onclick="selectPlan(10000, 12, this)">Pay $12 - Get $10,000 Demo</div>
<div class="plan" onclick="selectPlan(30000, 25, this)">Pay $25 - Get $30,000 Demo</div>
<div class="plan" onclick="selectPlan(40000, 30, this)">Pay $30 - Get $40,000 Demo</div>
<div class="plan" onclick="selectPlan(60000, 40, this)">Pay $40 - Get $60,000 Demo</div>
<div class="plan" onclick="selectPlan(80000, 50, this)">Pay $50 - Get $80,000 Demo</div>
<div class="plan" onclick="selectPlan(100000, 60, this)">Pay $60 - Get $100,000 Demo</div>

<div id="paymentBox" class="box" style="display:none;">
<h3>Pay $<span id="payAmount"></span> to get $<span id="demoAmount"></span></h3>
<p>Send to: <b style="color:#38bdf8;">YOUR_EASYPAISA_NUMBER</b></p>
<input type="text" id="emailInput" placeholder="Confirm your login email" />
<input type="file" id="screenshot" accept="image/*" />
<button onclick="submitRequest()">I Have Paid - Submit</button>
<p id="status" style="color:yellow;"></p>
</div>

<script>
let selectedDemo=0, selectedPay=0;
let loggedEmail = localStorage.getItem('userEmail') || localStorage.getItem('email') || "demo@gmail.com";
document.getElementById('userEmail').innerText = loggedEmail;
document.getElementById('emailInput').value = loggedEmail;

function selectPlan(demo, pay, el){
  selectedDemo=demo; selectedPay=pay;
  document.querySelectorAll('.plan').forEach(p=>p.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('paymentBox').style.display='block';
  document.getElementById('payAmount').innerText=pay;
  document.getElementById('demoAmount').innerText=demo;
  window.scrollTo(0, document.body.scrollHeight);
}

function submitRequest(){
  let email=document.getElementById('emailInput').value.trim();
  let file=document.getElementById('screenshot').files[0];
  if(!email ||!file){ alert("Email and Screenshot required"); return; }

  let reader=new FileReader();
  reader.onload=function(e){
    let requests=JSON.parse(localStorage.getItem('purchaseRequests')||"[]");
    requests.push({
      id: Date.now(),
      email: email,
      payAmount: selectedPay,
      demoAmount: selectedDemo,
      screenshot: e.target.result,
      status: "pending",
      date: new Date().toLocaleString()
    });
    localStorage.setItem('purchaseRequests', JSON.stringify(requests));
    localStorage.setItem('userEmail', email);
    document.getElementById('status').innerText="Request Sent! Status: Pending. After Admin Approval, balance will be added to your trading account.";
    alert("Success! Request sent.");
  };
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
