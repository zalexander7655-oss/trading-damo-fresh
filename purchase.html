<!DOCTYPE html>
<html>
<head>
<title>Real Trading - Buy Now</title>
<style>
body{font-family:Arial; background:#0f0f0f; color:white; text-align:center; margin:0}
.box{background:#1a1a1a; padding:20px; border-radius:12px; width:92%; max-width:450px; margin:20px auto; border:1px solid #333}
input{width:90%; padding:12px; margin:8px 0; border-radius:6px; border:1px solid #333; background:#222; color:white}
button{width:95%; padding:12px; margin:8px 0; background:#00ff88; border:none; border-radius:6px; font-weight:bold; cursor:pointer}
.btn2{background:#ffaa00}
.btn3{background:#00aaff; color:white}
#status{color:#00ff88; margin-top:15px; word-break:break-all; font-size:13px}
label{font-size:13px; color:#aaa; display:block; margin-top:10px; text-align:left; margin-left:15px}
.bal{font-size:18px; color:#00ff88; font-weight:bold}
</style>
</head>
<body>

<div class="box">
  <h2>Real Trading - Buy Now</h2>
  <p class="bal">Website Balance: <span id="demoBal">0</span> TRX</p>
  <p>Connected: <span id="walletAddr">Not Connected</span></p>
  
  <!-- CONNECT SECTION -->
  <label>Enter Your Trust Wallet Tron Address (T...)</label>
  <input id="myTrustAddress" placeholder="Enter T... address to connect">
  <button onclick="connectWallet()">Connect Trust Wallet</button>
  
  <hr style="border-color:#333; margin:20px 0">

  <!-- SEND TO TRUST WALLET -->
  <h3>1. Send to Trust Wallet</h3>
  <label>Send to Address (TRC20)</label>
  <input id="sendToAddress" placeholder="T... destination address">
  <label>Amount to Send</label>
  <input id="sendAmount" type="number" placeholder="e.g. 10">
  <button class="btn2" onclick="sendToTrustWallet()">Continue - Send to Trust Wallet</button>

  <hr style="border-color:#333; margin:20px 0">

  <!-- DEPOSIT TO WEBSITE -->
  <h3>2. Deposit to Website</h3>
  <label>Website Deposit Address</label>
  <input id="websiteAddress" value="TQ5a6pZx...YourWebsiteAddress" placeholder="Website Address">
  <label>Amount to Deposit to Website</label>
  <input id="depositAmount" type="number" placeholder="e.g. 50">
  <button class="btn3" onclick="depositToWebsite()">Continue - Deposit to Website</button>

  <p id="status"></p>
</div>

<script>
let demoBalance = parseFloat(localStorage.getItem("demoBalance") || "1000");
document.getElementById("demoBal").innerText = demoBalance;

let connectedAddress = "";

function connectWallet(){
  let addr = document.getElementById("myTrustAddress").value.trim();
  if(addr.length < 10){ alert("Please Enter Valid Tron Address T..."); return; }
  
  // Manual Connect - No need for TronLink
  connectedAddress = addr;
  document.getElementById("walletAddr").innerText = addr.substring(0,8) + "..." + addr.slice(-6);
  document.getElementById("status").innerText = "Connected Successfully (Demo Mode): " + addr;
  localStorage.setItem("connectedAddr", addr);
}

function sendToTrustWallet(){
  if(!connectedAddress){ alert("First Connect Wallet - Enter address above and press Connect"); return; }
  let to = document.getElementById("sendToAddress").value.trim();
  let amount = parseFloat(document.getElementById("sendAmount").value);
  if(!to || !amount){ alert("Enter Address and Amount"); return; }
  if(demoBalance < amount){ alert("Not enough demo balance"); return; }

  demoBalance -= amount;
  localStorage.setItem("demoBalance", demoBalance);
  document.getElementById("demoBal").innerText = demoBalance;
  document.getElementById("status").innerHTML = "✅ DEMO SUCCESSFUL<br>" + amount + " TRX Sent to Trust Wallet<br>To: " + to + "<br>New Balance: " + demoBalance;
}

function depositToWebsite(){
  if(!connectedAddress){ alert("First Connect Wallet"); return; }
  let amount = parseFloat(document.getElementById("depositAmount").value);
  if(!amount){ alert("Enter Amount"); return; }

  demoBalance += amount;
  localStorage.setItem("demoBalance", demoBalance);
  document.getElementById("demoBal").innerText = demoBalance;
  document.getElementById("status").innerHTML = "✅ DEMO SUCCESSFUL<br>" + amount + " TRX Deposited to Website<br>Amount deducted from Trust Wallet and added to Website<br>New Balance: " + demoBalance;
}
</script>
</body>
</html>
