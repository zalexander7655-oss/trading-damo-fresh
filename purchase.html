<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purchase Demo</title>
<style>body{margin:0;font-family:Arial;background:#0b0e11;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}.card{background:#12161c;border:1px solid #1e2329;border-radius:12px;padding:20px;max-width:400px;width:100%;text-align:center}.btn{border:none;border-radius:8px;padding:12px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px}.plan{background:#1e2329;border-radius:8px;padding:12px;margin:10px 0;cursor:pointer;border:2px solid transparent;text-align:left}.plan.active{border-color:#f3ba2f;background:#2b3139}</style>
</head><body>
<div class="card">
<h2 style="color:#f3ba2f">Purchase Demo Balance</h2>
<p style="color:#848e9c;font-size:12px">New ID will have lock. After purchase, balance auto added.</p>
<div class="plan active" onclick="selectPlan(this,1000,10)"><b>$10 Plan</b><br><span style="color:#0ecb81">Get $1000 Demo</span></div>
<div class="plan" onclick="selectPlan(this,5000,20)"><b>$20 Plan</b><br><span style="color:#0ecb81">Get $5000 Demo</span></div>
<div class="plan" onclick="selectPlan(this,10000,50)"><b>$50 Plan</b><br><span style="color:#0ecb81">Get $10000 Demo</span></div>
<div id="selected" style="margin:15px 0;background:#0d1421;padding:10px;border-radius:6px">Selected: $1000 for $10</div>
<button class="btn" style="background:#f3ba2f;color:#000" onclick="simulate()">Pay with Binance & Unlock Trading</button>
<button class="btn" style="background:#2b3139;color:#fff" onclick="location.href='demo-trading.html'">Back to Trading</button>
</div>
<script>
let selBal=1000,selPrice=10;
function selectPlan(el,bal,price){document.querySelectorAll('.plan').forEach(p=>p.classList.remove('active'));el.classList.add('active');selBal=bal;selPrice=price;document.getElementById('selected').innerText=`Selected: $${bal} Demo for $${price}`;}
function simulate(){
 let cur=parseFloat(localStorage.getItem('demo_bal_purchased')||'0');
 cur+=selBal;
 localStorage.setItem('demo_bal_purchased',cur.toString());
 alert('Success! $'+selBal+' Demo added! Total Balance: $'+cur+'\nNow trading will start.');
 location.href='demo-trading.html';
}
</script>
</body></html>
