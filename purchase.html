<script>
const packages = [
  { id: 1, real: 1, demo: 20 },
  { id: 2, real: 10, demo: 2000 },
  { id: 3, real: 25, demo: 10000 },
  { id: 4, real: 50, demo: 40000 },
  { id: 5, real: 70, demo: 60000 },
  { id: 6, real: 100, demo: 100000 }
];

document.getElementById('bal').innerText = "Balance: $" + (localStorage.getItem('demo_bal_purchased') || '1000');
document.getElementById('grid').innerHTML = packages.map(p => `
  <div class="card">
    <h3 style="color:#f59e0b">PACKAGE $${p.real}</h3>
    <div class="price">Pay $${p.real} Real</div>
    <div class="bonus">Get $${p.demo.toLocaleString()} Demo</div>
    <div style="font-size:11px;color:#94a3b8;margin-top:6px">Practice trading without loss</div>
    <button class="btn" onclick="buyNow(${p.real}, ${p.demo})">Buy with Binance</button>
  </div>
`).join('');

async function buyNow(realUSD, demoAmount) {
  document.getElementById('loader').style.display = 'flex';
  
  // 1. EMAIL NIKALO - Sab jagah se check karo
  let userEmail = localStorage.getItem('email') || 
                  localStorage.getItem('user_email') || 
                  localStorage.getItem('userEmail') ||
                  localStorage.getItem('trading_email') ||
                  localStorage.getItem('user');

  // Agar email localStorage me nahi mila to user se pucho
  if (!userEmail || !userEmail.includes('@')) {
    userEmail = prompt("Apna Email likho jahan balance add karna hai:");
  }

  if (!userEmail || !userEmail.includes('@')) {
    alert("Email zaroori hai!");
    document.getElementById('loader').style.display = 'none';
    return;
  }

  // Email save kar do agle baar ke liye
  localStorage.setItem('email', userEmail);
  localStorage.setItem('pending_demo', demoAmount);
  localStorage.setItem('pending_real', realUSD);

  try {
    // 2. AB EMAIL KE SATH API CALL KARO
    const response = await fetch('/api/create-payment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        price_amount: realUSD, 
        demo_amount: demoAmount,
        email: userEmail  // <-- YE LINE MISSING THI, AB ADD KI HAI
      })
    });

    const data = await response.json();
    
    if (data.invoice_url) {
      window.location.href = data.invoice_url;
    } else if (data.pay_address) {
      alert("Pay to: " + data.pay_address + " Amount: " + data.pay_amount);
      window.location.href = data.invoice_url || 'main.html';
    } else {
      alert("Error: " + JSON.stringify(data));
      document.getElementById('loader').style.display = 'none';
    }
  } catch (err) {
    alert("API Error: " + err.message);
    document.getElementById('loader').style.display = 'none';
  }
}
</script>
