<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Final</title>
<style>
body{font-family: Arial; background:#020617; color:white; padding:15px;}
.card{background:#1e293b; padding:15px; border-radius:10px; margin-bottom:15px; border:1px solid #334155;}
img{max-width:100%; border-radius:8px; margin-top:10px; border:1px solid #475569;}
button{padding:10px 15px; border:none; border-radius:6px; cursor:pointer; margin:5px; font-weight:bold;}
.approve{background:#22c55e; color:white;}
.reject{background:#ef4444; color:white;}
.delete{background:#334155; color:white;}
.pending{color:orange; font-weight:bold;}
.approved{color:#22c55e; font-weight:bold;}
.rejected{color:#ef4444; font-weight:bold;}
.top-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
</style>
</head>
<body>

<div class="top-bar">
  <h2>Admin Panel</h2>
  <button onclick="clearAll()" class="delete">Clear All History</button>
</div>

<div id="stats" style="background:#1e293b; padding:10px; border-radius:8px; margin-bottom:15px;"></div>
<div id="list"></div>

<script>
function loadRequests(){
  let requests = JSON.parse(localStorage.getItem('purchaseRequests') || "[]");
  let userBalances = JSON.parse(localStorage.getItem('userBalances') || "{}");
  
  // Stats
  let pendingCount = requests.filter(r=>r.status=='pending').length;
  document.getElementById('stats').innerHTML = `Total Requests: ${requests.length} | Pending: ${pendingCount} | Total Users with Balance: ${Object.keys(userBalances).length}`;

  let html = "";
  if(requests.length==0) html="<p style='text-align:center; color:#94a3b8;'>No requests yet. When user pays, request will appear here.</p>";

  requests.slice().reverse().forEach(req=>{
    html+=`
    <div class="card">
      <p><b>Email:</b> ${req.email}</p>
      <p><b>Pay:</b> $${req.payAmount} | <b>Demo:</b> $${req.demoAmount}</p>
      <p><b>Date:</b> ${req.date}</p>
      <p><b>Status:</b> <span class="${req.status}">${req.status.toUpperCase()}</span></p>
      <p><b>Current Balance of this user:</b> $${userBalances[req.email.toLowerCase()] || 0}</p>
      ${req.screenshot ? `<img src="${req.screenshot}" />` : '<p>No Screenshot</p>'}
      <br><br>
      ${req.status=='pending'? `<button class="approve" onclick="approve(${req.id})">Approve & Add $${req.demoAmount}</button><button class="reject" onclick="reject(${req.id})">Reject</button>` : ''}
      <button class="delete" onclick="deleteOne(${req.id})">Delete</button>
    </div>`;
  });
  document.getElementById('list').innerHTML=html;
}

function approve(id){
  let requests = JSON.parse(localStorage.getItem('purchaseRequests') || "[]");
  let userBalances = JSON.parse(localStorage.getItem('userBalances') || "{}");
  let req = requests.find(r=>r.id==id);
  if(!req) return;

  // Safety: Don't approve twice
  if(req.status === 'approved'){
    alert("Already approved before!");
    return;
  }

  let emailKey = req.email.toLowerCase().trim();
  
  // Main Logic: Add balance instantly
  userBalances[emailKey] = (Number(userBalances[emailKey]) || 0) + Number(req.demoAmount);
  req.status = "approved";

  localStorage.setItem('userBalances', JSON.stringify(userBalances));
  localStorage.setItem('purchaseRequests', JSON.stringify(requests));
  
  alert("SUCCESS! $" + req.demoAmount + " added to " + emailKey);
  loadRequests();
}

function reject(id){
  let requests = JSON.parse(localStorage.getItem('purchaseRequests') || "[]");
  let req = requests.find(r=>r.id==id);
  if(req){ req.status="rejected"; }
  localStorage.setItem('purchaseRequests', JSON.stringify(requests));
  loadRequests();
}

function deleteOne(id){
  if(!confirm("Delete this request?")) return;
  let requests = JSON.parse(localStorage.getItem('purchaseRequests') || "[]");
  requests = requests.filter(r=>r.id!=id);
  localStorage.setItem('purchaseRequests', JSON.stringify(requests));
  loadRequests();
}

function clearAll(){
  if(!confirm("Are you sure to delete ALL requests and balances?")) return;
  localStorage.removeItem('purchaseRequests');
  localStorage.removeItem('userBalances');
  loadRequests();
}

loadRequests();
</script>
</body>
</html>
