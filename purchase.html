<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchase Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Inter,Arial;padding:15px}
.header{max-width:900px;margin:auto;display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #222}
.grid{max-width:900px;margin:30px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
.card{background:#121212;border:1px solid #222;border-radius:12px;padding:20px;text-align:center}
.btn{width:100%;padding:12px;background:#f3ba2f;color:#000;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:10px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:999}
.modal-box{background:#121212;border:1px solid #333;padding:20px;border-radius:12px;max-width:400px;width:90%}
.inp{width:100%;padding:10px;background:#1e1e1e;border:1px solid #333;color:#fff;border-radius:8px;margin:6px 0}
</style>
</head>
<body>
<div class="header"><b style="color:#f3ba2f">TRADING MASTER PRO</b><button onclick="location.href='main.html'" style="background:#1e1e1e;color:#fff;border:1px solid #333;padding:6px 12px;border-radius:6px">Back</button></div>
<h2 style="text-align:center">Demo Package خریدیں</h2>
<div class="grid" id="grid"></div>

<div class="modal" id="payModal">
<div class="modal-box">
<h3 id="mTitle"></h3>
<p style="font-size:12px;color:#aaa">Binance / NOWPayments پر یہ رقم بھیجیں:<br><b id="payAddr" style="color:#f3ba2f">آپ کا Binance Wallet</b></p>
<input class="inp" id="txId" placeholder="Transaction ID / TxID ڈالیں">
<input class="inp" type="file" id="screenShot" accept="image/*">
<p style="font-size:11px;color:#888">Screenshot لازمی لگائیں تاکہ میں approval دے سکوں</p>
<button class="btn" onclick="submitForApproval()">Approval کے لیے بھیجیں</button>
<button class="btn" style="background:#222;color:#fff" onclick="document.getElementById('payModal').style.display='none'">Cancel</button>
</div>
</div>

<script>
const packages = [
{real:1, demo:20},{real:10, demo:2000},{real:25, demo:10000},
{real:50, demo:40000},{real:70, demo:60000},{real:100, demo:100000}
];
let selected=null;
document.getElementById('grid').innerHTML = packages.map((p,i)=>`
<div class="card">
<h3>$${p.real} والا پیکج</h3>
<div style="color:#0ecb81;font-weight:900;font-size:20px">$${p.demo} Demo ملے گا</div>
<button class="btn" onclick="openModal(${i})">Binance سے خریدیں</button>
</div>`).join('');

function openModal(i){
selected=packages[i];
document.getElementById('mTitle').innerText=`$${selected.real} بھیجیں اور $${selected.demo} Demo لیں`;
document.getElementById('payModal').style.display='flex';
}

function submitForApproval(){
let tx=document.getElementById('txId').value.trim();
let file=document.getElementById('screenShot').files[0];
if(tx.length<5 || !file){alert('TxID اور Screenshot دونوں لازمی ہیں');return;}

let reader=new FileReader();
reader.onload=function(e){
let payments=JSON.parse(localStorage.getItem('all_payments')||'[]');
payments.push({
id:Date.now(), real:selected.real, demo:selected.demo,
tx:tx, screenshot:e.target.result, status:'pending',
time:new Date().toLocaleString()
});
localStorage.setItem('all_payments',JSON.stringify(payments));
alert('آپ کی payment approval کے لیے بھیج دی گئی ہے۔ میں check کر کے approve کروں گا تو آپ کا demo balance add ہو جائے گا۔');
document.getElementById('payModal').style.display='none';
location.href='main.html';
};
reader.readAsDataURL(file);
}
</script>
</body>
</html>
