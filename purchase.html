<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchase Demo - Trading Master Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff;font-family:Inter,Arial;padding:20px}
.header{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #1e293b}
.grid{max-width:1100px;margin:30px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:20px;text-align:center}
.price{font-size:22px;font-weight:900}.bonus{color:#22c55e;font-weight:800;font-size:18px;margin:8px 0}
.btn{width:100%;padding:12px;background:#f59e0b;color:#000;border:none;border-radius:10px;font-weight:900;cursor:pointer;margin-top:12px}
.btn:hover{background:#fbbf24}
.loader{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);justify-content:center;align-items:center;z-index:9999;flex-direction:column}
.confirm-box{max-width:600px;margin:40px auto;background:#1e293b;border:2px solid #f59e0b;border-radius:14px;padding:20px;display:none}
.input{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;margin:8px 0}
.upload-area{width:100%;height:180px;border:2px dashed #475569;border-radius:10px;display:flex;justify-content:center;align-items:center;flex-direction:column;cursor:pointer;margin:12px 0;background:#0f172a;overflow:hidden}
.upload-area img{max-width:100%;max-height:100%;object-fit:contain;display:none}
</style>
</head>
<body>
<div class="header">
<b style="color:#f59e0b">TRADING MASTER PRO</b>
<div><span id="bal">Balance: $0</span> <button onclick="location.href='main.html'" style="margin-left:10px;background:#1e293b;color:#fff;border:1px solid #334155;padding:6px 14px;border-radius:6px;cursor:pointer">Back</button></div>
</div>

<h2 style="text-align:center;margin-top:20px">Purchase Demo Balance</h2>
<p style="text-align:center;color:#94a3b8;font-size:13px">Pay with Binance / Crypto via NOWPayments - QR & Address</p>

<div class="grid" id="grid"></div>

<!-- EMAIL + SCREENSHOT BOX BELOW EMAIL - ADMIN APPROVAL FLOW -->
<div class="confirm-box" id="confirmBox">
  <h3 style="color:#f59e0b;text-align:center;margin:0">Confirm Your Payment</h3>
  <p id="detailsText" style="color:#94a3b8;font-size:12px;text-align:center;margin-top:8px"></p>

  <label style="font-size:13px;font-weight:600">Your Email</label>
  <input type="email" id="confEmail" class="input" placeholder="Enter your email">

  <label style="font-size:13px;font-weight:600;margin-top:12px;display:block">Upload Payment Screenshot with Email *</label>
  <div class="upload-area" id="uploadArea" onclick="document.getElementById('screenshotInput').click()">
    <span id="uploadText" style="color:#94a3b8">Click to upload screenshot</span>
    <img id="preview">
  </div>
  <input type="file" id="screenshotInput" accept="image/*" style="display:none">

  <button class="btn" onclick="confirmPayment()">Confirm & Send to Admin Approval</button>
  <p id="statusMsg" style="text-align:center;margin-top:12px;color:#22c55e;display:none;font-weight:800"></p>
</div>

<div id="loader" class="loader">
<h3 style="color:#f59e0b">Creating Payment...</h3>
<p style="color:#94a3b8">Opening NOWPayments QR...</p>
</div>

<script>
const packages = [
  { real: 25, demo: 10000 },
  { real: 50, demo: 40000 },
  { real: 70, demo: 60000 },
  { real: 100, demo: 100000 },
  { real: 130, demo: 150000 },
  { real: 150, demo: 200000 }
];

let screenshotBase64 = null;

function updateBalanceDisplay(){
  let email = localStorage.getItem('email') || '';
  let bal = 0;
  if(email){
    let approvals = JSON.parse(localStorage.getItem('pending_approvals') || '[]');
    let approvedSum = 0;
    approvals.forEach(a => {
      if(a.email === email && a.status === 'approved'){
        approvedSum += Number(a.demo_amount || 0);
      }
    });
    bal = approvedSum > 0? approvedSum : Number(localStorage.getItem('demo_bal_' + email) || 0);
  }
  document.getElementById('bal').innerText = "Balance: $" + bal.toLocaleString();
}
updateBalanceDisplay();

const grid = document.getElementById('grid');
grid.innerHTML = packages.map(p => `
  <div class="card">
    <h3 style="color:#f59e0b">PACKAGE $${p.real}</h3>
    <div class="price">Pay $${p.real} Real</div>
    <div class="bonus">Get $${p.demo.toLocaleString()} Demo</div>
    <button class="btn" onclick="buyNow(${p.real},${p.demo})">Buy with Binance</button>
  </div>
`).join('');

document.getElementById('screenshotInput').addEventListener('change', function(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    screenshotBase64 = ev.target.result;
    document.getElementById('preview').src = screenshotBase64;
    document.getElementById('preview').style.display = 'block';
    document.getElementById('uploadText').style.display = 'none';
  };
  reader.readAsDataURL(file);
});

async function buyNow(realUSD, demoAmount) {
  document.getElementById('loader').style.display = 'flex';
  let userEmail = localStorage.getItem('email') || '';
  if(!userEmail || userEmail.indexOf('@') === -1){
    userEmail = prompt("Enter Your Email:");
  }
  if(!userEmail || userEmail.indexOf('@') === -1){
    alert("Email is required!");
    document.getElementById('loader').style.display = 'none';
    return;
  }
  localStorage.setItem('email', userEmail);
  localStorage.setItem('pending_real', realUSD);
  localStorage.setItem('pending_demo', demoAmount);
  const orderId = 'DEMO_' + Date.now() + '_' + realUSD;
  localStorage.setItem('last_order_id', orderId);

  try {
    const response = await fetch('/api/create-payment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ price_amount: realUSD, demo_amount: demoAmount, email: userEmail, order_id: orderId })
    });
    const data = await response.json();
    if(data.invoice_url){
      localStorage.setItem('last_invoice_url', data.invoice_url);
      window.open(data.invoice_url, '_blank'); // Open NOWPayments QR in new tab
      showConfirmBox(); // Show email + screenshot box below email on same page
    } else {
      alert("Error: " + JSON.stringify(data));
    }
  } catch (err) {
    showConfirmBox(); // Even on API error, go to admin approval, no auto credit
  }
  document.getElementById('loader').style.display = 'none';
}

function showConfirmBox(){
  document.getElementById('confirmBox').style.display = 'block';
  document.getElementById('confEmail').value = localStorage.getItem('email') || '';
  document.getElementById('detailsText').innerText = 'Order: ' + localStorage.getItem('last_order_id') + ' | Pay $' + localStorage.getItem('pending_real') + ' -> Get $' + Number(localStorage.getItem('pending_demo')).toLocaleString() + ' Demo';
  window.scrollTo({top: document.getElementById('confirmBox').offsetTop, behavior:'smooth'});
}

function confirmPayment(){
  const email = document.getElementById('confEmail').value.trim();
  if(!email || email.indexOf('@') === -1){ alert("Please enter valid email"); return; }
  if(!screenshotBase64){ alert("Please upload payment screenshot"); return; }

  // SAVE FOR ADMIN APPROVAL - NO AUTO CREDIT
  const approvals = JSON.parse(localStorage.getItem('pending_approvals') || '[]');
  approvals.push({
    id: Date.now(),
    email: email,
    real_amount: localStorage.getItem('pending_real'),
    demo_amount: localStorage.getItem('pending_demo'),
    order_id: localStorage.getItem('last_order_id'),
    screenshot: screenshotBase64,
    status: 'pending',
    date: new Date().toISOString()
  });
  localStorage.setItem('pending_approvals', JSON.stringify(approvals));

  document.getElementById('statusMsg').style.display = 'block';
  document.getElementById('statusMsg').innerText = "Submitted! Sent to Admin Approval with Email + Screenshot. Balance will be added only after Admin Approval.";
}
</script>
</body>
</html>
