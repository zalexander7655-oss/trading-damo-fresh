<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Master Pro - Final</title>
<style>
body{background:#0b0e11;color:#fff;font-family:Arial;margin:0;font-size:14px}
.header{background:#12161c;padding:8px 10px;display:flex;justify-content:space-between;align-items:center}
.btn{background:#0ecb81;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-weight:bold}
.btn-blue{background:#2a5bd7}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:300}
.box{background:#1e2329;margin:30px auto;padding:20px;width:95%;max-width:450px;border-radius:10px;text-align:center}
.plan-btn{background:#2a5bd7;color:#fff;border:none;padding:12px;width:100%;margin:6px 0;border-radius:6px;cursor:pointer;font-weight:bold}
.already-btn{background:#0ecb81;color:#fff;border:none;padding:12px;width:100%;margin:10px 0;border-radius:6px;cursor:pointer;font-weight:bold}
.trade-layout{display:flex;height:520px;background:#0b0e11;margin:8px;border-radius:8px;overflow:hidden;border:1px solid #1e2329}
.left-tools{width:46px;background:#12161c;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:16px;border-right:1px solid #1e2329}
.left-tools span{font-size:18px;opacity:0.6;cursor:pointer;padding:6px;border-radius:6px}.left-tools span.active{opacity:1;background:#2a5bd7}
.chart-area{flex:1;position:relative;min-width:0}#chart{width:100%;height:100%;display:block;cursor:crosshair}
#candleTip{position:absolute;display:none;background:#1e2329;border:1px solid #333;padding:6px;border-radius:6px;font-size:11px;pointer-events:none;z-index:10}
.right-panel{width:230px;min-width:230px;background:#0e1116;border-left:1px solid #1e2329;padding:8px;overflow:auto}
.open-long{background:#0ecb81;color:#fff;border:none;padding:12px;border-radius:6px;width:48%;font-weight:bold;cursor:pointer}
.open-short{background:#f6465d;color:#fff;border:none;padding:12px;border-radius:6px;width:48%;font-weight:bold;cursor:pointer}
.pos-table{background:#12161c;margin:8px;padding:8px;border-radius:8px}
table.main{width:100%;border-collapse:collapse;font-size:11px}table.main th,table.main td{border-bottom:1px solid #222;padding:6px;text-align:left}
.pct-btn{background:#1e2329;border:1px solid #333;color:#aaa;padding:5px 8px;border-radius:4px;font-size:11px;cursor:pointer}
.pct-btn.sel{background:#f0b90b;color:#000}
.mini-btn{background:#2a2e35;color:#fff;border:1px solid #444;padding:5px 8px;border-radius:4px;font-size:11px;cursor:pointer}
input.login{width:90%;padding:10px;margin:6px;background:#0b0e11;border:1px solid #333;color:#fff;border-radius:6px}
</style>
</head>
<body>
<div class="header"><div><b style="color:#f0b90b">Trading Master Pro</b></div><div>Balance: <b id="balance" style="color:#0ecb81">$0.00</b> <button class="btn btn-blue" style="padding:6px 10px" onclick="showHistory()">History</button></div></div>

<div id="loginModal" class="modal" style="display:block"><div class="box"><h2>Login / Create ID</h2><input class="login" id="username" placeholder="Enter ID"><button class="btn" style="width:95%" onclick="doLogin()">Login</button></div></div>
<div id="purchaseModal" class="modal"><div class="box"><h2>Purchase Price Now</h2>
<button class="plan-btn" onclick="buyDemo(20)">1 Price $1 - Get $20</button>
<button class="plan-btn" onclick="buyDemo(10000)">2 Price $12 - Get $10000</button>
<button class="plan-btn" onclick="buyDemo(30000)">3 Price $25 - Get $30000</button>
<button class="plan-btn" onclick="buyDemo(60000)">4 Price $40 - Get $60000</button>
<button class="plan-btn" onclick="buyDemo(80000)">5 Price $50 - Get $80000</button>
<button class="plan-btn" onclick="buyDemo(100000)">6 Price $65 - Get $100000</button>
<hr><button class="already-btn" onclick="alreadyPurchased()">Already Purchased</button></div></div>
<div id="closeModal" class="modal"><div class="box" style="text-align:left"><h3>Market Close</h3>
<div style="display:flex;gap:6px;margin:10px 0"><button class="pct-btn" onclick="selClosePct(10,this)">10%</button><button class="pct-btn" onclick="selClosePct(25,this)">25%</button><button class="pct-btn" onclick="selClosePct(50,this)">50%</button><button class="pct-btn" onclick="selClosePct(75,this)">75%</button><button class="pct-btn sel" onclick="selClosePct(100,this)">100%</button></div>
<p id="closeInfo" style="color:#aaa;font-size:12px"></p>
<button class="btn" style="background:#f0b90b;color:#000" onclick="confirmClose()">Confirm</button>
<button class="btn btn-blue" onclick="document.getElementById('closeModal').style.display='none'">Cancel</button></div></div>
<div id="historyModal" class="modal"><div class="box"><h2>History</h2><div id="histMenu"><button class="btn btn-blue" onclick="openHistView('all')">History</button> <button class="btn" onclick="openHistView('profit')">Profit</button> <button class="btn" style="background:#f6465d" onclick="openHistView('loss')">Loss</button><br><br><button onclick="document.getElementById('historyModal').style.display='none'">Close</button></div><div id="histView" style="display:none"><button onclick="backToMenu()">Back</button><p><b id="viewTotal"></b></p><table class="main"><tbody id="histBody"></tbody></table></div></div></div>

<div id="tradingPanel">
<div style="padding:8px;display:flex;gap:10px;align-items:center"><select id="symbol" style="padding:8px;background:#1e2329;color:#fff"><option>BTCUSDT</option><option>ETHUSDT</option></select><span id="livePrice" style="color:#0ecb81;font-weight:bold">$50000</span><button class="btn btn-blue" style="padding:4px 8px" onclick="clearDrawings()">Clear Draw</button></div>
<div class="trade-layout">
<div class="left-tools">
<span id="t-cross" class="active" onclick="setTool('cross')">✛</span>
<span id="t-trend" onclick="setTool('trend')">📈</span>
<span id="t-box" onclick="setTool('box')">▭</span>
<span id="t-pen" onclick="setTool('pen')">✎</span>
<span id="t-zoom" onclick="setTool('zoom')">🔍</span>
</div>
<div class="chart-area"><canvas id="chart" width="800" height="520"></canvas><div id="candleTip"></div></div>
<div class="right-panel">
<div id="orderBook" style="font-size:11px"></div>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="open-long" onclick="doBuySell('BUY')">Open Long</button>
<button class="open-short" onclick="doBuySell('SELL')">Open Short</button>
</div>
<div style="margin-top:10px;color:#888">Qty: <input id="lot" type="number" value="0.01" step="0.01" style="width:70px;background:#1e2329;color:#fff;border:1px solid #333;padding:5px"></div>
</div>
</div>
<div class="pos-table"><h4 style="color:#f0b90b">Positions (<span id="posCount">0</span>) <button class="mini-btn" style="float:right" onclick="closeAll()">Close All</button></h4>
<table class="main"><thead><tr><th>Symbol</th><th>Side</th><th>Size</th><th>PNL</th><th>Add</th><th>Reverse</th><th>Close</th></tr></thead><tbody id="posBody"></tbody></table></div>
</div>

<script>
let balance=0,price=50000,candles=[],myTrades=[],tradeHistory=[],tick=0,demoOn=false,offset=0,feedStarted=false,activeTool='cross',drawings=[],isDrawing=false,startPos=null,mousePos=null,zoomLevel=1,currentUser=null,closeIndex=-1,closePct=100;
function uk(k){return 'tm_'+currentUser+'_'+k;}
function saveState(){if(!currentUser)return;try{localStorage.setItem(uk('balance'),balance);localStorage.setItem(uk('demoOn'),demoOn?'1':'0');localStorage.setItem(uk('trades'),JSON.stringify(myTrades));localStorage.setItem(uk('history'),JSON.stringify(tradeHistory));localStorage.setItem('tm_lastUser',currentUser);}catch(e){}}
function loadUser(u){currentUser=u;let b=localStorage.getItem(uk('balance'));balance=b?parseFloat(b):0;demoOn=localStorage.getItem(uk('demoOn'))==='1';let t=localStorage.getItem(uk('trades'));myTrades=t?JSON.parse(t):[];let h=localStorage.getItem(uk('history'));tradeHistory=h?JSON.parse(h):[];document.getElementById('balance').innerText='$'+balance.toFixed(2);}
function doLogin(){let u=document.getElementById('username').value.trim();if(!u){alert('Enter ID');return;}loadUser(u);document.getElementById('loginModal').style.display='none';if(!demoOn)document.getElementById('purchaseModal').style.display='block';else startTrading();}
function alreadyPurchased(){if(!demoOn){alert('Buy Price first');return;}document.getElementById('purchaseModal').style.display='none';startTrading();}
function buyDemo(amt){balance=amt;demoOn=true;document.getElementById('balance').innerText='$'+balance.toFixed(2);saveState();document.getElementById('purchaseModal').style.display='none';startTrading();}
function startTrading(){if(!feedStarted){feedStarted=true;startFeed();}updatePos();}
function doBuySell(side){
if(!demoOn||balance<=0){document.getElementById('purchaseModal').style.display='block';return;}
let qty=parseFloat(document.getElementById('lot').value)||0.01;
myTrades.push({sym:document.getElementById('symbol').value,side:side,qty:qty,entry:price});
saveState();updatePos();
}
for(let i=0;i<80;i++){let o=price,c=o+(Math.random()-0.5)*200;candles.push({o:o,h:Math.max(o,c)+50,l:Math.min(o,c)-50,c:c});price=c;}offset=candles.length-50;
function setTool(t){if(t==='zoom'){zoomLevel=zoomLevel===1?1.6:1;drawChart();return;}activeTool=t;document.querySelectorAll('.left-tools span').forEach(s=>s.classList.remove('active'));let m={cross:0,trend:1,box:2,pen:3};let els=document.querySelectorAll('.left-tools span');if(els[m[t]])els[m[t]].classList.add('active');}
function clearDrawings(){drawings=[];drawChart();}
function drawChart(){let cv=document.getElementById('chart'),ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);let all=candles.flatMap(k=>[k.h,k.l]),mn=Math.min(...all),mx=Math.max(...all),rg=(mx-mn||1)/zoomLevel;let cw=(cv.width*0.78)/50,vis=candles.slice(offset,offset+50);vis.forEach((k,i)=>{let x=i*cw,y=v=>cv.height-20-((v-mn)/rg)*(cv.height-40),col=k.c>=k.o?'#0ecb81':'#f6465d';ctx.strokeStyle=col;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x+cw/2,y(k.h));ctx.lineTo(x+cw/2,y(k.l));ctx.stroke();let yo=y(k.o),yc=y(k.c);ctx.fillRect(x+1,Math.min(yo,yc),cw-2,Math.abs(yc-yo)||2);});ctx.strokeStyle='#f0e68c';ctx.lineWidth=2;drawings.forEach(d=>{if(d.type==='trend'){ctx.beginPath();ctx.moveTo(d.x1,d.y1);ctx.lineTo(d.x2,d.y2);ctx.stroke();}if(d.type==='box'){ctx.strokeRect(Math.min(d.x1,d.x2),Math.min(d.y1,d.y2),Math.abs(d.x2-d.x1),Math.abs(d.y2-d.y1));}if(d.type==='pen'){ctx.beginPath();d.points.forEach((p,i)=>{i==0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});ctx.stroke();}});ctx.lineWidth=1;if(activeTool==='cross'&&mousePos){ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(mousePos.x,0);ctx.lineTo(mousePos.x,cv.height);ctx.moveTo(0,mousePos.y);ctx.lineTo(cv.width,mousePos.y);ctx.stroke();ctx.setLineDash([]);}}
function startFeed(){drawChart();updatePos();setInterval(()=>{tick++;let last=candles[candles.length-1];price=last.c+(Math.random()-0.49)*80;last.c=price;if(price>last.h)last.h=price;if(price<last.l)last.l=price;if(tick%8===0){candles.push({o:last.c,h:last.c,l:last.c,c:last.c});if(candles.length>200)candles.shift();offset=candles.length-50;}document.getElementById('livePrice').innerText='$'+price.toFixed(2);drawChart();updatePos();if(tick%4===0)updateBook();if(tick%10===0)saveState();},400);}
function updateBook(){let h='';for(let i=0;i<12;i++){let p=(price+(Math.random()-0.5)*5).toFixed(2);h+='<div style="display:flex;justify-content:space-between;padding:2px 0"><span style="color:'+(Math.random()>0.5?'#0ecb81':'#f6465d')+'">'+p+'</span><span>'+(Math.random()*50).toFixed(1)+'</span></div>';}document.getElementById('orderBook').innerHTML=h;}
function updatePos(){let tb=document.getElementById('posBody');document.getElementById('posCount').innerText=myTrades.length;if(!myTrades.length){tb.innerHTML='<tr><td colspan="7" style="text-align:center;color:#666">No Active Positions</td></tr>';return;}let h='';myTrades.forEach((t,i)=>{let pnl=t.side=='BUY'?(price-t.entry)*t.qty*10:-(price-t.entry)*t.qty*10;let col=pnl>=0?'#0ecb81':'#f6465d';h+='<tr><td>'+t.sym+'</td><td style="color:'+col+'">'+t.side+'</td><td>'+t.qty+'</td><td style="color:'+col+'">'+pnl.toFixed(2)+'</td><td><button class="mini-btn" onclick="addQty('+i+')">Add</button></td><td><button class="mini-btn" onclick="reversePos('+i+')">Reverse</button></td><td><button class="mini-btn" style="background:#f0b90b;color:#000" onclick="openCloseModal('+i+')">Close</button></td></tr>';});tb.innerHTML=h;}
function addQty(i){myTrades[i].qty=parseFloat((myTrades[i].qty+0.01).toFixed(2));saveState();updatePos();}
function reversePos(i){let t=myTrades[i];t.side=t.side=='BUY'?'SELL':'BUY';t.entry=price;saveState();updatePos();}
function closeAll(){if(!myTrades.length)return;myTrades.forEach(t=>{let pnl=t.side=='BUY'?(price-t.entry)*t.qty*10:-(price-t.entry)*t.qty*10;balance+=pnl;tradeHistory.push({date:new Date().toISOString().slice(0,10),sym:t.sym,pnl:pnl});});myTrades=[];if(balance<0)balance=0;document.getElementById('balance').innerText='$'+balance.toFixed(2);saveState();updatePos();}
function openCloseModal(i){closeIndex=i;closePct=100;document.getElementById('closeModal').style.display='block';updateCloseInfo();}
function selClosePct(p,el){closePct=p;document.querySelectorAll('#closeModal.pct-btn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');updateCloseInfo();}
function updateCloseInfo(){let t=myTrades[closeIndex];if(!t)return;let pnl=t.side=='BUY'?(price-t.entry)*t.qty*10:-(price-t.entry)*t.qty*10;document.getElementById('closeInfo').innerText=closePct+'% close, expected '+(pnl*closePct/100).toFixed(2)+' USDT';}
function confirmClose(){let t=myTrades[closeIndex];let pnl=t.side=='BUY'?(price-t.entry)*t.qty*10:-(price-t.entry)*t.qty*10;let pp=pnl*closePct/100;balance+=pp;if(balance<0)balance=0;tradeHistory.push({date:new Date().toISOString().slice(0,10),sym:t.sym,pnl:pp});if(closePct>=100)myTrades.splice(closeIndex,1);else t.qty=t.qty*(100-closePct)/100;document.getElementById('closeModal').style.display='none';document.getElementById('balance').innerText='$'+balance.toFixed(2);saveState();updatePos();}
function showHistory(){document.getElementById('historyModal').style.display='block';document.getElementById('histMenu').style.display='block';document.getElementById('histView').style.display='none';}
function openHistView(v){document.getElementById('histMenu').style.display='none';document.getElementById('histView').style.display='block';let h='',tot=0;tradeHistory.forEach(tr=>{if(v=='profit'&&tr.pnl<0)return;if(v=='loss'&&tr.pnl>=0)return;tot+=tr.pnl;h+='<tr><td>'+tr.date+'</td><td>'+tr.sym+'</td><td>$'+tr.pnl.toFixed(2)+'</td></tr>';});document.getElementById('histBody').innerHTML=h||'<tr><td colspan="3">No data</td></tr>';document.getElementById('viewTotal').innerText='Total $'+tot.toFixed(2);}
function backToMenu(){document.getElementById('histMenu').style.display='block';document.getElementById('histView').style.display='none';}
let cvEl=document.getElementById('chart'),tip=document.getElementById('candleTip');
function getPos(e){let r=cvEl.getBoundingClientRect();return{x:(e.clientX-r.left)*(cvEl.width/r.width),y:(e.clientY-r.top)*(cvEl.height/r.height),cx:e.clientX-r.left,cy:e.clientY-r.top};}
cvEl.addEventListener('mousemove',e=>{let p=getPos(e);mousePos={x:p.x,y:p.y};if(activeTool==='cross')drawChart();if(isDrawing&&activeTool==='pen'&&startPos){startPos.points.push({x:p.x,y:p.y});drawChart();}let cw=(cvEl.width*0.78)/50,idx=Math.floor(p.x/cw),vis=candles.slice(offset,offset+50);if(idx>=0&&idx<vis.length){let k=vis[idx];tip.style.display='block';tip.style.left=(p.cx+15)+'px';tip.style.top=(p.cy+10)+'px';tip.innerHTML='Rate $'+k.c.toFixed(2)+'<br>Open '+k.o.toFixed(2)+'<br>High '+k.h.toFixed(2)+'<br>Low '+k.l.toFixed(2);}else tip.style.display='none';});
cvEl.addEventListener('mousedown',e=>{let p=getPos(e);if(activeTool==='trend'||activeTool==='box'){isDrawing=true;startPos={x1:p.x,y1:p.y,x2:p.x,y2:p.y,type:activeTool};}else if(activeTool==='pen'){isDrawing=true;startPos={type:'pen',points:[{x:p.x,y:p.y}]};}});
window.addEventListener('mouseup',()=>{if(isDrawing&&startPos){if(startPos.type&&startPos.type!=='pen'){startPos.x2=mousePos.x;startPos.y2=mousePos.y;}else if(startPos.x1!==undefined){startPos.x2=mousePos.x;startPos.y2=mousePos.y;}drawings.push(startPos);isDrawing=false;startPos=null;drawChart();}});
window.addEventListener('beforeunload',saveState);
</script>
</body>
</html>
