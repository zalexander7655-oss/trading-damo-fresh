<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Master Pro - Final</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial;background:#0b0e11;color:#fff;font-size:13px;overflow:hidden}
body{display:flex;flex-direction:column}
.hd{background:#12161c;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 10px}
.hd b{color:#ffbf00}
.btn{border:none;border-radius:6px;padding:8px;font-weight:bold;cursor:pointer;width:100%;margin-bottom:5px;font-size:12px}
.main{flex:1;display:flex;min-height:0;gap:4px;padding:4px}
.tools{width:40px;background:#1e2a4a;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0;flex-shrink:0}
.tools span{color:#fff;padding:5px}
.chartWrap{flex:1;display:flex;background:#0d1421;border-radius:8px;overflow:hidden;border:1px solid #1e2329}
.chartBox{flex:1;position:relative}#ch{width:100%;height:100%;display:block}
.priceCol{width:90px;background:#0d1421;border-left:1px solid #1e3a5f;position:relative;flex-shrink:0}
.pTag{position:absolute;right:2px;font-size:10px;padding:1px 4px;border-radius:3px;transform:translateY(-50%)}
.right{width:290px;background:#12161c;border-radius:8px;display:flex;flex-direction:column;border:1px solid #1e2329;flex-shrink:0}
.obH{padding:7px;color:#ffbf00;font-weight:bold;border-bottom:2px solid #ffbf00;font-size:13px;text-align:center;background:#0f1420}
#ob{flex:1;overflow:hidden;padding:3px}
.obRow{display:flex;justify-content:space-between;padding:1px 4px;line-height:1.5;font-size:11px}
.ctrl{padding:6px;background:#0f1420;border-top:2px solid #ffbf00;max-height:55%;overflow:auto}
.pos{background:#1e2a4a;margin:0 4px 4px;padding:5px;border-radius:8px;height:68px;overflow:auto;font-size:11px}
</style>
</head>
<body>
<div class="hd"><div><b style="color:#ffbf00">Trading Master Pro</b> <span id="lp" style="color:#0ecb81;margin-left:8px"></span></div><div>Balance: <b id="bal" style="color:#0ecb81">$0.00</b> <button class="btn" style="width:auto;display:inline-block;background:#2a5bd7;color:#fff;margin:0">History</button> <button class="btn" style="width:auto;display:inline-block;background:#f6465d;color:#fff;margin:0" onclick="location.reload()">Logout</button></div></div>
<div style="display:flex;flex-direction:column;flex:1;min-height:0">
<div class="main">
<div class="tools"><span>🟡</span><span>✛</span><span>📈</span><span>➖</span><span>▭</span><span>✎</span><span>T</span></div>
<div class="chartWrap"><div class="chartBox"><canvas id="ch"></canvas></div><div class="priceCol" id="pcol"></div></div>
<div class="right">
<div class="obH">Order Book Live</div>
<div id="ob"></div>
<div class="ctrl">
<div style="color:#f6465d;font-size:11px;text-align:center;margin-bottom:5px">Balance $0 - Trade locked</div>
<button class="btn" style="background:#2a5bd7;color:#fff">Normal</button>
<div style="color:#ffbf00;text-align:center;font-size:12px;margin:5px 0">Candle Trading</div>
<button class="btn" style="background:#26a69a;color:#fff" onclick="lock()">Green Candle Bet</button>
<button class="btn" style="background:#f6465d;color:#fff" onclick="lock()">Red Candle Bet</button>
<div style="color:#ffbf00;text-align:center;font-size:12px;margin:5px 0">Quantity</div>
<div style="display:flex;gap:4px;margin-bottom:5px"><button class="btn" style="width:36px;background:#2a5bd7;color:#fff">-</button><input value="0.01" style="flex:1;text-align:center;background:#0b0e11;color:#fff;border:1px solid #333;border-radius:6px"><button class="btn" style="width:36px;background:#2a5bd7;color:#fff">+</button></div>
<div style="color:#ffbf00;text-align:center;font-size:12px;margin:5px 0">Normal Trade</div>
<button class="btn" style="background:#0ecb81;color:#fff" onclick="lock()">Buy / Long</button>
<button class="btn" style="background:#f6465d;color:#fff" onclick="lock()">Sell / Short</button>
</div>
</div>
</div>
<div class="pos"><b style="color:#ffbf00">Positions (0)</b><div>No positions</div></div>
</div>
<script>
function lock(){alert('Balance zero hai. Pehle balance purchase karein.');}
var price=6429.41, target=price, candles=[];
for(var i=0;i<65;i++){var o=price; price+=(Math.random()-0.5)*4; var c=price; candles.push({o:o,h:Math.max(o,c)+1.2,l:Math.min(o,c)-1.2,c:c});}
price=6429.41; target=price;
var cv=document.getElementById('ch'), ctx=cv.getContext('2d');
var pcol=document.getElementById('pcol'), ob=document.getElementById('ob');
function draw(){
 var rc=cv.parentElement.getBoundingClientRect(); if(rc.width<10){requestAnimationFrame(draw);return;}
 cv.width=rc.width; cv.height=rc.height;
 price += (target-price)*0.12;
 var lc=candles[candles.length-1]; lc.c=price; lc.h=Math.max(lc.h,price); lc.l=Math.min(lc.l,price);
 var all=[]; candles.forEach(k=>{all.push(k.h);all.push(k.l)});
 var mn=Math.min.apply(null,all), mx=Math.max.apply(null,all); var pad=(mx-mn)*0.35||5; mn-=pad; mx+=pad; var rg=mx-mn;
 var Y=v=>cv.height-10-((v-mn)/rg)*(cv.height-20);
 ctx.fillStyle='#0a0f24'; ctx.fillRect(0,0,cv.width,cv.height);
 // live forex style candles
 var cw=cv.width/34; var vis=candles.slice(-32);
 vis.forEach((k,i)=>{var x=i*cw; var up=k.c>=k.o; var col=up?'#00e5c0':'#ff4d6d';
  ctx.strokeStyle=col; ctx.fillStyle=col; var cx=x+cw/2;
  ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(cx,Y(k.h)); ctx.lineTo(cx,Y(k.l)); ctx.stroke();
  var yO=Y(k.o), yC=Y(k.c); var top=Math.min(yO,yC); var h=Math.max(Math.abs(yC-yO),4);
  ctx.fillRect(cx-4,top,8,h); });
 // full move line - live market line
 var yl=Y(price);
 ctx.strokeStyle='#ffbf00'; ctx.setLineDash([7,5]); ctx.lineWidth=1.3;
 ctx.beginPath(); ctx.moveTo(0,yl); ctx.lineTo(cv.width,yl); ctx.stroke(); ctx.setLineDash([]);
 ctx.fillStyle='#ffbf00'; ctx.fillRect(cv.width-70,yl-11,70,22);
 ctx.fillStyle='#000'; ctx.font='bold 11px Arial'; ctx.fillText(price.toFixed(2),cv.width-66,yl+4);
 // price ladder
 var ph=''; for(var d=10;d>=-10;d--){var pp=price+d*1.6; var yy=Y(pp); if(yy<0||yy>cv.height) continue;
  var is0=d==0; ph+='<div class="pTag" style="top:'+yy+'px;background:'+(is0?'#ffbf00':'transparent')+';color:'+(is0?'#000':(d>0?'#ff4d6d':'#00e5c0'))+'">'+pp.toFixed(2)+'</div>';}
 pcol.innerHTML=ph;
 // order book live
 var oh=''; for(var i=6;i>0;i--) oh+='<div class="obRow"><span style="color:#ff4d6d">'+(price+i*1.1).toFixed(2)+'</span><span>'+(Math.random()*0.3+0.05).toFixed(3)+'</span></div>';
 for(var i=1;i<=6;i++) oh+='<div class="obRow"><span style="color:#00e5c0">'+(price-i*1.1).toFixed(2)+'</span><span>'+(Math.random()*0.3+0.05).toFixed(3)+'</span></div>';
 ob.innerHTML=oh;
 document.getElementById('lp').innerText='$'+price.toFixed(2);
 requestAnimationFrame(draw);
}
setInterval(()=>{ target+=(Math.random()-0.5)*5; if(Math.random()<0.09){var o=target; candles.push({o:o,h:o+1,l:o-1,c:o}); if(candles.length>140)candles.shift();} },700);
draw();
</script>
</body>
</html>
