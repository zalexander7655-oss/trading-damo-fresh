<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Master Pro</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:Arial;font-size:12px}
body{background:#0b0e11;color:#eaecef;display:flex;flex-direction:column}
.hd{background:#12161c;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #1e2329}
.hd b{color:#f0b90b}.btn{border:none;border-radius:6px;padding:7px 14px;font-weight:bold;cursor:pointer}
.y{background:#f0b90b;color:#000}.r{background:#f6465d;color:#fff}.g{background:#0ecb81;color:#fff}.b{background:#2a5bd7;color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:200}
.box{background:#1e2329;border:1px solid #2b3139;max-width:420px;width:94%;margin:40px auto;padding:20px;border-radius:12px;text-align:center}
.pi{background:#0b0e11;border:1px solid #2b3139;padding:12px;margin:8px;border-radius:8px;cursor:pointer;font-weight:bold}
.pi:hover{border-color:#f0b90b}
.main{flex:1;display:flex;min-height:0;margin:6px;gap:6px}
.left{width:52px;background:#12161c;border:1px solid #1e2329;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:14px}
.left span{font-size:22px;color:#848e9c;cursor:pointer;padding:8px;border-radius:8px}.left span.on{background:#f0b90b;color:#000}
.center{flex:1;display:flex;flex-direction:column;min-width:0}
.chartBox{flex:1;background:#fff;border-radius:8px;overflow:hidden;border:1px solid #1e2329;min-height:0}
#ch{width:100%;height:100%;display:block;cursor:crosshair}
.qbar{background:#12161c;border:1px solid #1e2329;border-radius:8px;display:flex;justify-content:center;align-items:center;gap:12px;padding:10px;margin-top:6px}
.qbar input{width:80px;text-align:center;padding:9px;border-radius:6px;border:1px solid #2b3139;background:#1e2329;color:#fff;font-weight:bold}
.buyBtn{background:#0ecb81;color:#fff;padding:11px 36px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.sellBtn{background:#f6465d;color:#fff;padding:11px 36px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.ob{width:270px;background:#12161c;border:1px solid #1e2329;border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.ob h4{margin:0;padding:10px;border-bottom:1px solid #1e2329}#obB{flex:1;overflow:hidden;padding:4px;font-size:11px}
.pos{background:#12161c;margin:0 6px 6px;padding:8px;border-radius:8px;border:1px solid #1e2329;max-height:140px;overflow:auto}
table{width:100%;border-collapse:collapse}td,th{padding:5px;border-bottom:1px solid #1e2329;text-align:left}
</style>
</head>
<body>
<div class="hd"><div><b>Trading Master Pro</b> <span style="color:#848e9c">BTCUSDT</span> <b id="lp" style="color:#0ecb81">$0</b></div>
<div>Balance: <b id="bal" style="color:#0ecb81">$0.00</b> <button class="btn y" onclick="document.getElementById('buyM').style.display='block'">Purchase</button> <button class="btn y" onclick="openH()">History</button> <button class="btn r" onclick="location.reload()">Logout</button></div></div>

<div id="buyM" class="modal" style="display:block"><div class="box"><h2>Purchase Balance</h2><p style="color:#848e9c">Select amount - balance will show here</p>
<div class="pi" onclick="doBuy(100)">Buy $100</div><div class="pi" onclick="doBuy(500)">Buy $500</div><div class="pi" onclick="doBuy(1000)">Buy $1000</div><div class="pi" onclick="doBuy(10000)">Buy $10000</div>
<button class="btn b" onclick="document.getElementById('buyM').style.display='none'">Close</button></div></div>

<div id="histM" class="modal"><div class="box"><h2>History</h2><div id="hB" style="text-align:left;max-height:300px;overflow:auto"></div><br><button class="btn r" onclick="document.getElementById('histM').style.display='none'">Close</button></div></div>
<div id="closeM" class="modal"><div class="box" style="text-align:left"><h2>Close Confirm</h2><div id="cI" style="background:#0b0e11;padding:10px;border-radius:8px"></div><br><button class="btn y" style="width:100%;padding:12px" onclick="doClose()">Confirm</button><br><br><button class="btn b" style="width:100%" onclick="document.getElementById('closeM').style.display='none'">Cancel</button></div></div>

<div class="main">
<div class="left"><span class="on" onclick="setT('cross',this)">✛</span><span onclick="setT('trend',this)">╱</span><span onclick="setT('box',this)">▢</span><span onclick="setT('pen',this)">✎</span><span onclick="setT('hline',this)">―</span><span onclick="draws=[];drawC()">🗑</span></div>
<div class="center"><div class="chartBox"><canvas id="ch"></canvas></div>
<div class="qbar"><button onclick="cq(-1)" style="width:32px;height:32px">-</button><input id="qty" value="10" type="number"><button onclick="cq(1)" style="width:32px;height:32px">+</button><button class="buyBtn" onclick="trade('BUY')">Buy / Long</button><button class="sellBtn" onclick="trade('SELL')">Sell / Short</button></div></div>
<div class="ob"><h4>Order Book - Live</h4><div id="obB"></div></div>
</div>
<div class="pos"><b style="color:#f0b90b">Positions (<span id="pc">0</span>)</b><table><thead><tr><th>Sym</th><th>Side</th><th>Qty</th><th>PNL</th><th>Close</th></tr></thead><tbody id="pb"></tbody></table></div>

<script>
let bal=parseFloat(localStorage.getItem('tb_bal')||'0'),trades=[],hist=JSON.parse(localStorage.getItem('tb_h')||'[]'),candles=[],price=83300,tool='cross',draws=[],isD=false,sP=null,mP=null,ci=-1;
const $=id=>document.getElementById(id);
function doBuy(a){bal=a;localStorage.setItem('tb_bal',bal);upd();document.getElementById('buyM').style.display='none'}
function upd(){$('bal').innerText='$'+bal.toFixed(2)}
function cq(d){$('qty').value=Math.max(1,(+$('qty').value||10)+d)}
function trade(s){if(bal<=0){document.getElementById('buyM').style.display='block';return alert('Please Purchase first')}trades.push({side:s,qty:+$('qty').value||10,entry:price});updPos()}
function setT(t,e){tool=t;document.querySelectorAll('.left span').forEach(x=>x.classList.remove('on'));e.classList.add('on')}
function openH(){$('histM').style.display='block';$('hB').innerHTML=hist.map(x=>'<div style="display:flex;justify-content:space-between;padding:4px;border-bottom:1px solid #222"><span>'+x.d+'</span><span style="color:'+(x.pnl>=0?'#0ecb81':'#f6465d')+'">$'+x.pnl.toFixed(2)+'</span></div>').join('')||'No history'}
function updPos(){$('pc').innerText=trades.length;$('pb').innerHTML=trades.map((t,i)=>{let pnl=t.side=='BUY'?(price-t.entry)*t.qty*0.01:-(price-t.entry)*t.qty*0.01;let c=pnl>=0?'#0ecb81':'#f6465d';return '<tr><td>BTCUSDT</td><td style="color:'+c+'">'+t.side+'</td><td>'+t.qty+'</td><td style="color:'+c+'">'+pnl.toFixed(2)+'</td><td><button class="btn y" onclick="openC('+i+')">Close</button></td></tr>'}).join('')||'<tr><td colspan=5 style="text-align:center;color:#666">No positions</td></tr>'}
function openC(i){ci=i;let t=trades[i];let pnl=t.side=='BUY'?(price-t.entry)*t.qty*0.01:-(price-t.entry)*t.qty*0.01;$('cI').innerHTML='PNL: $'+pnl.toFixed(2);$('closeM').style.display='block'}
function doClose(){let t=trades[ci];let pnl=t.side=='BUY'?(price-t.entry)*t.qty*0.01:-(price-t.entry)*t.qty*0.01;bal+=pnl;localStorage.setItem('tb_bal',bal);hist.push({d:new Date().toLocaleDateString(),pnl});while(hist.length>20)hist.shift();localStorage.setItem('tb_h',JSON.stringify(hist));trades.splice(ci,1);$('closeM').style.display='none';upd();updPos()}

// init candles small size
for(let i=0;i<50;i++){let o=price;price=o+(Math.random()-0.5)*18; // small 3.6 style move
candles.push({o,h:Math.max(o,price)+4,l:Math.min(o,price)-4,c:price})}

function drawC(){
let cv=$('ch'),r=cv.parentElement.getBoundingClientRect();cv.width=r.width;cv.height=r.height;
let ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
let all=candles.flatMap(k=>[k.h,k.l]),mn=Math.min(...all),mx=Math.max(...all);
let pad=(mx-mn)*0.5; mn-=pad*0.25; mx+=pad*0.25; let rg=mx-mn||1; // 0.5 top/bottom space
let total=40, visN=28, cw=cv.width/total; // 30% front empty = 12/40
let vis=candles.slice(-visN);
vis.forEach((k,i)=>{let x=i*cw;
let y=v=>cv.height-6-((v-mn)/rg)*(cv.height-12);
let up=k.c>=k.o,col=up?'#0ecb81':'#f6465d';
ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.5;
ctx.beginPath();ctx.moveTo(x+cw/2,y(k.h));ctx.lineTo(x+cw/2,y(k.l));ctx.stroke();
// small body
let bh=Math.max(Math.abs(y(k.c)-y(k.o)),3);
ctx.fillRect(x+cw*0.28,Math.min(y(k.c),y(k.o)),cw*0.44,bh);
});
ctx.strokeStyle='#333';ctx.lineWidth=1.5;
draws.forEach(d=>{if(d.type=='trend'){ctx.beginPath();ctx.moveTo(d.x1,d.y1);ctx.lineTo(d.x2,d.y2);ctx.stroke()}
if(d.type=='hline'){ctx.beginPath();ctx.moveTo(0,d.y1);ctx.lineTo(cv.width,d.y1);ctx.stroke()}
if(d.type=='box')ctx.strokeRect(Math.min(d.x1,d.x2),Math.min(d.y1,d.y2),Math.abs(d.x2-d.x1),Math.abs(d.y2-d.y1))
if(d.type=='pen'){ctx.beginPath();d.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}});
}

// LIVE order book via Binance depth
async function liveOB(){
try{
let r=await fetch('https://api.binance.com/api/v3/depth?symbol=BTCUSDT&limit=20');
let j=await r.json();
let html='';
j.asks.slice(0,12).reverse().forEach(a=>{html+='<div style="display:flex;justify-content:space-between"><span style="color:#f6465d">'+(+a[0]).toFixed(1)+'</span><span>'+(+a[1]).toFixed(4)+'</span></div>'});
html+='<div style="text-align:center;padding:6px;font-weight:bold;font-size:13px;border-top:1px solid #1e2329;border-bottom:1px solid #1e2329">'+price.toFixed(1)+'</div>';
j.bids.slice(0,12).forEach(b=>{html+='<div style="display:flex;justify-content:space-between"><span style="color:#0ecb81">'+(+b[0]).toFixed(1)+'</span><span>'+(+b[1]).toFixed(4)+'</span></div>'});
$('obB').innerHTML=html;
}catch(e){}
}

// smooth live candle via requestAnimationFrame - no jumping
let ws; try{ ws=new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade'); ws.onmessage=e=>{let p=parseFloat(JSON.parse(e.data).p); if(p) price=p; } }catch(e){}

let last=performance.now(),acc=0;
function loop(t){
let dt=t-last; last=t; acc+=dt;
if(acc>120){ // smooth tick
acc=0;
let l=candles[candles.length-1];
let move=(Math.random()-0.5)*6; // smooth small
price+=move; l.c=price;
if(price>l.h)l.h=price; if(price<l.l)l.l=price;
// new candle attached without gap
if(Math.random()<0.06){candles.push({o:price,h:price,l:price,c:price}); if(candles.length>100)candles.shift();}
$('lp').innerText='$'+price.toFixed(2);
drawC(); updPos();
}
requestAnimationFrame(loop);
}
upd(); drawC(); liveOB(); setInterval(liveOB,1500); requestAnimationFrame(loop);

let cvE=$('ch'); function gp(e){let r=cvE.getBoundingClientRect();return{x:(e.clientX-r.left)*(cvE.width/r.width),y:(e.clientY-r.top)*(cvE.height/r.height)}}
cvE.addEventListener('mousedown',e=>{let p=gp(e);mP=p;if(tool=='trend'||tool=='box'){isD=true;sP={x1:p.x,y1:p.y,x2:p.x,y2:p.y,type:tool}}else if(tool=='hline'){draws.push({type:'hline',y1:p.y});drawC()}else if(tool=='pen'){isD=true;sP={type:'pen',pts:[p]}}});
cvE.addEventListener('mousemove',e=>{mP=gp(e);if(isD&&sP&&sP.type=='pen'){sP.pts.push(mP);drawC()}});
window.addEventListener('mouseup',()=>{if(isD&&sP){if(sP.x1!==undefined){sP.x2=mP.x;sP.y2=mP.y}draws.push(sP);isD=false;drawC()}});
window.addEventListener('resize',drawC);
</script>
</body>
</html>
