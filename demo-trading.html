<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Master Pro</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:Arial;font-size:12px}
body{background:#0b0e11;color:#eaecef;display:flex;flex-direction:column}
.hd{background:#12161c;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #1e2329}
.hd b{color:#f0b90b}.btn{border:none;border-radius:6px;padding:7px 14px;font-weight:bold;cursor:pointer}
.y{background:#f0b90b;color:#000}.r{background:#f6465d;color:#fff}.g{background:#0ecb81;color:#fff}.b{background:#2a5bd7;color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:100}
.box{background:#1e2329;border:1px solid #2b3139;max-width:480px;width:94%;margin:30px auto;padding:20px;border-radius:12px;text-align:center}
.box input{width:100%;padding:10px;margin:8px 0;background:#0b0e11;border:1px solid #2b3139;color:#fff;border-radius:6px}
.ly{flex:1;display:flex;margin:6px;border:1px solid #1e2329;border-radius:8px;overflow:hidden;min-height:0}
.tools{width:48px;background:#12161c;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px;border-right:1px solid #1e2329}
.tools span{font-size:20px;color:#848e9c;cursor:pointer;padding:6px;border-radius:8px}.tools span.on{background:#f0b90b;color:#000}
.cw{flex:1;display:flex;flex-direction:column;min-width:0}.ca{flex:1;background:#fff;min-height:0}#ch{width:100%;height:100%;display:block}
.ob{width:270px;background:#12161c;border-left:1px solid #1e2329;overflow:auto;padding:6px}
.qbar{background:#12161c;display:flex;justify-content:center;align-items:center;gap:12px;padding:10px;border-top:1px solid #1e2329}
.qbar button{width:36px;height:36px;font-size:20px;border-radius:6px;border:none;background:#2b3139;color:#fff;cursor:pointer}
.pos{background:#12161c;margin:0 6px 6px;padding:8px;border-radius:8px;border:1px solid #1e2329;max-height:160px;overflow:auto}
table{width:100%;border-collapse:collapse}td,th{padding:5px;border-bottom:1px solid #1e2329;text-align:left}
.pi{background:#2b3139;padding:12px;margin:8px;border-radius:8px;cursor:pointer;font-weight:bold}.pi:hover{border:1px solid #f0b90b}
</style>
</head>
<body>
<div class="hd"><div><b>Trading Master Pro</b> <span id="u" style="color:#848e9c;margin-left:8px"></span></div>
<div>Balance: <b id="bal" style="color:#0ecb81">$0.00</b> <button class="btn y" onclick="openHist()">History</button> <button class="btn r" onclick="location.reload()">Logout</button></div></div>

<div id="login" class="modal" style="display:block"><div class="box"><h2>Login</h2><input id="uid" placeholder="Enter Gmail / ID"><button class="btn y" onclick="login()">Login</button></div></div>

<div id="buyM" class="modal"><div class="box"><h2>Purchase Demo</h2>
<div class="pi" onclick="buy(100)">Buy $100</div><div class="pi" onclick="buy(1000)">Buy $1000</div><div class="pi" onclick="buy(10000)">Buy $10000</div><div class="pi" onclick="buy(100000)">Buy $100000</div>
<button class="btn b" onclick="hide('buyM')">Close</button></div></div>

<div id="histM" class="modal"><div class="box"><h2>History Panel</h2>
<button class="btn y" onclick="showH('h')">History</button> <button class="btn b" onclick="showH('b')">Balance View</button>
<div id="hBody" style="text-align:left;margin-top:12px;max-height:300px;overflow:auto"></div><br>
<button class="btn r" onclick="hide('histM')">Close</button></div></div>

<div id="closeM" class="modal"><div class="box" style="text-align:left"><h2>Close Trade Confirm</h2><div id="cInfo" style="background:#0b0e11;padding:10px;border-radius:8px"></div><br>
<button class="btn y" style="width:100%;padding:12px" onclick="doClose()">Confirm Close</button><br><br><button class="btn b" style="width:100%" onclick="hide('closeM')">Cancel</button></div></div>

<div style="background:#12161c;padding:6px 10px;display:flex;gap:10px;align-items:center">
<select id="sym"><option>BTCUSDT</option><option>ETHUSDT</option></select><b id="lp" style="color:#0ecb81">$0</b>
<button class="btn y" style="margin-left:auto" onclick="show('buyM')">Purchase</button></div>

<div class="ly">
<div class="tools">
<span class="on" onclick="setT('cross',this)">✛</span><span onclick="setT('trend',this)">╱</span><span onclick="setT('box',this)">▢</span><span onclick="setT('pen',this)">✎</span><span onclick="setT('hline',this)">―</span><span onclick="clearD()">🗑</span>
</div>
<div class="cw"><div class="ca"><canvas id="ch"></canvas></div></div>
<div class="ob"><b>Order Book</b><div id="oba"></div><div id="mid" style="text-align:center;padding:6px;font-weight:bold"></div><div id="obb"></div></div>
</div>

<div class="qbar">
<button onclick="cq(-10)">-</button><input id="qty" type="number" value="10" style="width:90px;text-align:center;padding:8px;border-radius:6px;border:1px solid #2b3139;background:#1e2329;color:#fff"><button onclick="cq(10)">+</button>
<button class="btn g" style="padding:10px 30px" onclick="trade('BUY')">Buy / Long</button>
<button class="btn r" style="padding:10px 30px" onclick="trade('SELL')">Sell / Short</button>
</div>

<div class="pos"><b style="color:#f0b90b">Positions (<span id="pc">0</span>)</b><table><thead><tr><th>Sym</th><th>Side</th><th>Qty</th><th>PNL</th><th>Close</th></tr></thead><tbody id="pb"></tbody></table></div>

<script>
let uid=null,bal=0,trades=[],hist=[],candles=[],price=0,off=0,tool='cross',draws=[],isD=false,sP=null,mP=null,ci=-1;
const $=id=>document.getElementById(id);
function show(i){$(i).style.display='block'}function hide(i){$(i).style.display='none'}
function login(){let v=$('uid').value.trim();if(!v)return alert('Enter ID');uid=v;$('u').innerText=v;
let a=JSON.parse(localStorage.getItem('allB')||'{}');if(!(v in a))a[v]=0;localStorage.setItem('allB',JSON.stringify(a));bal=a[v];
trades=JSON.parse(localStorage.getItem('tr_'+v)||'[]');hist=JSON.parse(localStorage.getItem('hi_'+v)||'[]');hide('login');upd();}
function save(){let a=JSON.parse(localStorage.getItem('allB')||'{}');a[uid]=bal;localStorage.setItem('allB',JSON.stringify(a));localStorage.setItem('tr_'+uid,JSON.stringify(trades));localStorage.setItem('hi_'+uid,JSON.stringify(hist));}
function upd(){$('bal').innerText='$'+bal.toFixed(2);updPos();}
function buy(a){bal=a;save();upd();hide('buyM');}
function cq(d){$('qty').value=Math.max(1,(parseFloat($('qty').value)||10)+d)}
function trade(s){if(bal<=0){show('buyM');return alert('Purchase first');}let q=parseFloat($('qty').value)||10;trades.push({sym:$('sym').value,side:s,qty:q,entry:price});save();updPos();}
function setT(t,e){tool=t;document.querySelectorAll('.tools span').forEach(x=>x.classList.remove('on'));e.classList.add('on')}
function clearD(){draws=[];drawC()}
function openHist(){show('histM');showH('h')}
function showH(w){if(w==='h'){let h=hist.map(x=>'<div style="display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid #222"><span>'+x.d+'</span><span style="color:'+(x.pnl>=0?'#0ecb81':'#f6465d')+'">$'+x.pnl.toFixed(2)+'</span></div>').join('')||'No history';$('hBody').innerHTML='<b>20 Days History (oldest auto-delete on 21st)</b><br>'+h;}else{$('hBody').innerHTML='<b>Balance View</b><br><div style="font-size:20px;color:#0ecb81;margin-top:10px">Balance: $'+bal.toFixed(2)+'</div><div style="color:#848e9c">User: '+uid+'</div>';}}
function updPos(){$('pc').innerText=trades.length;$('pb').innerHTML=trades.map((t,i)=>{let pnl=t.side==='BUY'?(price-t.entry)*t.qty*0.001:-(price-t.entry)*t.qty*0.001;return '<tr><td>'+t.sym+'</td><td style="color:'+(pnl>=0?'#0ecb81':'#f6465d')+'">'+t.side+'</td><td>'+t.qty+'</td><td style="color:'+(pnl>=0?'#0ecb81':'#f6465d')+'">'+pnl.toFixed(2)+'</td><td><button class="btn y" onclick="openC('+i+')">Close</button></td></tr>'}).join('')||'<tr><td colspan=5 style="text-align:center;color:#555">No positions</td></tr>'}
function openC(i){ci=i;let t=trades[i];let pnl=t.side==='BUY'?(price-t.entry)*t.qty*0.001:-(price-t.entry)*t.qty*0.001;$('cInfo').innerHTML='Sym:'+t.sym+'<br>Side:'+t.side+'<br>PNL:$'+pnl.toFixed(2);show('closeM')}
function doClose(){let t=trades[ci];let pnl=t.side==='BUY'?(price-t.entry)*t.qty*0.001:-(price-t.entry)*t.qty*0.001;bal+=pnl;hist.push({d:new Date().toLocaleDateString(),pnl:pnl});while(hist.length>20)hist.shift();trades.splice(ci,1);hide('closeM');save();upd();}

async function loadLive(){try{let s=$('sym').value;let r=await fetch('https://api.binance.com/api/v3/klines?symbol='+s+'&interval=1m&limit=50');let j=await r.json();candles=j.map(k=>({o:+k[1],h:+k[2],l:+k[3],c:+k[4]}));price=candles[candles.length-1].c;off=Math.max(0,candles.length-28);}catch(e){if(!candles.length){for(let i=0;i<50;i++){let o=price||50000;price=o+(Math.random()-0.5)*200;candles.push({o,h:Math.max(o,price),l:Math.min(o,price),c:price})}off=0;}}
function drawC(){let cv=$('ch'),p=cv.parentElement.getBoundingClientRect();cv.width=p.width;cv.height=p.height;let ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);if(!candles.length)return;
let all=candles.flatMap(k=>[k.h,k.l]),mn=Math.min(...all),mx=Math.max(...all),rg=mx-mn||1;let cw=cv.width/40,vis=candles.slice(off,off+28);
vis.forEach((k,i)=>{let x=i*cw,y=v=>cv.height-10-((v-mn)/rg)*(cv.height-20);let up=k.c>=k.o,col=up?'#0ecb81':'#f6465d';ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+cw/2,y(k.h));ctx.lineTo(x+cw/2,y(k.l));ctx.stroke();let bh=Math.max(Math.abs(y(k.c)-y(k.o)),4);ctx.fillRect(x+cw*0.2,Math.min(y(k.c),y(k.o)),cw*0.6,bh);});
ctx.strokeStyle='#333';draws.forEach(d=>{if(d.type==='trend'){ctx.beginPath();ctx.moveTo(d.x1,d.y1);ctx.lineTo(d.x2,d.y2);ctx.stroke()}if(d.type==='hline'){ctx.beginPath();ctx.moveTo(0,d.y1);ctx.lineTo(cv.width,d.y1);ctx.stroke()}if(d.type==='box')ctx.strokeRect(Math.min(d.x1,d.x2),Math.min(d.y1,d.y2),Math.abs(d.x2-d.x1),Math.abs(d.y2-d.y1));if(d.type==='pen'){ctx.beginPath();d.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}});}
function updOB(){let a='',b='';for(let i=0;i<10;i++){a+='<div style="display:flex;justify-content:space-between"><span style="color:#f6465d">'+(price+(10-i)*5).toFixed(1)+'</span><span>'+(Math.random()*1).toFixed(3)+'</span></div>'}for(let i=0;i<10;i++){b+='<div style="display:flex;justify-content:space-between"><span style="color:#0ecb81">'+(price-(i+1)*5).toFixed(1)+'</span><span>'+(Math.random()*1).toFixed(3)+'</span></div>'}$('oba').innerHTML=a;$('obb').innerHTML=b;$('mid').innerText=price.toFixed(1);$('lp').innerText='$'+price.toFixed(2);}
async function tick(){try{let s=$('sym').value;let r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol='+s);let j=await r.json();price=parseFloat(j.price);let l=candles[candles.length-1];if(l){l.c=price;if(price>l.h)l.h=price;if(price<l.l)l.l=price}}catch(e){price+=(Math.random()-0.5)*50}drawC();updOB();updPos();}
loadLive().then(()=>{drawC();setInterval(tick,2000);setInterval(loadLive,60000);});
let cvE=$('ch');function gp(e){let r=cvE.getBoundingClientRect();return{x:(e.clientX-r.left)*(cvE.width/r.width),y:(e.clientY-r.top)*(cvE.height/r.height)}}
cvE.addEventListener('mousedown',e=>{let p=gp(e);mP=p;if(tool==='trend'||tool==='box'){isD=true;sP={x1:p.x,y1:p.y,x2:p.x,y2:p.y,type:tool}}else if(tool==='hline'){draws.push({type:'hline',y1:p.y});drawC()}else if(tool==='pen'){isD=true;sP={type:'pen',pts:[p]}}});
cvE.addEventListener('mousemove',e=>{mP=gp(e);if(isD&&sP&&sP.type==='pen'){sP.pts.push(mP);drawC()}});
window.addEventListener('mouseup',()=>{if(isD&&sP){if(sP.x1!==undefined){sP.x2=mP.x;sP.y2=mP.y}draws.push(sP);isD=false;drawC()}});
window.addEventListener('resize',drawC);
</script>
</body>
</html>
