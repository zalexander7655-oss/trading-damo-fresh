<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Demo Trading Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:#0e1117;color:#fff;font-family:Arial;margin:0;text-align:center}
.header{background:#161b22;padding:15px;display:flex;justify-content:space-between}
.btn{background:#00c853;color:#fff;border:none;padding:12px 25px;border-radius:5px;cursor:pointer;font-weight:bold;font-size:16px;margin:10px}
.btn-red{background:#ff3d00}
.card{background:#161b22;margin:15px;padding:20px;border-radius:10px}
</style>
</head>
<body>
<div class="header">
<div><b>Global Demo Trading Pro</b></div>
<div><span id="balance" style="color:#00c853;">$100,000.00</span></div>
</div>

<div id="welcomeCard" class="card">
<h1>Welcome to Live Demo Trading</h1>
<p>Practice with $100,000 virtual money.</p>
<button class="btn" id="startBtn">Start Now Trading</button>
</div>

<div id="tradingPanel" class="card" style="display:none;">
<h3><select id="symbol"><option>EUR/USD</option><option>BTC/USD</option><option>ETH/USD</option><option>AAPL</option><option>GOLD</option></select>
<span id="livePrice" style="color:#00c853;">$50000</span></h3>
<canvas id="chart" height="200"></canvas><br>
Lot: <input type="number" id="lot" value="1" style="width:60px">
<button class="btn" onclick="trade('BUY')">BUY</button>
<button class="btn btn-red" onclick="trade('SELL')">SELL</button>
<div id="pos"><p>No trades yet</p></div>
</div>

<script>
let price = 50000;
let arr = [];
for(let i=0;i<50;i++){ arr.push(50000 + Math.random()*500); }

document.getElementById('startBtn').addEventListener('click', function(){
  document.getElementById('welcomeCard').style.display = 'none';
  document.getElementById('tradingPanel').style.display = 'block';
  
  let ctx = document.getElementById('chart').getContext('2d');
  window.myChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: Array(50).fill(''),
      datasets: [{ label: 'Price', data: arr, borderColor: '#00c853', borderWidth: 2, pointRadius: 0 }]
    },
    options: { animation: false }
  });

  setInterval(function(){
    price = price + (Math.random() - 0.48) * 200;
    arr.push(price); arr.shift();
    window.myChart.data.datasets[0].data = arr;
    window.myChart.update();
    document.getElementById('livePrice').innerText = '$' + price.toFixed(2);
  }, 1000);
});

function trade(type){
  let s = document.getElementById('symbol').value;
  document.getElementById('pos').innerHTML += '<p>'+type+' '+s+' @ $'+price.toFixed(2)+'</p>';
  alert(type + ' Demo Order Placed');
}
</script>
</body>
</html>
