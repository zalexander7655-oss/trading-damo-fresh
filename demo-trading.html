<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Binance Candles</title>
<style>
html,body{margin:0;height:100%;background:#0b0e11;overflow:hidden}
#wrap{width:100%;height:100vh;position:relative;background:#0b0e11}
#ch{width:100%;height:100%;display:block}
#sym{position:absolute;top:10px;left:10px;background:#1e2329;color:#fff;border:1px solid #2b3139;padding:6px;border-radius:4px;z-index:10}
#price{position:absolute;top:10px;left:140px;color:#0ecb81;font-weight:bold;font-family:Arial;z-index:10;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:4px}
</style>
</head>
<body>
<div id="wrap">
<select id="sym"><option>BTCUSDT</option><option>ETHUSDT</option><option>BNBUSDT</option></select>
<div id="price">$0</div>
<canvas id="ch"></canvas>
</div>
<script>
let candles=[],price=0;
const cv=document.getElementById('ch'),ctx=cv.getContext('2d');
const symEl=document.getElementById('sym'),priceEl=document.getElementById('price');

async function load(){
let s=symEl.value;
let r=await fetch('https://api.binance.com/api/v3/klines?symbol='+s+'&interval=1s&limit=100');
let j=await r.json();
candles=j.map(k=>({o:+k[1],h:+k[2],l:+k[3],c:+k[4],t:k[0]}));
price=candles[candles.length-1].c;
}
function draw(){
let w=cv.parentElement.clientWidth,h=cv.parentElement.clientHeight;
cv.width=w;cv.height=h;
ctx.fillStyle='#0b0e11';ctx.fillRect(0,0,w,h);
if(!candles.length)return;
let all=candles.flatMap(k=>[k.h,k.l]),mn=Math.min(...all),mx=Math.max(...all);
let pad=(mx-mn)*0.2;mn-=pad;mx+=pad;let rg=mx-mn||1;
let totalSlots=40; // 30% khali = 28 candle + 12 empty
let visCount=28;
let cw=w/totalSlots;
let vis=candles.slice(-visCount);
// grid
ctx.strokeStyle='#1e2329';ctx.lineWidth=1;
for(let i=0;i<5;i++){let y=h/5*i;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}

vis.forEach((k,i)=>{
let x=i*cw;
let y=v=>h-20-((v-mn)/rg)*(h-40);
let up=k.c>=k.o,col=up?'#0ecb81':'#f6465d';
ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.5;
ctx.beginPath();ctx.moveTo(x+cw/2,y(k.h));ctx.lineTo(x+cw/2,y(k.l));ctx.stroke();
let yo=y(k.o),yc=y(k.c);
let bh=Math.max(Math.abs(yc-yo),2);
ctx.fillRect(x+cw*0.2,Math.min(yo,yc),cw*0.6,bh);
});
// last 40 second highlight - last candle live
let last=vis[vis.length-1];
if(last){
let y=v=>h-20-((v-mn)/rg)*(h-120);
let yp=y(last.c);
ctx.strokeStyle='rgba(240,185,11,.6)';ctx.setLineDash([4,4]);
ctx.beginPath();ctx.moveTo(0,yp);ctx.lineTo(w,yp);ctx.stroke();ctx.setLineDash([]);
ctx.fillStyle='#f0b90b';ctx.fillRect(w-70,yp-10,70,20);
ctx.fillStyle='#000';ctx.font='12px Arial';ctx.fillText(price.toFixed(2),w-65,yp+4);
}
priceEl.innerText='$'+price.toFixed(2);
priceEl.style.color=candles[candles.length-1].c>=candles[candles.length-1].o?'#0ecb81':'#f6465d';
}

// live via websocket 1s kline
let ws;
function connectWS(){
if(ws)ws.close();
let s=symEl.value.toLowerCase();
ws=new WebSocket('wss://stream.binance.com:9443/ws/'+s+'@kline_1s');
ws.onmessage=e=>{
let k=JSON.parse(e.data).k;
price=parseFloat(k.c);
let last=candles[candles.length-1];
if(k.t==last.t){
last.c=price;last.h=Math.max(last.h,price);last.l=Math.min(last.l,price);
}else{
// new 1 second candle, 40 second visible rakho
candles.push({o:parseFloat(k.o),h:parseFloat(k.h),l:parseFloat(k.l),c:price,t:k.t});
if(candles.length>200)candles.shift();
}
draw();
};
}
symEl.onchange=()=>{load().then(()=>{draw();connectWS();});};
load().then(()=>{draw();connectWS();});
window.onresize=draw;
setInterval(draw,1000);
</script>
</body>
</html>
