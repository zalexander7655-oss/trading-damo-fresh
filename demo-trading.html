<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Master Pro - Final Center</title>
<style>
body{background:#0b0e11;color:#fff;font-family:Arial;margin:0;font-size:14px}
.header{background:#12161c;padding:8px 10px;display:flex;justify-content:space-between;align-items:center}
.btn{background:#0ecb81;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-weight:bold}
.btn-blue{background:#2a5bd7}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:300}
.box{background:#1e2329;margin:30px auto;padding:20px;width:95%;max-width:450px;border-radius:10px;max-height:85%;overflow:auto;text-align:center}
.plan-btn{background:#2a5bd7;color:#fff;border:none;padding:12px;width:100%;margin:6px 0;border-radius:6px;cursor:pointer;font-weight:bold}
.already-btn{background:#0ecb81;color:#fff;border:none;padding:12px;width:100%;margin:10px 0;border-radius:6px;cursor:pointer;font-weight:bold}
.filter-btn{padding:12px 20px;margin:8px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;width:80%}
.trade-layout{display:flex;height:520px;background:#0b0e11;margin:8px;border-radius:8px;overflow:hidden;border:1px solid #1e2329}
.left-tools{width:46px;background:#12161c;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:16px;border-right:1px solid #1e2329}
.left-tools span{font-size:18px;opacity:0.6;cursor:pointer;padding:5px;border-radius:6px}.left-tools span.active{opacity:1;background:#2a5bd7}
.chart-area{flex:1;position:relative;min-width:0}#chart{width:100%;height:100%;display:block;cursor:crosshair}
#candleTip{position:absolute;display:none;background:#1e2329;border:1px solid #333;padding:8px;border-radius:6px;font-size:11px;pointer-events:none;z-index:10}
.center-trade{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;gap:20px;z-index:20}
.center-buy{background:#0ecb81;color:#fff;border:none;padding:18px 35px;border-radius:8px;font-weight:bold;font-size:18px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.5)}
.center-sell{background:#f6465d;color:#fff;border:none;padding:18px 35px;border-radius:8px;font-weight:bold;font-size:18px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.5)}
.right-panel{width:220px;min-width:220px;background:#0e1116;border-left:1px solid #1e2329;overflow:auto;font-size:11px;padding:6px}
.pos-table{background:#12161c;margin:8px;padding:8px;border-radius:8px;overflow:auto}
table.main{width:100%;border-collapse:collapse;font-size:11px}table.main th,table.main td{border-bottom:1px solid #222;padding:6px;text-align:left}
.pct-btn{background:#1e2329;border:1px solid #333;color:#aaa;padding:5px 7px;border-radius:4px;font-size:10px;cursor:pointer}
.pct-btn.sel{background:#f0b90b;color:#000;font-weight:bold}
input.login{width:90%;padding:10px;margin:6px;background:#0b0e11;border:1px solid #333;color:#fff;border-radius:6px}
.confirm-btn{background:#f0b90b;color:#000;border:none;padding:12px 30px;border-radius:6px;font-weight:bold;cursor:pointer}
.cancel-btn{background:#2a2e35;color:#fff;border:1px solid #444;padding:12px 30px;border-radius:6px;cursor:pointer}
.mini-btn{background:#2a2e35;color:#fff;border:1px solid #444;padding:4px 7px;border-radius:4px;font-size:10px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<div><b style="color:#f0b90b">Trading Master Pro</b></div>
<div>Balance: <b id="balance" style="color:#0ecb81;">$0.00</b>
<button class="btn btn-blue" style="padding:6px 10px;background:#6c757d" onclick="showHistory()">History</button>
</div>
</div>

<div id="loginModal" class="modal" style="display:block"><div class="box">
<h2>Login / Create ID</h2><input class="login" id="username" placeholder="Enter your ID">
<button class="btn" style="width:95%;margin-top:10px" onclick="doLogin()">Login</button>
</div></div>

<div id="purchaseModal" class="modal"><div class="box">
<h2>Purchase Price Now</h2>
<button class="plan-btn" onclick="buyDemo(20)">1 Price $1 - Get $20</button>
<button class="plan-btn" onclick="buyDemo(10000)">2 Price $12 - Get $10000</button>
<button class="plan-btn" onclick="buyDemo(30000)">3 Price $25 - Get $30000</button>
<button class="plan-btn" onclick="buyDemo(60000)">4 Price $40 - Get $60000</button>
<button class="plan-btn" onclick="buyDemo(80000)">5 Price $50 - Get $80000</button>
<button class="plan-btn" onclick="buyDemo(100000)">6 Price $65 - Get $100000</button>
<hr style="border-color:#333"><button class="already-btn" onclick="alreadyPurchased()">Already Purchased</button>
</div></div>

<div id="closeModal" class="modal"><div class="box" style="text-align:left">
<h3>Market Close</h3><div style="display:flex;gap:6px;margin:12px 0">
<button class="pct-btn" onclick="selClosePct(10,this)">10%</button><button class="pct-btn" onclick="selClosePct(25,this)">25%</button><button class="pct-btn" onclick="selClosePct(50,this)">50%</button><button class="pct-btn" onclick="selClosePct(75,this)">75%</button><button class="pct-btn sel" onclick="selClosePct(100,this)">100%</button>
</div><p id="closeInfo" style="font-size:12px;color:#aaa"></p>
<div style="display:flex;gap:10px;justify-content:center"><button class="confirm-btn" onclick="confirmClose()">Confirm</button><button class="cancel-btn" onclick="document.getElementById('closeModal').style.display='none'">Cancel</button></div>
</div></div>

<div id="historyModal" class="modal"><div class="box"><h2>History</h2>
<div id="histMenu"><button class="filter-btn" style="background:#2a5bd7;color:#fff" onclick="openHistView('all')">History</button><br><button class="filter-btn" style="background:#0ecb81;color:#fff" onclick="openHistView('profit')">Profit</button><br><button class="filter-btn" style="background:#f6465d;color:#fff" onclick="openHistView('loss')">Loss</button><br><button class="filter-btn" style="background:#444;color:#fff" onclick="document.getElementById('historyModal').style.display='none'">Close</button></div>
<div id="histView" style="display:none"><button onclick="backToMenu()">Back</button><p><b id="viewTotal"></b></p><table class="main"><tbody id="histBody"></tbody></table></div>
</div></div>

<div id="tradingPanel">
<div style="display:flex;gap:10px;align-items:center;padding:8px">
<select id="symbol" style="padding:8px;background:#1e2329;color:#fff"><option>BTCUSDT</option><option>ETHUSDT</option></select>
<span id="livePrice" style="color:#0ecb81;font-weight:bold">$50000</span>
<button class="btn btn-blue" style="padding:4px 8px" onclick="clearDrawings()">Clear Draw</button>
</div>
<div class="trade-layout">
<div class="left-tools"><span id="t-cross" class="active" onclick="setTool('cross')">✛</span><span id="t-trend" onclick="setTool('trend')">📈</span><span id="t-box" onclick="setTool('box')">▭</span><span id="t-pen" onclick="setTool('pen')">✎</span><span id="t-zoom" onclick="setTool('zoom')">🔍</span></div>
<div class="chart-area"><canvas id="chart" width="800" height="520"></canvas><div id="candleTip"></div>
<div class="center-trade"><button class="center-buy" onclick="centerTrade('BUY')">Buy</button><button class="center-sell" onclick="centerTrade('SELL')">Sell</button></div>
</div>
<div class="right-panel"><div id="orderBook"></div>
<div style="margin-top:8px">Qty: <input id="lot" type="number" value="0.01" step="0.01" style="width:60px;background:#1e2329;color:#fff;border:1px solid #333"></div>
</div>
</div>
<div class="pos-table"><h4 style="color:#f0b90b">Positions (<span id="posCount">0</span>)</h4><table class="main"><tbody id="posBody"></tbody></table></div>
</div>

<script>
let balance=0,price=50000,candles=[],myTrades=[],tradeHistory=[],tick=0,demoOn=false,offset=0,feedStarted=false;
let activeTool='cross',drawings=[],isDrawing=false,startPos=null,mousePos=null,zoomLevel=1,currentUser=null,closeIndex=-1,closePct=100;
function uk(k){return 'tm_'+currentUser+'_'+k;}
function saveState(){if(!currentUser)return;try{localStorage.setItem(uk('balance'),balance);localStorage.setItem(uk('demoOn'),demoOn?'1':'0');localStorage.setItem(uk('trades'),JSON.stringify(myTrades));localStorage.setItem(uk('history'),JSON.stringify(tradeHistory));localStorage.setItem('tm_lastUser',currentUser);}catch(e){}}
function loadUser(u){currentUser=u;let b=localStorage.getItem(uk('balance'));balance=b?parseFloat(b):0;demoOn=localStorage.getItem(uk('demoOn'))==='1';let t=localStorage.getItem(uk('trades'));myTrades=t?JSON.parse(t):[];let h=localStorage.getItem(uk('history'));tradeHistory=h?JSON.parse(h):[];document.getElementById('balance').innerText='$'+balance.toFixed(2);}
function doLogin(){let u=document.getElementById('username').value.trim();if(!u){alert('Enter ID');return;}loadUser(u);document.getElementById('loginModal').style.display='none';if(!demoOn){document.getElementById('purchaseModal').style.display='block';}else{startTrading();}}
function showPurchase(){document.getElementById('purchaseModal').style.display='block';}
function alreadyPurchased(){if(!demoOn){alert('Please buy Price first');return;}document.getElementById('purchaseModal').style.display='none';startTrading();}
function buyDemo(amt){balance=amt;demoOn=true;document.getElementById('balance').innerText='$'+balance.toFixed(2);saveState();document.getElementById('purchaseModal').style.display='none';startTrading();}
function startTrading(){if(!feedStarted){feedStarted=true;startFeed();}updatePos();}
function centerTrade(side){
if(!demoOn || balance<=0){
document.getElementById('purchaseModal').style.display='block';
return;
}
openTrade(side);
}
for(let i=0;i<80;i++){let o=price,c=o+(Math.random()-0.5)*200;candles.push({o,h:Math.max(o,c)+50,l:Math.min(o,c)-50,c});price=c;}offset=candles.length-50;
function setTool(t){if(t==='zoom'){zoomLevel=zoomLevel===1?1.5:1;drawChart();return;}activeTool=t;document.querySelectorAll('.left-tools span').forEach(s=>s.classList.remove('active'));}
function clearDrawings(){drawings=[];drawChart();}
function drawChart(){let cv=document.getElementById('chart'),ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);let all=candles.flatMap(k=>[k.h,k.l]),mn=Math.min(...all),mx=Math.max(...all),rg=(mx-mn||1)/zoomLevel;let chartW=cv.width*0.78,vis=candles.slice(offset,offset+50),cw=chartW/50;vis.forEach((k,i)=>{let x=i*cw,y=v=>cv.height-20-((v-mn)/rg)*(cv.height-40),col=k.c>=k.o?'#0ecb81':'#f6465d';ctx.strokeStyle=col;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x+cw/2,y(k.h));ctx.lineTo(x+cw/2,y(k.l));ctx.stroke();let yo=y(k.o),yc=y(k.c);ctx.fillRect(x+1,Math.min(yo,yc),cw-2,Math.abs(yc-yo)||2);});}
function startFeed(){drawChart();setInterval(()=>{tick++;let last=candles[candles.length-1];price=last.c+(Math.random()-0.49)*90;last.c=price;if(price>last.h)last.h=price;if(price<last.l)last.l=price;if(tick%8===0){candles.push({o:last.c,h:last.c,l:last.c,c:last.c});offset=candles.length-50;}document.getElementById('livePrice').innerText='$'+price.toFixed(2);drawChart();updatePos();if(tick%4===0)updateBook();if(tick%10===0)saveState();},400);}
function updateBook(){let h='';for(let i=0;i<10;i++){h+='<div style="display:flex;justify-content:space-between"><span style="color:#f6465d">'+(price+i).toFixed(1)+'</span><span>'+(Math.random()*50).toFixed(1)+'</span></div>';}document.getElementById('orderBook').innerHTML=h;}
function openTrade(side){myTrades.push({sym:'BTCUSDT',side,qty:parseFloat(document.getElementById('lot').value),entry:price});saveState();updatePos();}
function updatePos(){document.getElementById('posCount').innerText=myTrades.length;let h='';myTrades.forEach((t,i)=>{let pnl=t.side=='BUY'?(price-t.entry)*t.qty*10:-(price-t.entry)*t.qty*10;h+='<tr><td>'+t.side+'</td><td>'+pnl.toFixed(2)+'</td><td><button class="mini-btn" onclick="openCloseModal('+i+')">Market</button></td></tr>';});document.getElementById('posBody').innerHTML=h||'<tr><td>No Positions</td></tr>';}
function openCloseModal(i){closeIndex=i;document.getElementById('closeModal').style.display='block';}
function selClosePct(p,el){closePct=p;document.querySelectorAll('#closeModal.pct-btn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');}
function confirmClose(){let t=myTrades[closeIndex];let pnl=t.side=='BUY'?(price-t.entry)*t.qty*10:-(price-t.entry)*t.qty*10;balance+=pnl*closePct/100;tradeHistory.push({date:new Date().toISOString().slice(0,10),sym:t.sym,pnl:pnl*closePct/100});myTrades.splice(closeIndex,1);document.getElementById('closeModal').style.display='none';document.getElementById('balance').innerText='$'+balance.toFixed(2);saveState();updatePos();}
function showHistory(){document.getElementById('historyModal').style.display='block';}
function openHistView(v){document.getElementById('histMenu').style.display='none';document.getElementById('histView').style.display='block';let h='';tradeHistory.forEach(tr=>{h+='<tr><td>'+tr.date+'</td><td>$'+tr.pnl.toFixed(2)+'</td></tr>';});document.getElementById('histBody').innerHTML=h;}
function backToMenu(){document.getElementById('histMenu').style.display='block';document.getElementById('histView').style.display='none';}
window.addEventListener('beforeunload',saveState);
</script>
</body>
</html>
