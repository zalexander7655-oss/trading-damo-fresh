<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Master Pro - Live Demo Fixed</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial;overflow:hidden;background:#0b0e11;color:#eaecef;font-size:13px}
body{display:flex;flex-direction:column}
.hd{background:#12161c;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #f0b90b;flex-shrink:0}
.hd b{color:#f0b90b}
.btn{border:none;border-radius:6px;padding:8px 16px;font-weight:bold;cursor:pointer}
.y{background:#f0b90b;color:#000}.r{background:#f6465d;color:#fff}.b{background:#2a5bd7;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:200}
.box{background:#1e2329;border:1px solid #f0b90b;max-width:420px;width:94%;margin:60px auto;padding:22px;border-radius:14px;text-align:center}
.pi{background:#0b0e11;border:1px solid #2b3139;padding:13px;margin:8px;border-radius:8px;cursor:pointer;font-weight:bold;color:#fff}
.main{flex:1;display:flex;min-height:0;margin:6px;gap:6px}
.tools{width:50px;background:#12161c;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:16px;border:1px solid #1e2329}
.tools span{font-size:20px;cursor:pointer;color:#848e9c;padding:6px;border-radius:6px}.tools span.on{background:#f0b90b;color:#000}
.mid{flex:1;display:flex;flex-direction:column;min-width:0}
.chartBox{flex:1;background:#0b0e11;border:1px solid #1e2329;border-radius:8px;overflow:hidden;min-height:300px}
#ch{width:100%;height:100%;display:block}
.tbar{background:#12161c;border:1px solid #1e2329;border-radius:8px;display:flex;justify-content:center;align-items:center;gap:12px;padding:12px;margin-top:6px}
.tbar input{width:80px;text-align:center;padding:10px;border-radius:6px;border:1px solid #2b3139;background:#0b0e11;color:#fff}
.buyB{background:#0ecb81;color:#fff;padding:14px 40px;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
.sellB{background:#f6465d;color:#fff;padding:14px 40px;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
.ob{width:280px;background:#12161c;border:1px solid #1e2329;border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.ob h4{margin:0;padding:10px;border-bottom:1px solid #1e2329;color:#f0b90b}#obB{flex:1;overflow:hidden;padding:5px;font-size:11px}
.pos{background:#12161c;margin:0 6px 6px;padding:8px;border-radius:8px;border:1px solid #1e2329;max-height:130px;overflow:auto}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #1e2329;text-align:left}
</style>
</head>
<body>
<div class="hd"><div><b>⚡ Trading Master Pro</b> <span id="lp" style="color:#0ecb81;font-weight:bold;margin-left:10px">$0</span></div>
<div>Balance: <b id="bal" style="color:#0ecb81">$0.00</b> <button class="btn y" onclick="showBuy()">Purchase</button> <button class="btn r" onclick="location.reload()">Logout</button></div></div>

<!-- LOGIN - FIXED -->
<div id="loginM" class="modal" style="display:block"><div class="box">
<h2 style="color:#f0b90b">Welcome to Trading Master</h2>
<p style="color:#848e9c">Real Trading jaisa Demo Experience</p>
<input id="uid" placeholder="Enter Your ID" style="width:90%;padding:12px;background:#0b0e11;border:1px solid #333;color:#fff;border-radius:8px;margin:10px 0"><br>
<button class="btn y" style="width:95%;padding:14px;font-size:16px" onclick="doLogin()">Start Trading</button>
</div></div>

<div id="buyM" class="modal" style="display:none"><div class="box"><h2>Purchase Demo Balance</h2>
<div class="pi" onclick="doBuy(20)">$1 - Get $20</div>
<div class="pi" onclick="doBuy(10000)">$12 - Get $10,000</div>
<div class="pi" onclick="doBuy(100000)">$65 - Get $100,000</div>
<button class="btn r" style="margin-top:10px" onclick="hideBuy()">Close</button></div></div>

<div class="main">
<div class="tools"><span class="on">✛</span><span>📈</span><span>▭</span><span>✎</span><span>―</span></div>
<div class="mid"><div class="chartBox"><canvas id="ch"></canvas></div>
<div class="tbar"><input id="qty" value="10" type="number" style="width:70px"><button class="buyB" onclick="trade('BUY')">Buy / Long</button><button class="sellB" onclick="trade('SELL')">Sell / Short</button></div></div>
<div class="ob"><h4>Order Book Live</h4><div id="obB"></div></div>
</div>
<div class="pos"><b style="color:#f0b90b">Positions (<span id="pc">0</span>)</b><table><tbody id="pb"></tbody></table></div>

<script>
// FIXED SIMPLE LOGIC - no error
var bal = 0;
var trades = [];
var candles = [];
var price = 65000;

function doLogin(){
  var u = document.getElementById('uid').value;
  if(u.trim() === ''){ alert('Please Enter ID'); return; }
  // hide login
  document.getElementById('loginM').style.display = 'none';
  // show purchase
  document.getElementById('buyM').style.display = 'block';
  startChart();
}
function showBuy(){ document.getElementById('buyM').style.display='block'; }
function hideBuy(){ document.getElementById('buyM').style.display='none'; }
function doBuy(a){
  bal = a;
  document.getElementById('bal').innerText = '$'+bal.toFixed(2);
  document.getElementById('buyM').style.display='none';
  upd();
}
function trade(s){
  if(bal<=0){ document.getElementById('buyM').style.display='block'; alert('Please Purchase First'); return; }
  var q = parseFloat(document.getElementById('qty').value)||10;
  trades.push({s:s,q:q,e:price});
  upd();
}
function upd(){
  document.getElementById('pc').innerText = trades.length;
  document.getElementById('bal').innerText = '$'+bal.toFixed(2);
  var h='';
  for(var i=0;i<trades.length;i++){
    var t=trades[i];
    var pnl = t.s=='BUY'? (price-t.e)*t.q : -(price-t.e)*t.q;
    var c = pnl>=0? '#0ecb81' : '#f6465d';
    h += '<tr><td>'+t.s+'</td><td style="color:'+c+'">'+pnl.toFixed(2)+'</td><td><button class="btn y" onclick="closeT('+i+')">Close</button></td></tr>';
  }
  document.getElementById('pb').innerHTML = h || '<tr><td style="color:#666">No positions</td></tr>';
}
function closeT(i){
  var t=trades[i];
  var pnl = t.s=='BUY'? (price-t.e)*t.q : -(price-t.e)*t.q;
  bal += pnl; trades.splice(i,1); upd();
}

// chart
for(var i=0;i<60;i++){ var o=price; price+=(Math.random()-0.5)*80; candles.push({o:o,h:o+20,l:o-20,c:price}); }
function draw(){
  var cv=document.getElementById('ch'); if(!cv) return;
  var r=cv.parentElement.getBoundingClientRect(); cv.width=r.width; cv.height=r.height;
  var ctx=cv.getContext('2d'); ctx.fillStyle='#0b0e11'; ctx.fillRect(0,0,cv.width,cv.height);
  var all=[]; candles.forEach(k=>{all.push(k.h);all.push(k.l)});
  var mn=Math.min.apply(null,all), mx=Math.max.apply(null,all), pad=(mx-mn)*0.2; mn-=pad; mx+=pad; var rg=mx-mn||1;
  var total=40, visN=28, cw=cv.width/total, vis=candles.slice(-visN);
  vis.forEach((k,idx)=>{
    var x=idx*cw;
    var y=function(v){return cv.height-10-((v-mn)/rg)*(cv.height-20)};
    var up=k.c>=k.o, col=up?'#0ecb81':'#f6465d';
    ctx.strokeStyle=col; ctx.fillStyle=col;
    ctx.beginPath(); ctx.moveTo(x+cw/2,y(k.h)); ctx.lineTo(x+cw/2,y(k.l)); ctx.stroke();
    var bh=Math.max(Math.abs(y(k.c)-y(k.o)),3);
    ctx.fillRect(x+cw*0.2, Math.min(y(k.c),y(k.o)), cw*0.6, bh);
  });
}
function ob(){
  var h='';
  for(var i=10;i>0;i--){ h+='<div style="display:flex;justify-content:space-between"><span style="color:#f6465d">'+(price+i*5).toFixed(1)+'</span><span>'+(Math.random()).toFixed(4)+'</span></div>'; }
  h+='<div style="text-align:center;padding:6px;color:#fff;font-weight:bold;border-top:1px solid #222;border-bottom:1px solid #222">'+price.toFixed(1)+'</div>';
  for(var i=1;i<=10;i++){ h+='<div style="display:flex;justify-content:space-between"><span style="color:#0ecb81">'+(price-i*5).toFixed(1)+'</span><span>'+(Math.random()).toFixed(4)+'</span></div>'; }
  document.getElementById('obB').innerHTML=h;
  document.getElementById('lp').innerText='$'+price.toFixed(2);
}
function startChart(){
  draw(); ob(); upd();
  setInterval(function(){
    var l=candles[candles.length-1];
    price+=(Math.random()-0.5)*30; l.c=price;
    if(price>l.h)l.h=price; if(price<l.l)l.l=price;
    if(Math.random()<0.08){ candles.push({o:price,h:price,l:price,c:price}); if(candles.length>100)candles.shift(); }
    draw(); ob(); upd();
  },1000);
}
window.addEventListener('resize',draw);
</script>
</body>
</html>
