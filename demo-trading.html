<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Master Pro - Final</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Inter,Arial;font-size:12px;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.hd{height:48px;background:#121212;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.main{flex:1;display:flex;min-height:0}
.left-tools{width:44px;background:#121212;border-right:1px solid #222;display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0}
.left-tools div{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:#1a1a1a;border-radius:6px;cursor:pointer}
.center{flex:1;display:flex;flex-direction:column;min-width:0;background:#000}
.chart-top{height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid #1a1a1a;color:#888;font-size:11px}
#chart{flex:1;width:100%}
.orderbook{width:240px;background:#0e0e0e;border-left:1px solid #222;display:flex;flex-direction:column}
.right-panel{width:300px;background:#121212;border-left:1px solid #222;display:flex;flex-direction:column}
.inp{width:100%;background:#1e1e1e;border:1px solid #2a2a2a;color:#fff;border-radius:6px;padding:10px;margin:6px 0}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:8px}
.buy{background:#0ecb81;color:#fff}.sell{background:#f6465d;color:#fff}
.msg{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#f6465d;color:#fff;padding:14px 22px;border-radius:8px;display:none;z-index:999;font-weight:bold;text-align:center}
</style>
</head>
<body>
<div class="msg" id="topMsg"></div>
<div class="hd">
<div><b style="color:#f3ba2f">TRADING MASTER PRO</b></div>
<div style="display:flex;gap:10px;align-items:center">
<select id="exchangeSel" onchange="switchExchange()" style="background:#1e2329;color:#f3ba2f;border:1px solid #f3ba2f;padding:6px;border-radius:6px;font-weight:bold">
<option value="OKX">OKX - Smooth</option>
<option value="BINANCE">BINANCE</option>
</select>
<span id="livePrice" style="color:#f3ba2f;font-weight:bold">Loading...</span>
</div>
<div>Balance: <b id="balTop" style="color:#f6465d">$0.00</b></div>
</div>

<div class="main">
<div class="left-tools"><div>📈</div><div>✏️</div><div>📏</div><div>⚙️</div></div>
<div class="center">
<div class="chart-top">
<span>Exchange Live - No Lock</span>
<span style="margin-left:auto">BTC/USDT</span>
</div>
<div id="chart"></div>
</div>
<div class="orderbook">
<div style="padding:8px;font-weight:bold;border-bottom:1px solid #222">Order Book</div>
<div id="asks" style="padding:6px;font-family:monospace;font-size:11px;color:#f6465d"></div>
<div id="midPrice" style="text-align:center;padding:6px;font-weight:bold;border-top:1px solid #222;border-bottom:1px solid #222">$0.00</div>
<div id="bids" style="padding:6px;font-family:monospace;font-size:11px;color:#0ecb81"></div>
</div>
<div class="right-panel">
<div style="padding:12px">
<div style="background:#1a1a1a;padding:10px;border-radius:8px;display:flex;justify-content:space-between"><span>Available</span><b id="balBox">$0.00</b></div>
<input class="inp" id="priceInp" placeholder="Price" readonly>
<input class="inp" id="amountInp" value="100" placeholder="Amount USDT">
<input class="inp" id="levInp" value="10" placeholder="Leverage">
<button class="btn buy" onclick="tryTrade('BUY')">BUY / LONG</button>
<button class="btn sell" onclick="tryTrade('SELL')">SELL / SHORT</button>
<button class="btn" style="background:#f3ba2f;color:#000" onclick="location.href='purchase.html'">💳 Purchase Demo</button>
<div id="posList" style="margin-top:10px;color:#888">No trades - Purchase required</div>
</div>
</div>
</div>

<script>
let balance = parseFloat(localStorage.getItem('demo_bal_purchased')||'0');
let currentPrice=0, exchange='OKX', symbol='BTCUSDT', instId='BTC-USDT', chart, candleSeries, ws, okxWs, trades=[];

function showMsg(txt, col='#f6465d'){ const m=document.getElementById('topMsg'); m.innerText=txt; m.style.background=col; m.style.display='block'; setTimeout(()=>m.style.display='none',3500); }
function updateBal(){ document.getElementById('balTop').innerText='$'+balance.toFixed(2); document.getElementById('balTop').style.color=balance>0?'#0ecb81':'#f6465d'; document.getElementById('balBox').innerText='$'+balance.toFixed(2); localStorage.setItem('demo_bal_purchased',balance); }
updateBal();

function tryTrade(side){
  if(balance<=0){ showMsg('⚠️ Please Purchase Demo First Then Start Trading'); return; }
  const amt=parseFloat(document.getElementById('amountInp').value||'0');
  if(amt>balance){ showMsg('⚠️ Balance Finished! Please Purchase Demo First'); return; }
  trades.push({side, price:currentPrice, amount:amt, time:new Date().toLocaleTimeString()});
  document.getElementById('posList').innerHTML=trades.slice(-5).reverse().map(t=>`<div style="background:#1e1e1e;padding:6px;border-radius:6px;margin-bottom:4px"><b style="color:${t.side=='BUY'?'#0ecb81':'#f6465d'}">${t.side}</b> $${t.amount} @ $${t.price.toFixed(2)}<br><small>${t.time}</small></div>`).join('');
  showMsg(side+' Order Placed @ $'+currentPrice.toFixed(2),'#0ecb81');
}

const chartEl=document.getElementById('chart');
chart=LightweightCharts.createChart(chartEl,{layout:{background:{color:'#000'},textColor:'#888'},grid:{vertLines:{color:'#111'},horzLines:{color:'#111'}}});
candleSeries=chart.addCandlestickSeries({upColor:'#0ecb81',downColor:'#f6465d'});

async function loadOKX(){ try{ const r=await fetch(`https://www.okx.com/api/v5/market/candles?instId=${instId}&bar=1m&limit=200`); const j=await r.json(); if(j.data){ const d=j.data.map(x=>({time:parseInt(x[0])/1000,open:+x[1],high:+x[2],low:+x[3],close:+x[4]})).reverse(); candleSeries.setData(d);} }catch(e){} }
async function loadBinance(){ try{ const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1m&limit=200`); const d=await r.json(); const c=d.map(x=>({time:x[0]/1000,open:+x[1],high:+x[2],low:+x[3],close:+x[4]})); candleSeries.setData(c);}catch(e){} }

function connectOKX(){
  if(ws) ws.close(); if(okxWs) okxWs.close();
  okxWs=new WebSocket('wss://ws.okx.com:8443/ws/v5/public');
  okxWs.onopen=()=>{ okxWs.send(JSON.stringify({op:'subscribe',args:[{channel:'tickers',instId:instId},{channel:'books',instId:instId},{channel:'candle1m',instId:instId}]})); };
  okxWs.onmessage=(e)=>{
    const msg=JSON.parse(e.data); if(!msg.data) return; const d=msg.data[0];
    if(msg.arg.channel==='tickers'){ currentPrice=parseFloat(d.last); document.getElementById('livePrice').innerText='$'+currentPrice.toFixed(2); document.getElementById('midPrice').innerText='$'+currentPrice.toFixed(2); document.getElementById('priceInp').value=currentPrice.toFixed(2); }
    if(msg.arg.channel==='books'){ document.getElementById('asks').innerHTML=d.asks.slice(0,6).map(a=>`<div style="display:flex;justify-content:space-between"><span>${parseFloat(a[0]).toFixed(2)}</span><span>${parseFloat(a[1]).toFixed(4)}</span></div>`).join(''); document.getElementById('bids').innerHTML=d.bids.slice(0,6).map(b=>`<div style="display:flex;justify-content:space-between"><span>${parseFloat(b[0]).toFixed(2)}</span><span>${parseFloat(b[1]).toFixed(4)}</span></div>`).join(''); }
    if(msg.arg.channel==='candle1m'){ candleSeries.update({time:parseInt(d[0])/1000,open:+d[1],high:+d[2],low:+d[3],close:+d[4]}); }
  };
}
function connectBinance(){
  if(ws) ws.close(); if(okxWs) okxWs.close();
  ws=new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@trade/${symbol.toLowerCase()}@kline_1m`);
  ws.onmessage=(e)=>{
    const m=JSON.parse(e.data);
    if(m.e==='trade'){ currentPrice=parseFloat(m.p); document.getElementById('livePrice').innerText='$'+currentPrice.toFixed(2); document.getElementById('midPrice').innerText='$'+currentPrice.toFixed(2); document.getElementById('priceInp').value=currentPrice.toFixed(2); }
    if(m.e==='kline'){ const k=m.k; candleSeries.update({time:k.t/1000,open:+k.o,high:+k.h,low:+k.l,close:+k.c}); }
  };
}
function switchExchange(){ exchange=document.getElementById('exchangeSel').value; if(exchange==='OKX'){ loadOKX(); connectOKX(); } else { loadBinance(); connectBinance(); } }

loadOKX(); connectOKX();
</script>
</body>
</html>
