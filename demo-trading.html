<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Master - Paid Demo</title>
<style>
body{margin:0;font-family:Arial;background:#0e0e14;color:#fff}
.header{background:#1a1a2e;padding:15px;display:flex;justify-content:space-between;align-items:center}
.balance{color:#00ff88;font-weight:bold}
.container{display:flex;height:82vh}
.chart-area{flex:3;background:#13131f}
.sidebar{flex:1;background:#1a1a2e;padding:12px;overflow:auto}
canvas{width:100%;height:100%}
button{padding:10px 18px;margin:5px;border:none;cursor:pointer;font-weight:bold;border-radius:4px}
.buy{background:#00c853;color:#fff}.sell{background:#ff3d00;color:#fff}.plan{background:#2962ff;color:#fff;width:100%;margin:8px 0}
input,select{padding:8px;margin:5px;width:92%;background:#222;color:#fff;border:1px solid #444}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;z-index:100}
.modal-box{background:#1e1e2f;padding:25px;border-radius:8px;width:340px;text-align:center}
.locked{opacity:0.4;pointer-events:none}
</style>
</head>
<body>
<div class="header">
<div><h2>Trading Master</h2></div>
<div>Demo Balance: $<span id="balance" class="balance">0</span> | <button onclick="showPlans()">Buy Demo</button></div>
</div>

<div id="buyModal" class="modal">
<div class="modal-box">
<h3>Purchase Demo Balance to Start Learning</h3>
<p>Select a plan to activate demo trading:</p>
<button class="plan" onclick="buyDemo(10000,'Basic - $12')">Basic: $10,000 Demo - $12</button>
<button class="plan" onclick="buyDemo(50000,'Pro - $25')">Pro: $50,000 Demo - $25</button>
<button class="plan" onclick="buyDemo(100000,'Master - $40')">Master: $100,000 Demo - $40</button>
<p style="font-size:12px;color:#aaa">Demo is for learning only. Not real money trading.</p>
</div>
</div>

<div class="container" id="mainApp">
<div class="chart-area"><canvas id="chart"></canvas></div>
<div class="sidebar">
<h3>Trade Panel</h3>
<div id="tradeControls" class="locked">
<label>Amount ($):</label><input type="number" id="amount" value="1000">
<label>Leverage:</label><select id="leverage"><option>1x</option><option>5x</option><option>10x</option><option>20x</option><option>50x</option><option>100x</option></select>
<label>Take Profit %:</label><input type="number" id="tp" value="5">
<label>Stop Loss %:</label><input type="number" id="sl" value="5"><br>
<button class="buy" onclick="openTrade('long')">BUY / LONG</button>
<button class="sell" onclick="openTrade('short')">SELL / SHORT</button>
</div>
<h3>Open Positions</h3><div id="positions">Buy demo to start</div>
<h3>Order Book (Live)</h3><div id="orderbook"></div>
</div>
</div>

<script>
let balance=0; let demoActive=false; let price=65000; let candles=[]; let positions=[];
for(let i=0;i<80;i++){let o=price;let c=o+(Math.random()-0.48)*400;let h=Math.max(o,c)+Math.random()*150;let l=Math.min(o,c)-Math.random()*150;candles.push({o,h,l,c});price=c;}
function showPlans(){document.getElementById('buyModal').style.display='flex';}
function buyDemo(amount,planName){
alert('You selected '+planName+'. Complete payment to activate.');
balance=amount; demoActive=true;
document.getElementById('buyModal').style.display='none';
document.getElementById('tradeControls').classList.remove('locked');
document.getElementById('balance').innerText=balance.toFixed(2);
document.getElementById('positions').innerText='No open trades';
}
const canvas=document.getElementById('chart'); const ctx=canvas.getContext('2d');
function resize(){canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;}
window.onresize=resize; resize();
function drawChart(){
ctx.clearRect(0,0,canvas.width,canvas.height);
let w=canvas.width/100; let data=candles.slice(-70);
let min=Math.min(...data.map(c=>c.l)); let max=Math.max(...data.map(c=>c.h)); let range=max-min||1;
data.forEach((c,i)=>{let x=i*w;
let yO=canvas.height-((c.o-min)/range)*canvas.height*0.9-20;
let yC=canvas.height-((c.c-min)/range)*canvas.height*0.9-20;
let yH=canvas.height-((c.h-min)/range)*canvas.height*0.9-20;
let yL=canvas.height-((c.l-min)/range)*canvas.height*0.9-20;
ctx.strokeStyle=c.c>=c.o?'#00c853':'#ff3d00'; ctx.fillStyle=ctx.strokeStyle;
ctx.beginPath();ctx.moveTo(x+w/2,yH);ctx.lineTo(x+w/2,yL);ctx.stroke();
ctx.fillRect(x+2,Math.min(yO,yC),w-4,Math.abs(yC-yO)||2);});
}
function openTrade(type){
if(!demoActive){showPlans();return;}
let amt=parseFloat(document.getElementById('amount').value);
let lev=parseInt(document.getElementById('leverage').value);
let tp=parseFloat(document.getElementById('tp').value);
let sl=parseFloat(document.getElementById('sl').value);
if(amt>balance){alert('Insufficient demo balance');return;}
positions.push({type,entry:price,amount:amt,lev,tp,sl});
}
function updatePositions(){
if(!demoActive) return;
let html='';
positions=positions.filter(p=>{
let ch=(price-p.entry)/p.entry*100*p.lev; if(p.type==='short') ch=-ch;
let pnl=p.amount*ch/100;
if(ch>=p.tp||ch<=-p.sl){balance+=p.amount+pnl;return false;}
html+=`<div>${p.type.toUpperCase()} ${p.lev}x PnL:$${pnl.toFixed(2)}</div>`; return true;});
document.getElementById('positions').innerHTML=html||'No open trades';
document.getElementById('balance').innerText=balance.toFixed(2);
}
setInterval(()=>{
let c=price+(Math.random()-0.48)*200;
if(Math.random()>0.7){candles.push({o:price,h:Math.max(price,c)+50,l:Math.min(price,c)-50,c});}
price=c; drawChart(); updatePositions();
let ob=''; for(let i=0;i<8;i++){ob+=`<div style="color:#00c853">Bid:${(price-Math.random()*40).toFixed(1)}</div><div style="color:#ff3d00">Ask:${(price+Math.random()*40).toFixed(1)}</div>`;}
document.getElementById('orderbook').innerHTML=ob;
},1000);
drawChart();
</script>
</body>
</html>
