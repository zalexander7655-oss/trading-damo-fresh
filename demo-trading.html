<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Master Pro - BINANCE ONLY</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Inter,Arial;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{height:54px;background:#0f0f0f;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.exch-label{background:#1e2329;color:#f3ba2f;border:1px solid #f3ba2f;border-radius:6px;padding:7px 12px;font-weight:800}
.main{flex:1;display:flex;min-height:0}.center{flex:1;display:flex;flex-direction:column;min-width:0;background:#000}#chart{flex:1;width:100%}
.orderbook{width:260px;background:#0a0a0a;border-left:1px solid #222;display:flex;flex-direction:column}
.ob-list{height:168px;overflow:hidden;padding:6px 8px;font-family:monospace;font-size:11px;line-height:20px}
.ob-row{display:flex;justify-content:space-between;height:20px}.mid-price{height:38px;display:flex;align-items:center;justify-content:center;font-weight:900;border-top:1px solid #222;border-bottom:1px solid #222;background:#111;color:#f3ba2f}
.right{width:320px;background:#121212;border-left:1px solid #222;overflow-y:auto}
.inp{width:100%;background:#1e1e1e;border:1px solid #2a2a2a;color:#fff;border-radius:6px;padding:10px;margin:5px 0}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:8px;font-size:13px}
.buy{background:#0ecb81;color:#fff}.sell{background:#f6465d;color:#fff}.purchase{background:#f3ba2f;color:#000}
.trade-card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:8px;padding:10px;margin-top:10px;position:relative;font-size:11px}
.close-btn{position:absolute;right:6px;top:6px;background:#f6465d;color:#fff;border:none;border-radius:4px;padding:4px 10px;font-size:10px;font-weight:800;cursor:pointer}
.msg{position:fixed;top:66px;left:50%;transform:translateX(-50%);padding:14px 24px;border-radius:10px;display:none;z-index:9999;font-weight:800;min-width:300px;text-align:center}
</style>
</head>
<body>
<div class="msg" id="topMsg"></div>
<div class="header">
<div style="font-weight:900;color:#f3ba2f">TRADING MASTER PRO <span style="background:#0ecb81;color:#000;padding:2px 6px;border-radius:4px;font-size:9px;margin-left:8px">BINANCE</span></div>
<div style="display:flex;gap:12px;align-items:center"><div class="exch-label">BINANCE - Live</div><span id="livePrice" style="color:#f3ba2f;font-weight:900">$0.00</span></div>
<div>Balance: <b id="balTop">$0.00</b></div>
</div>
<div class="main">
<div class="center"><div id="chart"></div></div>
<div class="orderbook"><div style="padding:8px 10px;font-weight:800;border-bottom:1px solid #222;display:flex;justify-content:space-between;font-size:11px"><span>Order Book</span><span id="obSymbol">BTC-USDT</span></div><div id="asks" class="ob-list"></div><div id="midPrice" class="mid-price">$0.00</div><div id="bids" class="ob-list"></div></div>
<div class="right"><div style="padding:12px"><div style="background:#1a1a1a;padding:10px;border-radius:8px;display:flex;justify-content:space-between"><span>Available</span><b id="balBox">$0.00</b></div><input class="inp" id="priceInp" readonly><div style="display:flex;gap:6px"><input class="inp" id="amountInp" value="100"><input class="inp" id="levInp" value="10"></div><div style="display:flex;gap:6px"><input class="inp" id="slInp" value="5" placeholder="SL %"><input class="inp" id="tpInp" value="10" placeholder="TP %"></div><button class="btn buy" onclick="tryTrade('BUY')">BUY / LONG</button><button class="btn sell" onclick="tryTrade('SELL')">SELL / SHORT</button><button class="btn purchase" onclick="location.href='purchase.html'">💳 Purchase Demo</button><div id="posList"></div></div></div>
</div>
<script>
let balance=parseFloat(localStorage.getItem('demo_bal_purchased')||'1000');
let currentPrice=0,chart,candleSeries,binanceWs=null,trades=JSON.parse(localStorage.getItem('open_trades')||'[]'),lastCandle=null;
function showMsg(t,c='#f6465d'){let m=document.getElementById('topMsg');m.innerText=t;m.style.background=c;m.style.display='block';setTimeout(()=>m.style.display='none',4000);}
function updateBal(){document.getElementById('balTop').innerText='$'+balance.toFixed(2);document.getElementById('balBox').innerText='$'+balance.toFixed(2);localStorage.setItem('demo_bal_purchased',balance.toFixed(2));localStorage.setItem('open_trades',JSON.stringify(trades));}
function calcPnl(t){if(!currentPrice)return 0;let ch=t.side==='BUY'?(currentPrice-t.price)/t.price:(t.price-currentPrice)/t.price;return ch*t.amount*t.lev;}
function calcPnlPercent(t){return t.side==='BUY'?(currentPrice-t.price)/t.price*100:(t.price-currentPrice)/t.price*100;}
function renderTrades(){if(trades.length===0){document.getElementById('posList').innerHTML='<div style="color:#666;font-size:11px;margin-top:10px">No open trades</div>';return;}document.getElementById('posList').innerHTML=trades.slice().reverse().map(t=>{let pnl=calcPnl(t);let per=calcPnlPercent(t);let col=pnl>=0?'#0ecb81':'#f6465d';return `<div class="trade-card"><button class="close-btn" onclick="closeTrade(${t.id},false)">X CLOSE</button><b style="color:${t.side==='BUY'?'#0ecb81':'#f6465d'}">${t.side} ${t.lev}X</b> $${t.amount}<br>Entry: $${t.price.toFixed(2)} | Now: $${currentPrice.toFixed(2)}<br>PnL: <b style="color:${col}">${pnl>=0?'+':''}$${pnl.toFixed(2)} (${per>=0?'+':''}${per.toFixed(2)}%)</b><br><small>${t.time}</small></div>`;}).join('');}
function tryTrade(side){if(balance<=0){showMsg('Please Purchase Demo First');return;}let amt=parseFloat(document.getElementById('amountInp').value||'0');if(amt>balance){showMsg('Insufficient balance');return;}balance-=amt;trades.push({id:Date.now(),side,price:currentPrice,amount:amt,lev:parseInt(document.getElementById('levInp').value||10),time:new Date().toLocaleTimeString()});updateBal();renderTrades();showMsg(side+' Opened @ $'+currentPrice.toFixed(2),'#0ecb81');}
function closeTrade(id,isAuto=false,reason=''){let i=trades.findIndex(t=>t.id===id);if(i===-1)return;let t=trades[i];let pnl=calcPnl(t);balance+=t.amount+pnl;if(balance<0)balance=0;trades.splice(i,1);updateBal();renderTrades();showMsg((isAuto?'🤖 AUTO CLOSED - '+reason+' | ':'')+'PnL: '+(pnl>=0?'+':'')+'$'+pnl.toFixed(2),pnl>=0?'#0ecb81':'#f6465d');}
setInterval(()=>{if(!currentPrice||!trades.length)return;let sl=parseFloat(document.getElementById('slInp').value||5);let tp=parseFloat(document.getElementById('tpInp').value||10);trades.slice().forEach(t=>{let per=calcPnlPercent(t);let pnl=calcPnl(t);if(per<=-sl){closeTrade(t.id,true,'Stop Loss '+per.toFixed(2)+'%');return;}if(per>=tp){closeTrade(t.id,true,'Take Profit +'+per.toFixed(2)+'%');return;}if(pnl<=-(t.amount*0.9)){closeTrade(t.id,true,'LIQUIDATED -90%');return;}});renderTrades();},1000);
const chartEl=document.getElementById('chart');chart=LightweightCharts.createChart(chartEl,{layout:{background:{color:'#000'},textColor:'#888'},grid:{vertLines:{color:'#111'},horzLines:{color:'#111'}}});candleSeries=chart.addCandlestickSeries({upColor:'#0ecb81',downColor:'#f6465d',wickUpColor:'#0ecb81',wickDownColor:'#f6465d',borderVisible:false});
async function loadBinance(){try{let r=await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=200');let d=await r.json();let data=d.map(x=>({time:x[0]/1000,open:+x[1],high:+x[2],low:+x[3],close:+x[4]}));candleSeries.setData(data);lastCandle=data[data.length-1];chart.timeScale().fitContent();}catch(e){}}
function connectBinance(){if(binanceWs)binanceWs.close();binanceWs=new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade/btcusdt@depth10@100ms/btcusdt@kline_1m');binanceWs.onmessage=(e)=>{let m=JSON.parse(e.data);if(m.e==='trade'){currentPrice=parseFloat(m.p);document.getElementById('livePrice').innerText='$'+currentPrice.toFixed(2);document.getElementById('midPrice').innerText='$'+currentPrice.toFixed(2);document.getElementById('priceInp').value=currentPrice.toFixed(2);}if(m.e==='depthUpdate'||m.e==='depth10'){let asks='',bids='';(m.asks||[]).slice(0,8).reverse().forEach(a=>{asks+=`<div class="ob-row"><span style="color:#f6465d">${parseFloat(a[0]).toFixed(2)}</span><span>${parseFloat(a[1]).toFixed(4)}</span></div>`;});(m.bids||[]).slice(0,8).forEach(b=>{bids+=`<div class="ob-row"><span style="color:#0ecb81">${parseFloat(b[0]).toFixed(2)}</span><span>${parseFloat(b[1]).toFixed(4)}</span></div>`;});if(asks)document.getElementById('asks').innerHTML=asks;if(bids)document.getElementById('bids').innerHTML=bids;}if(m.e==='kline'){let k=m.k;let c={time:k.t/1000,open:+k.o,high:+k.h,low:+k.l,close:+k.c};candleSeries.update(c);lastCandle=c;}};}
updateBal();renderTrades();loadBinance();connectBinance();
setInterval(()=>{if(lastCandle&&currentPrice){let c={...lastCandle,close:currentPrice,high:Math.max(lastCandle.high,currentPrice),low:Math.min(lastCandle.low,currentPrice)};candleSeries.update(c);}},900);
</script>
</body>
</html>
