<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Master Pro - Final</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial;background:#0b0e11;color:#fff;font-size:13px;overflow:hidden}
body{display:flex;flex-direction:column}
.hd{background:#12161c;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 10px}
.hd b{color:#ffbf00}
.btn{border:none;border-radius:6px;padding:7px 14px;font-weight:bold;cursor:pointer}
.y{background:#ffbf00;color:#000}.r{background:#f6465d;color:#fff}.b{background:#2a5bd7;color:#fff}.g{background:#0ecb81;color:#fff}
.main{flex:1;display:flex;min-height:0;gap:4px;padding:6px}
.tools{width:44px;background:#1e2a4a;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.tools span{cursor:pointer;padding:6px;border-radius:6px}.tools span.on{background:#ffbf00;color:#000}
.chartBox{flex:1;background:#fff8e1;border-radius:8px;overflow:hidden}
#ch{width:100%;height:100%;display:block}
.right{width:310px;background:#12161c;border-radius:8px;display:flex;flex-direction:column;border:1px solid #1e2329;overflow:hidden}
.obH{padding:7px;color:#ffbf00;font-weight:bold;border-bottom:1px solid #222;font-size:12px}
#ob{flex:1;overflow:auto;padding:4px;font-size:11px;min-height:200px}
.moveBox{border-top:2px solid #ffbf00;height:200px;display:flex;flex-direction:column;background:#0f1420}
.moveH{color:#ffbf00;text-align:center;padding:5px;font-size:12px;border-bottom:1px solid #222}
#mv{flex:1;overflow:hidden;padding:4px;font-size:11px}
.trade{padding:8px;border-top:1px solid #222}
.pos{background:#1e2a4a;margin:0 6px 6px;padding:6px;border-radius:8px;height:86px;overflow:auto;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:10;display:none}
.box{background:#1e2329;max-width:500px;width:95%;margin:20px auto;padding:15px;border-radius:10px;border:1px solid #ffbf00;max-height:85%;overflow:auto}
</style>
</head>
<body>
<div class="hd"><div><b>Trading Master Pro</b> <span id="lp" style="color:#0ecb81;margin-left:8px"></span></div>
<div>Balance: <b id="bal">$0.00</b> <button class="btn b" onclick="openH('h')">History</button> <button class="btn r" onclick="doLogout()">Logout</button></div></div>

<div id="mainP" style="display:none;text-align:center;padding-top:80px;flex:1"><h1>Welcome to Trading Master</h1><button class="btn y" onclick="backTrade()">Start Now Trading</button></div>

<div id="tradeP" style="display:flex;flex-direction:column;flex:1;min-height:0">
<div class="main">
<div class="tools"><span class="on" onclick="setT('c',this)">✛</span><span onclick="setT('t',this)">📈</span><span onclick="setT('h',this)">➖</span><span onclick="setT('b',this)">▭</span><span onclick="setT('p',this)">✎</span><span onclick="draws=[];draw()">🗑</span></div>
<div class="chartBox"><canvas id="ch"></canvas></div>
<div class="right">
<div class="obH">Order Book Live</div><div id="ob"></div>
<div class="moveBox"><div class="moveH">Move Line</div><div id="mv"></div></div>
<div class="trade"><input id="qty" value="0.01" style="width:100%;padding:8px;text-align:center;margin-bottom:6px;border-radius:6px"><button class="btn g" style="width:100%;margin-bottom:6px;padding:10px" onclick="trade('BUY')">Buy / Long</button><button class="btn r" style="width:100%;padding:10px" onclick="trade('SELL')">Sell / Short</button></div>
</div>
</div>
<div class="pos"><b style="color:#ffbf00">Positions (<span id="pc">0</span>)</b><div id="pb"></div></div>
</div>

<div id="hM" class="modal"><div class="box">
<div style="text-align:center"><button class="btn y" onclick="openH('h')">History</button> <button class="btn g" onclick="openH('p')">Profit Loss</button> <button class="btn r" onclick="document.getElementById('hM').style.display='none'">Close</button></div>
<div id="hB" style="margin-top:10px"></div></div></div>

<script>
var bal=112606.40,trades=[],hist=JSON.parse(localStorage.getItem('tm_hist')||'[]'),candles=[],price=84000,tool='c',draws=[];
var $=id=>document.getElementById(id);
// 20 days filter
function cleanHist(){var cut=Date.now()-20*24*60*60*1000;hist=hist.filter(x=>x.ts>cut);localStorage.setItem('tm_hist',JSON.stringify(hist));}
cleanHist();
function doLogout(){$('tradeP').style.display='none';$('mainP').style.display='block';}
function backTrade(){$('mainP').style.display='none';$('tradeP').style.display='flex';draw();}
function setT(t,e){tool=t;document.querySelectorAll('.tools span').forEach(x=>x.classList.remove('on'));e.classList.add('on');}
function trade(s){var q=parseFloat($('qty').value)||0.01;var d=new Date();trades.push({s:s,q:q,e:price,ts:d.getTime(),dt:d.toLocaleString()});upd();}
function closeT(i){var t=trades[i];var pnl=t.s=='BUY'?(price-t.e)*t.q*10:-(price-t.e)*t.q*10;bal+=pnl;hist.unshift({side:t.s,pnl:pnl,ts:Date.now(),dt:t.dt});cleanHist();trades.splice(i,1);upd();}
function upd(){$('pc').innerText=trades.length;$('bal').innerText='$'+bal.toFixed(2);var h='';trades.forEach((t,i)=>{var pnl=t.s=='BUY'?(price-t.e)*t.q*10:-(price-t.e)*t.q*10;h+='<div>'+t.s+' '+t.q+' '+t.dt+' PNL:'+pnl.toFixed(2)+' <button onclick="closeT('+i+')">Close</button></div>';});$('pb').innerHTML=h||'No positions';}
function openH(m){$('hM').style.display='block';if(m=='h'){var h='<h3>History - 20 Days</h3>';hist.forEach(x=>{h+='<div style="display:flex;justify-content:space-between;border-bottom:1px solid #333;padding:4px"><span>'+x.dt+'</span><span>'+x.side+'</span><span>'+x.pnl.toFixed(2)+'</span></div>';});$('hB').innerHTML=h||'No history';}else{var p=0,l=0;hist.forEach(x=>{if(x.pnl>=0)p+=x.pnl;else l+=x.pnl;});$('hB').innerHTML='<h3>Profit / Loss - 20 Days</h3><p style="color:#0ecb81">Profit: $'+p.toFixed(2)+'</p><p style="color:#f6465d">Loss: $'+l.toFixed(2)+'</p><p>Net: $'+(p+l).toFixed(2)+'</p>';}}
// candles - proper size, wick in center
for(var i=0;i<70;i++){var o=price;price+=(Math.random()-0.5)*50;var c=price;var hh=Math.max(o,c)+15+Math.random()*10;var ll=Math.min(o,c)-15-Math.random()*10;candles.push({o:o,h:hh,l:ll,c:c});}
function draw(){var cv=$('ch');var rc=cv.parentElement.getBoundingClientRect();cv.width=rc.width;cv.height=rc.height;var ctx=cv.getContext('2d');ctx.fillStyle='#fff8e1';ctx.fillRect(0,0,cv.width,cv.height);var all=[];candles.forEach(k=>{all.push(k.h);all.push(k.l)});var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);var pad=(mx-mn)*0.2||20;mn-=pad;mx+=pad;var rg=mx-mn;var vis=candles.slice(-32),cw=cv.width/36;vis.forEach((k,i)=>{var x=i*cw+cw*0.2;var y=v=>cv.height-10-((v-mn)/rg)*(cv.height-20);var col=k.c>=k.o?'#0ecb81':'#f6465d';ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2;
// wick in CENTER
var cx=x+cw*0.3;ctx.beginPath();ctx.moveTo(cx,y(k.h));ctx.lineTo(cx,y(k.l));ctx.stroke();
// body minimum size
var bh=Math.max(Math.abs(y(k.c)-y(k.o)),8);var bw=Math.max(cw*0.6,10);ctx.fillRect(cx-bw/2,Math.min(y(k.c),y(k.o)),bw,bh);});
// chart dotted move line
var yl=cv.height-10-((price-mn)/rg)*(cv.height-20);ctx.strokeStyle='#000';ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(0,yl);ctx.lineTo(cv.width,yl);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#000';ctx.fillRect(cv.width-70,yl-10,70,20);ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText(price.toFixed(2),cv.width-65,yl+4);}
function live(){var h='';for(var i=7;i>0;i--)h+='<div style="display:flex;justify-content:space-between"><span style="color:#f6465d">'+(price+i*2).toFixed(2)+'</span><span>'+(Math.random()).toFixed(4)+'</span></div>';for(var i=1;i<=7;i++)h+='<div style="display:flex;justify-content:space-between"><span style="color:#0ecb81">'+(price-i*2).toFixed(2)+'</span><span>'+(Math.random()).toFixed(4)+'</span></div>';$('ob').innerHTML=h;
// move line box - same as candles move, small spaces
var m='';for(var i=4;i>0;i--)m+='<div style="display:flex;justify-content:space-between;padding:3px"><span>'+(price+i*1.2).toFixed(2)+'</span><span>· ·</span></div>';
m+='<div style="background:#ffbf00;color:#000;text-align:center;font-weight:bold;padding:5px;margin:3px 0">'+price.toFixed(2)+'</div>';
for(var i=1;i<=4;i++)m+='<div style="display:flex;justify-content:space-between;padding:3px"><span>'+(price-i*1.2).toFixed(2)+'</span><span>· ·</span></div>';
$('mv').innerHTML=m;$('lp').innerText='$'+price.toFixed(2);}
setInterval(()=>{var l=candles[candles.length-1];price+=(Math.random()-0.5)*30;l.c=price;l.h=Math.max(l.h,price);l.l=Math.min(l.l,price);if(Math.random()<0.15){var o=price;var c=price+(Math.random()-0.5)*40;candles.push({o:o,h:Math.max(o,c)+12,l:Math.min(o,c)-12,c:c});if(candles.length>100)candles.shift();}draw();live();upd();},1000);
draw();live();upd();
</script>
</body>
</html>
