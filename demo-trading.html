<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Master Pro - Final Fixed</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial;background:#0b0e11;color:#fff;font-size:13px;overflow:hidden}
body{display:flex;flex-direction:column}
.hd{background:#12161c;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 10px;border-bottom:1px solid #1e2329}
.hd b{color:#ffbf00}
.btn{border:none;border-radius:6px;padding:6px 12px;font-weight:bold;cursor:pointer}
.y{background:#ffbf00;color:#000}.r{background:#f6465d;color:#fff}.b{background:#2a5bd7;color:#fff}.g{background:#0ecb81;color:#fff}
.main{flex:1;display:flex;min-height:0;gap:6px;padding:6px}
.tools{width:44px;background:#1e2a4a;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.tools span{cursor:pointer;padding:5px;border-radius:5px}.tools span.on{background:#ffbf00;color:#000}
.mid{flex:1;display:flex;flex-direction:column;min-width:0}
.chartBox{flex:1;background:#fff8e1;border-radius:8px;overflow:hidden;position:relative}
#ch{width:100%;height:100%;display:block}
/* RIGHT - TOTAL PAGE ORDER BOOK */
.right{width:300px;background:#12161c;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #1e2329}
.right-top{flex:1;display:flex;flex-direction:column;min-height:0}
.ob-title{padding:8px;color:#ffbf00;font-weight:bold;font-size:12px;border-bottom:1px solid #1e2329}
#ob{flex:1;overflow:auto;padding:4px;font-size:11px}
/* MOVE LINE - SEPARATE LINE BOX */
.move-box{height:220px;border-top:2px solid #ffbf00;background:#0f1420;display:flex;flex-direction:column;margin-top:4px}
.move-head{font-size:11px;color:#ffbf00;padding:6px;text-align:center;border-bottom:1px solid #1e2329}
#moveLine{flex:1;overflow:hidden;position:relative;padding:4px}
.tradeBox{padding:8px;border-top:1px solid #1e2329}
.pos{background:#1e2a4a;margin:0 6px 6px;padding:6px;border-radius:8px;height:90px;overflow:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:none}
.box{background:#1e2329;max-width:480px;width:95%;margin:20px auto;padding:15px;border-radius:10px;border:1px solid #ffbf00;max-height:85%;overflow:auto}
</style>
</head>
<body>
<div class="hd"><div><b>Trading Master Pro</b> <span id="lp" style="color:#0ecb81;margin-left:8px"></span></div>
<div>Balance: <b id="bal" style="color:#0ecb81">$112606.40</b> <button class="btn b" onclick="openHist('days')">History</button> <button class="btn r" onclick="location.reload()">Logout</button></div></div>

<div class="main">
<div class="tools"><span class="on">✛</span><span>📈</span><span>➖</span><span>▭</span><span>✎</span><span>T</span><span onclick="draws=[];draw()">🗑</span></div>
<div class="mid"><div class="chartBox"><canvas id="ch"></canvas></div></div>
<div class="right">
<div class="right-top"><div class="ob-title">Order Book Line Live</div><div id="ob"></div></div>
<!-- MOVE LINE ALAG LINE ME -->
<div class="move-box"><div class="move-head">Move Line</div><div id="moveLine"></div></div>
<div class="tradeBox">
<div style="display:flex;gap:6px;margin-bottom:6px"><input id="qty" value="100" style="flex:1;padding:8px;text-align:center;border-radius:6px;border:1px solid #333;background:#0b0e11;color:#fff"></div>
<button class="btn g" style="width:100%;padding:10px;margin-bottom:6px" onclick="trade('BUY')">Buy / Long</button>
<button class="btn r" style="width:100%;padding:10px" onclick="trade('SELL')">Sell / Short</button>
</div>
</div>
</div>
<div class="pos"><b style="color:#ffbf00">Positions (<span id="pc">0</span>)</b><div id="pb" style="font-size:11px">No positions</div></div>

<div id="hM" class="modal"><div class="box">
<div style="text-align:center;margin-bottom:10px"><button class="btn y" onclick="openHist('days')">20 Days History</button> <button class="btn g" onclick="openHist('pnl')">Profit / Loss</button> <button class="btn r" onclick="document.getElementById('hM').style.display='none'">Close</button></div>
<div id="hB"></div></div></div>

<script>
var bal=112606.40,trades=[],hist=[],candles=[],price=84000,draws=[];
var $=id=>document.getElementById(id);
function trade(s){var q=parseFloat($('qty').value)||100;trades.push({s:s,q:q,e:price});upd();}
function upd(){$('pc').innerText=trades.length;var h='';trades.forEach((t,i)=>{var pnl=t.s=='BUY'?(price-t.e)*t.q*0.01:-(price-t.e)*t.q*0.01;h+='<div>'+t.s+' '+t.q+' PNL:'+pnl.toFixed(2)+' <button onclick="closeT('+i+')">Close</button></div>';});$('pb').innerHTML=h||'No positions';}
function closeT(i){var t=trades[i];var pnl=t.s=='BUY'?(price-t.e)*t.q*0.01:-(price-t.e)*t.q*0.01;var d=new Date();hist.unshift({date:d.toLocaleDateString(),time:d.toLocaleTimeString(),side:t.s,pnl:pnl});trades.splice(i,1);upd();}
function openHist(m){$('hM').style.display='block';if(m=='days'){var html='<h3>20 Days History</h3><table style="width:100%;color:#fff"><tr><th>Date</th><th>Time</th><th>Side</th><th>PNL</th></tr>';hist.slice(0,50).forEach(x=>{html+='<tr><td>'+x.date+'</td><td>'+x.time+'</td><td>'+x.side+'</td><td>'+x.pnl.toFixed(2)+'</td></tr>';});$('hB').innerHTML=html+'</table>';}else{var p=0,l=0;hist.forEach(x=>{if(x.pnl>=0)p+=x.pnl;else l+=x.pnl;});$('hB').innerHTML='<h3>Total Sell: '+hist.length+'</h3><h3 style="color:#0ecb81">Profit: $'+p.toFixed(2)+'</h3><h3 style="color:#f6465d">Loss: $'+l.toFixed(2)+'</h3>';}}
for(var i=0;i<80;i++){var o=price;price+=(Math.random()-0.5)*40;candles.push({o:o,h:o+15,l:o-15,c:price});}
function draw(){var cv=$('ch');var rc=cv.parentElement.getBoundingClientRect();cv.width=rc.width;cv.height=rc.height;var ctx=cv.getContext('2d');ctx.fillStyle='#fff8e1';ctx.fillRect(0,0,cv.width,cv.height);var all=[];candles.forEach(k=>{all.push(k.h);all.push(k.l)});var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);var pad=(mx-mn)*0.3||10;mn-=pad;mx+=pad;var rg=mx-mn;var vis=candles.slice(-30),cw=cv.width/40;vis.forEach((k,i)=>{var x=i*cw;var y=v=>cv.height-10-((v-mn)/rg)*(cv.height-20);var col=k.c>=k.o?'#0ecb81':'#f6465d';ctx.fillStyle=col;ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(x+cw/2,y(k.h));ctx.lineTo(x+cw/2,y(k.l));ctx.stroke();var bh=Math.max(Math.abs(y(k.c)-y(k.o)),4);ctx.fillRect(x,y(k.c)>y(k.o)?y(k.c):y(k.o),cw*0.6,bh);});
// chart move dotted line (chart side)
var yl=cv.height-10-((price-mn)/rg)*(cv.height-20);ctx.strokeStyle='#000';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(0,yl);ctx.lineTo(cv.width,yl);ctx.stroke();ctx.setLineDash([]);}
function obLive(){
// order book total page
var h='';for(var i=8;i>0;i--)h+='<div style="display:flex;justify-content:space-between"><span style="color:#f6465d">'+(price+i*2).toFixed(2)+'</span><span>'+(Math.random()).toFixed(4)+'</span></div>';
for(var i=1;i<=8;i++)h+='<div style="display:flex;justify-content:space-between"><span style="color:#0ecb81">'+(price-i*2).toFixed(2)+'</span><span>'+(Math.random()).toFixed(4)+'</span></div>';
$('ob').innerHTML=h;
// move line alag box me totally
var mh='';for(var i=5;i>0;i--)mh+='<div style="display:flex;justify-content:space-between;padding:2px"><span style="color:#f6465d">'+(price+i*1.5).toFixed(2)+'</span><span>↕</span></div>';
mh+='<div style="text-align:center;background:#ffbf00;color:#000;font-weight:bold;padding:4px;margin:2px 0">'+price.toFixed(2)+'</div>';
for(var i=1;i<=5;i++)mh+='<div style="display:flex;justify-content:space-between;padding:2px"><span style="color:#0ecb81">'+(price-i*1.5).toFixed(2)+'</span><span>↕</span></div>';
$('moveLine').innerHTML=mh;
$('lp').innerText='$'+price.toFixed(2);}
setInterval(()=>{var l=candles[candles.length-1];price+=(Math.random()-0.5)*20;l.c=price;l.h=Math.max(l.h,price);l.l=Math.min(l.l,price);if(Math.random()<0.1){candles.push({o:price,h:price,l:price,c:price});}draw();obLive();upd();},1000);
draw();obLive();
</script>
</body>
</html>
