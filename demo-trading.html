<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Master Pro</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:Arial;font-size:12px}
body{background:#0b0e11;color:#eaecef;display:flex;flex-direction:column}
.hd{background:#12161c;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #1e2329;flex-shrink:0}
.hd b{color:#f0b90b}
.btn{border:none;border-radius:6px;padding:8px 16px;font-weight:bold;cursor:pointer;font-size:13px}
.y{background:#f0b90b;color:#000}.r{background:#f6465d;color:#fff}.g{background:#0ecb81;color:#fff}.b{background:#2a5bd7;color:#fff}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:200}
.box{background:#1e2329;border:1px solid #2b3139;max-width:480px;width:94%;margin:30px auto;padding:20px;border-radius:12px;text-align:center}
.main{flex:1;display:flex;min-height:0;margin:6px;gap:6px}
.left{width:52px;background:#12161c;border:1px solid #1e2329;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:14px;flex-shrink:0}
.left span{font-size:22px;color:#848e9c;cursor:pointer;padding:8px;border-radius:8px;min-width:38px;text-align:center}
.left span.on{background:#f0b90b;color:#000}
.center{flex:1;display:flex;flex-direction:column;min-width:0}
.chartBox{flex:1;background:#fff;border-radius:8px;overflow:hidden;position:relative;min-height:0;border:1px solid #1e2329}
#ch{width:100%;height:100%;display:block;cursor:crosshair}
.qbar{background:#12161c;border:1px solid #1e2329;border-radius:8px;display:flex;justify-content:center;align-items:center;gap:14px;padding:12px;margin-top:6px;flex-shrink:0}
.qbar input{width:80px;text-align:center;padding:10px;border-radius:6px;border:1px solid #2b3139;background:#1e2329;color:#fff;font-size:14px;font-weight:bold}
.qbtn{width:38px;height:38px;font-size:20px;border-radius:6px;border:none;background:#2b3139;color:#fff;cursor:pointer}
.buyBtn{background:#0ecb81;color:#fff;padding:12px 42px;font-size:15px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.sellBtn{background:#f6465d;color:#fff;padding:12px 42px;font-size:15px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.buyBtn:active,.sellBtn:active{transform:scale(0.96)}
.orderbook{width:280px;background:#12161c;border:1px solid #1e2329;border-radius:8px;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.orderbook h4{margin:0;padding:10px;border-bottom:1px solid #1e2329;color:#eaecef}
#obBody{flex:1;overflow:auto;padding:6px}
.pos{background:#12161c;margin:0 6px 6px;padding:8px;border-radius:8px;border:1px solid #1e2329;max-height:150px;overflow:auto;flex-shrink:0}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #1e2329;text-align:left}
</style>
</head>
<body>
<div class="hd">
<div><b>Trading Master Pro</b> <select id="sym" style="margin-left:10px;background:#1e2329;color:#fff;border:1px solid #2b3139;padding:5px;border-radius:4px"><option>BTCUSDT</option><option>ETHUSDT</option><option>BNBUSDT</option></select> <b id="lp" style="color:#0ecb81;margin-left:8px">$0</b></div>
<div>Balance: <b id="bal" style="color:#0ecb81">$10000.00</b>
<button class="btn y" onclick="openHist()">History</button>
<button class="btn r" onclick="location.reload()">Logout</button></div>
</div>

<div id="histM" class="modal"><div class="box"><h2>History</h2>
<button class="btn y" onclick="showH('h')">History</button> <button class="btn b" onclick="showH('b')">Balance</button>
<div id="hBody" style="text-align:left;margin-top:12px;max-height:300px;overflow:auto"></div><br>
<button class="btn r" onclick="document.getElementById('histM').style.display='none'">Close</button></div></div>

<div id="closeM" class="modal"><div class="box" style="text-align:left"><h2>Close Confirm</h2><div id="cInfo" style="background:#0b0e11;padding:12px;border-radius:8px"></div><br>
<button class="btn y" style="width:100%;padding:12px" onclick="doClose()">Confirm Close</button><br><br>
<button class="btn b" style="width:100%" onclick="document.getElementById('closeM').style.display='none'">Cancel</button></div></div>

<div class="main">
<div class="left">
<span class="on" title="Cross" onclick="setT('cross',this)">✛</span>
<span title="Trend" onclick="setT('trend',this)">╱</span>
<span title="Box" onclick="setT('box',this)">▢</span>
<span title="Brush" onclick="setT('pen',this)">✎</span>
<span title="H-Line" onclick="setT('hline',this)">―</span>
<span title="Clear" onclick="clearD()">🗑</span>
</div>

<div class="center">
<div class="chartBox"><canvas id="ch"></canvas></div>
<div class="qbar">
<button class="qbtn" onclick="cq(-10)">−</button>
<input id="qty" type="number" value="10">
<button class="qbtn" onclick="cq(10)">+</button>
<button class="buyBtn" onclick="trade('BUY')">Buy / Long</button>
<button class="sellBtn" onclick="trade('SELL')">Sell / Short</button>
</div>
</div>

<div class="orderbook">
<h4>Order Book - Live</h4>
<div id="obBody"></div>
</div>
</div>

<div class="pos"><b style="color:#f0b90b">Positions (<span id="pc">0</span>)</b>
<table><thead><tr><th>Sym</th><th>Side</th><th>Qty</th><th>PNL</th><th>Close</th></tr></thead><tbody id="pb"></tbody></table></div>

<script>
let bal=10000,trades=[],hist=[],candles=[],price=0,tool='cross',draws=[],isD=false,sP=null,mP=null,ci=-1;
const $=id=>document.getElementById(id);
function cq(d){$('qty').value=Math.max(1,(parseFloat($('qty').value)||10)+d)}
function trade(s){let q=parseFloat($('qty').value)||10;trades.push({sym:$('sym').value,side:s,qty:q,entry:price});updPos();}
function setT(t,e){tool=t;document.querySelectorAll('.left span').forEach(x=>x.classList.remove('on'));e.classList.add('on')}
function clearD(){draws=[];drawC()}
function openHist(){$('histM').style.display='block';showH('h')}
function showH(w){if(w==='h'){$('hBody').innerHTML=(hist.map(x=>'<div style="display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid #222"><span>'+x.d+'</span><span style="color:'+(x.pnl>=0?'#0ecb81':'#f6465d')+'">$'+x.pnl.toFixed(2)+'</span></div>').join('')||'No history')}else{$('hBody').innerHTML='<div style="font-size:22px;color:#0ecb81">Balance: $'+bal.toFixed(2)+'</div>'}}
function updPos(){$('pc').innerText=trades.length;$('pb').innerHTML=trades.map((t,i)=>{let pnl=t.side==='BUY'?(price-t.entry)*t.qty*0.01:-(price-t.entry)*t.qty*0.01;let c=pnl>=0?'#0ecb81':'#f6465d';return '<tr><td>'+t.sym+'</td><td style="color:'+c+'">'+t.side+'</td><td>'+t.qty+'</td><td style="color:'+c+'">'+pnl.toFixed(2)+'</td><td><button class="btn y" style="padding:5px 10px" onclick="openC('+i+')">Close</button></td></tr>'}).join('')||'<tr><td colspan=5 style="text-align:center;color:#555">No positions</td></tr>';$('bal').innerText='$'+bal.toFixed(2)}
function openC(i){ci=i;let t=trades[i];let pnl=t.side==='BUY'?(price-t.entry)*t.qty*0.01:-(price-t.entry)*t.qty*0.01;$('cInfo').innerHTML='Symbol: '+t.sym+'<br>Side: '+t.side+'<br>Qty: '+t.qty+'<br>PNL: $'+pnl.toFixed(2);$('closeM').style.display='block'}
function doClose(){let t=trades[ci];let pnl=t.side==='BUY'?(price-t.entry)*t.qty*0.01:-(price-t.entry)*t.qty*0.01;bal+=pnl;hist.push({d:new Date().toLocaleDateString(),pnl});while(hist.length>20)hist.shift();trades.splice(ci,1);$('closeM').style.display='none';updPos()}

async function loadK(){try{let s=$('sym').value;let r=await fetch('https://api.binance.com/api/v3/klines?symbol='+s+'&interval=1m&limit=60');let j=await r.json();candles=j.map(k=>({o:+k[1],h:+k[2],l:+k[3],c:+k[4]}));price=candles[candles.length-1].c;}catch(e){if(!candles.length){for(let i=0;i<60;i++){let o=price||50000;price=o+(Math.random()-0.5)*150;candles.push({o,h:Math.max(o,price),l:Math.min(o,price),c:price})}}}}
function drawC(){
let cv=$('ch'),box=cv.parentElement.getBoundingClientRect();cv.width=box.width;cv.height=box.height;
let ctx=cv.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);
if(!candles.length)return;
let all=candles.flatMap(k=>[k.h,k.l]),mn=Math.min(...all),mx=Math.max(...all);
// 0.5 top + 0.5 bottom padding
let pad=(mx-mn)*0.5; mn-=pad*0.5; mx+=pad*0.5; let rg=mx-mn||1;
let totalSlots=40, visCount=28, cw=cv.width/totalSlots;
let vis=candles.slice(-visCount);
vis.forEach((k,i)=>{
let x=i*cw;
let y=v=>cv.height-8-((v-mn)/rg)*(cv.height-16);
let up=k.c>=k.o, col=up?'#0ecb81':'#f6465d';
ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(x+cw/2,y(k.h));ctx.lineTo(x+cw/2,y(k.l));ctx.stroke();
let bh=Math.max(Math.abs(y(k.c)-y(k.o)),5);
ctx.fillRect(x+cw*0.18,Math.min(y(k.c),y(k.o)),cw*0.64,bh);
});
// tools
ctx.strokeStyle='#222';ctx.lineWidth=2;
draws.forEach(d=>{
if(d.type==='trend'){ctx.beginPath();ctx.moveTo(d.x1,d.y1);ctx.lineTo(d.x2,d.y2);ctx.stroke()}
if(d.type==='hline'){ctx.beginPath();ctx.moveTo(0,d.y1);ctx.lineTo(cv.width,d.y1);ctx.stroke()}
if(d.type==='box'){ctx.strokeRect(Math.min(d.x1,d.x2),Math.min(d.y1,d.y2),Math.abs(d.x2-d.x1),Math.abs(d.y2-d.y1))}
if(d.type==='pen'){ctx.beginPath();d.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}
});
}
function updOB(){
let h='';
for(let i=14;i>0;i--){let p=(price+i*3).toFixed(1);h+='<div style="display:flex;justify-content:space-between;padding:3px 4px"><span style="color:#f6465d">'+p+'</span><span>'+(Math.random()*2).toFixed(4)+'</span></div>'}
h+='<div style="text-align:center;padding:8px;font-weight:bold;font-size:14px;border-top:1px solid #1e2329;border-bottom:1px solid #1e2329">'+price.toFixed(1)+'</div>';
for(let i=1;i<=14;i++){let p=(price-i*3).toFixed(1);h+='<div style="display:flex;justify-content:space-between;padding:3px 4px"><span style="color:#0ecb81">'+p+'</span><span>'+(Math.random()*2).toFixed(4)+'</span></div>'}
$('obBody').innerHTML=h;
$('lp').innerText='$'+price.toFixed(2);
}
async function tick(){
try{let s=$('sym').value;let r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol='+s);let j=await r.json();price=parseFloat(j.price);let l=candles[candles.length-1];if(l){l.c=price;if(price>l.h)l.h=price;if(price<l.l)l.l=price}}catch(e){price+=(Math.random()-0.5)*20}
drawC();updOB();updPos();
}
$('sym').addEventListener('change',loadK);
loadK().then(()=>{drawC();updPos();setInterval(tick,1500);setInterval(loadK,60000);});
let cvE=$('ch');
function gp(e){let r=cvE.getBoundingClientRect();return{x:(e.clientX-r.left)*(cvE.width/r.width),y:(e.clientY-r.top)*(cvE.height/r.height)}}
cvE.addEventListener('mousedown',e=>{let p=gp(e);mP=p;
if(tool==='trend'||tool==='box'){isD=true;sP={x1:p.x,y1:p.y,x2:p.x,y2:p.y,type:tool}}
else if(tool==='hline'){draws.push({type:'hline',y1:p.y});drawC()}
else if(tool==='pen'){isD=true;sP={type:'pen',pts:[p]}}});
cvE.addEventListener('mousemove',e=>{mP=gp(e);if(isD&&sP&&sP.type==='pen'){sP.pts.push(mP);drawC()}});
window.addEventListener('mouseup',()=>{if(isD&&sP){if(sP.x1!==undefined){sP.x2=mP.x;sP.y2=mP.y}draws.push(sP);isD=false;drawC()}});
window.addEventListener('resize',drawC);
</script>
</body>
</html>
