<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Master Pro - Final</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial;background:#0b0e11;color:#fff;font-size:13px;overflow:hidden}
body{display:flex;flex-direction:column}
.hd{background:#12161c;height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 10px}
.hd b{color:#ffbf00}
.btn{border:none;border-radius:6px;padding:9px 10px;font-weight:bold;cursor:pointer;width:100%;margin-bottom:6px;font-size:12px}
.y{background:#ffbf00;color:#000}.r{background:#f6465d;color:#fff}.b{background:#2a5bd7;color:#fff}.g{background:#0ecb81;color:#fff}.grn{background:#26a69a;color:#fff}
.main{flex:1;display:flex;min-height:0;gap:4px;padding:6px}
.tools{width:44px;background:#1e2a4a;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0;flex-shrink:0}
.tools span{cursor:pointer;padding:6px;border-radius:6px;color:#fff}.tools span.on{background:#ffbf00;color:#000}
.chartWrap{flex:1;display:flex;background:#0d1421;border-radius:8px;overflow:hidden;cursor:crosshair;border:1px solid #1e2329}
.chartBox{flex:1;position:relative}#ch{width:100%;height:100%;display:block}
.right{width:400px;background:#12161c;border-radius:8px;display:flex;flex-direction:column;border:1px solid #1e2329;overflow:hidden;flex-shrink:0}
.obH{padding:8px;color:#ffbf00;font-weight:bold;border-bottom:1px solid #222;font-size:13px;text-align:center}
.split{flex:1;display:flex;min-height:0}
.obLeft{flex:1;overflow:auto;padding:4px;border-right:2px solid #ffbf00}
.ctrlRight{flex:1;padding:8px;overflow:auto;background:#0f1420}
.obRow{display:flex;justify-content:space-between;padding:1px 2px;font-size:11px}
.modeBtn.on{outline:2px solid #fff}
.pos{background:#1e2a4a;margin:0 6px 6px;padding:6px;border-radius:8px;height:80px;overflow:auto;font-size:11px;flex-shrink:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:10;display:none}
.box{background:#1e2329;max-width:520px;width:95%;margin:20px auto;padding:15px;border-radius:10px;border:1px solid #ffbf00;max-height:85%;overflow:auto}
input,select{padding:8px;border-radius:6px;border:1px solid #333;background:#0b0e11;color:#fff;width:100%}
.secT{color:#ffbf00;font-size:12px;font-weight:bold;margin:8px 0 4px;text-align:center;border-bottom:1px solid #333;padding-bottom:4px}
</style>
</head>
<body>
<div class="hd"><div><b>Trading Master Pro</b> <span id="lp" style="color:#0ecb81;margin-left:8px"></span></div>
<div>Balance: <b id="bal" style="color:#0ecb81">$0.00</b> <button onclick="openH('h')" class="btn b" style="width:auto;display:inline-block;margin:0">History</button> <button onclick="location.reload()" class="btn r" style="width:auto;display:inline-block;margin:0">Logout</button></div></div>
<div id="tradeP" style="display:flex;flex-direction:column;flex:1;min-height:0">
<div class="main">
<div class="tools" id="tools">
<span data-t="c" class="on">✛</span><span data-t="t">📈</span><span data-t="h">➖</span><span data-t="b">▭</span><span data-t="p">✎</span><span data-t="txt">T</span><span id="clr">🗑</span>
</div>
<div class="chartWrap" id="cwrap"><div class="chartBox"><canvas id="ch"></canvas></div></div>
<div class="right">
<div class="obH">Order Book Live</div>
<div class="split">
<div class="obLeft" id="ob"></div>
<div class="ctrlRight">
<button id="mNormal" class="btn b modeBtn on" onclick="setMode('normal')">Normal</button>
<div class="secT">Candle Trading</div>
<button class="btn grn" onclick="candleBet('GREEN')">Green Candle Bet</button>
<button class="btn r" onclick="candleBet('RED')">Red Candle Bet</button>
<div class="secT">Quantity</div>
<div style="display:flex;gap:4px;margin-bottom:6px"><button class="btn b" style="width:40px" onclick="cq(-1)">-</button><input id="qty" value="0.01" style="text-align:center"><button class="btn b" style="width:40px" onclick="cq(1)">+</button></div>
<div class="secT">Normal Trade</div>
<button class="btn g" onclick="trade('BUY')">Buy / Long</button>
<button class="btn r" onclick="trade('SELL')">Sell / Short</button>
</div>
</div>
</div>
</div>
<div class="pos"><b style="color:#ffbf00">Positions (<span id="pc">0</span>)</b><div id="pb">No positions</div></div>
</div>
<div id="hM" class="modal"><div class="box"><div style="text-align:center"><button class="btn y" onclick="openH('h')">History</button> <button class="btn g" onclick="openH('p')">Profit Loss</button> <button class="btn r" onclick="document.getElementById('hM').style.display='none'">Close</button></div><div id="hB"></div></div></div>
<script>
var bal=0, trades=[], hist=[], candles=[], price=6420, mode='normal', tool='c', draws=[], hLines=[], isD=false, sP=null, mP=null, scrollOffset=0, candleBets=[];
try{hist=JSON.parse(localStorage.getItem('tm_hist')||'[]')}catch(e){}
var $=id=>document.getElementById(id);
function cleanHist(){var c=Date.now()-20*86400000;hist=hist.filter(x=>x.ts>c);try{localStorage.setItem('tm_hist',JSON.stringify(hist))}catch(e){}}cleanHist();
function setMode(m){mode=m;$('mNormal').classList.toggle('on',m==='normal');}
function cq(d){var v=parseFloat($('qty').value)||0.01;$('qty').value=Math.max(0.01,v+d*0.01).toFixed(2);}
function trade(s){var q=parseFloat($('qty').value)||0.01;trades.push({s:s,q:q,e:price,dt:new Date().toLocaleString()});upd();}
function candleBet(c){var q=parseFloat($('qty').value)||0.01;var idx=candles.length-1;candleBets.push({choice:c,qty:q,idx:idx});upd();alert(c+' Candle bet placed for current candle');}
function closeT(i){var t=trades[i];var pnl=t.s=='BUY'?(price-t.e)*t.q*5:-(price-t.e)*t.q*5;bal+=pnl;hist.unshift({side:t.s,pnl:pnl,ts:Date.now(),dt:t.dt});cleanHist();trades.splice(i,1);upd();}
function upd(){$('bal').innerText='$'+bal.toFixed(2);$('pc').innerText=trades.length+candleBets.length;var h='';trades.forEach((t,i)=>{h+='<div style="display:flex;justify-content:space-between"><span>'+t.s+' '+t.q+'</span><button onclick="closeT('+i+')">Close</button></div>'});candleBets.forEach(b=>{h+='<div>Bet '+b.choice+' '+b.qty+'</div>'});$('pb').innerHTML=h||'No positions';}
function openH(m){$('hM').style.display='block';var hb=$('hB');if(m=='h'){var s='<h3>History</h3>';hist.forEach(x=>{s+='<div>'+x.dt+' '+x.side+' '+x.pnl.toFixed(2)+'</div>'});hb.innerHTML=s;}else{var p=0,l=0;hist.forEach(x=>{if(x.pnl>=0)p+=x.pnl;else l+=x.pnl});hb.innerHTML='Profit $'+p.toFixed(2)+'<br>Loss $'+l.toFixed(2);}}
for(var i=0;i<50;i++){var o=price;price+=(Math.random()-0.48)*6;var cc=price;candles.push({o:o,h:Math.max(o,cc)+1.5,l:Math.min(o,cc)-1.5,c:cc});}
hLines=[6415,6428];
var cv=$('ch'), wrap=$('cwrap');
document.querySelectorAll('#tools span[data-t]').forEach(el=>{el.onclick=()=>{tool=el.dataset.t;document.querySelectorAll('#tools span').forEach(x=>x.classList.remove('on'));el.classList.add('on');}});
$('clr').onclick=()=>{draws=[];hLines=[];draw();};
function gp(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
var priceToY, yToPrice;
cv.addEventListener('mousedown',e=>{var p=gp(e);isD=true;sP=p;if(tool=='h'){var pr=yToPrice(p.y);hLines.push(pr);}if(tool=='txt'){var t=prompt('Text:');if(t)draws.push({type:'txt',x:p.x,y:p.y,t:t});}});
window.addEventListener('mousemove',e=>{if(!cv)return;mP=gp(e);if(isD&&sP&&(tool=='t'||tool=='b'||tool=='p')){draw();}});
window.addEventListener('mouseup',()=>{if(isD&&sP&&mP&&(tool=='t'||tool=='b')){draws.push({type:tool,x1:sP.x,y1:sP.y,x2:mP.x,y2:mP.y});}isD=false;draw();});
function draw(){
var rc=cv.parentElement.getBoundingClientRect();if(rc.width<10)return;cv.width=rc.width;cv.height=rc.height;var ctx=cv.getContext('2d');
ctx.fillStyle='#0d1421';ctx.fillRect(0,0,cv.width,cv.height);
var all=[];candles.forEach(k=>{all.push(k.h);all.push(k.l)});hLines.forEach(p=>all.push(p));
var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);var pad=(mx-mn)*0.25||5;mn-=pad;mx+=pad;var rg=mx-mn;
priceToY=v=>cv.height-10-((v-mn)/rg)*(cv.height-20); yToPrice=y=>mn+((cv.height-10-y)/ (cv.height-20))*rg;
hLines.forEach(p=>{var yy=priceToY(p);ctx.strokeStyle='#8a9bb5';ctx.setLineDash([8,5]);ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(cv.width,yy);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#8a9bb5';ctx.fillText('HL '+p.toFixed(2),8,yy-5);});
draws.forEach(d=>{ctx.strokeStyle='#ffbf00';ctx.fillStyle='#ffbf00';if(d.type=='t'){ctx.beginPath();ctx.moveTo(d.x1,d.y1);ctx.lineTo(d.x2,d.y2);ctx.stroke();}if(d.type=='b'){ctx.strokeRect(d.x1,d.y1,d.x2-d.x1,d.y2-d.y1);}if(d.type=='txt'){ctx.fillText(d.t,d.x,d.y);}});
var total=34,cw=cv.width/total,end=candles.length-scrollOffset,start=Math.max(0,end-24),vis=candles.slice(start,end);
vis.forEach((k,i)=>{var x=i*cw;var col=k.c>=k.o?'#26a69a':'#ef5350';ctx.strokeStyle=col;ctx.fillStyle=col;var cx=x+cw*0.5;ctx.beginPath();ctx.moveTo(cx,priceToY(k.h));ctx.lineTo(cx,priceToY(k.l));ctx.stroke();var bh=Math.max(Math.abs(priceToY(k.c)-priceToY(k.o)),4);ctx.fillRect(cx-4,Math.min(priceToY(k.c),priceToY(k.o)),8,bh);});
var yl=priceToY(price);ctx.strokeStyle='#ffbf00';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(0,yl);ctx.lineTo(cv.width,yl);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ffbf00';ctx.fillRect(cv.width-70,yl-10,70,20);ctx.fillStyle='#000';ctx.fillText(price.toFixed(2),cv.width-65,yl+4);
if(tool=='c'&&mP){ctx.strokeStyle='#5a6a85';ctx.beginPath();ctx.moveTo(mP.x,0);ctx.lineTo(mP.x,cv.height);ctx.moveTo(0,mP.y);ctx.lineTo(cv.width,mP.y);ctx.stroke();}
}
function live(){var h='';for(var i=6;i>0;i--)h+='<div class="obRow"><span style="color:#ef5350">'+(price+i*0.6).toFixed(2)+'</span><span>'+(Math.random()*0.5).toFixed(3)+'</span></div>';for(var i=1;i<=6;i++)h+='<div class="obRow"><span style="color:#26a69a">'+(price-i*0.6).toFixed(2)+'</span><span>'+(Math.random()*0.5).toFixed(3)+'</span></div>';$('ob').innerHTML=h;$('lp').innerText='$'+price.toFixed(2);}
setInterval(()=>{
var l=candles[candles.length-1];price+=(Math.random()-0.48)*4;l.c=price;l.h=Math.max(l.h,price);l.l=Math.min(l.l,price);
if(Math.random()<0.22){
var closed=candles[candles.length-1];var isGreen=closed.c>=closed.o;
candleBets=candleBets.filter(b=>{
if(b.idx===candles.length-1){
var win=(b.choice==='GREEN'&&isGreen)||(b.choice==='RED'&&!isGreen);
var pnl=win?b.qty*10:-b.qty*10;bal+=pnl;hist.unshift({side:'Candle-'+b.choice,pnl:pnl,ts:Date.now(),dt:new Date().toLocaleString()});cleanHist();return false;
}return true;});
var o=price;var nc=price+(Math.random()-0.48)*5;candles.push({o:o,h:Math.max(o,nc)+1.2,l:Math.min(o,nc)-1.2,c:nc});if(candles.length>80)candles.shift();
}
draw();live();upd();
},800);
draw();live();upd();
</script>
</body>
</html>
