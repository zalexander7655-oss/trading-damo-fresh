<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKX FINAL FIXED - Candles + Fixed OrderBook + Auto Close</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{height:52px;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.main{flex:1;display:flex;min-height:0;overflow:hidden}
.chart-wrap{flex:1;position:relative;background:#000;min-width:0}
#chart{position:absolute;inset:0;width:100%;height:100%}
.orderbook{width:270px;background:#0a0a0a;border-left:1px solid #222;display:flex;flex-direction:column}
.ob-head{padding:10px 12px;font-size:12px;font-weight:800;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.ob-fixed{height:176px;overflow:hidden;padding:6px 10px;font-family:monospace;font-size:11px}
.ob-row{height:22px;display:flex;justify-content:space-between;align-items:center}
.mid{height:40px;background:#151515;border-top:1px solid #222;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:center;font-weight:900;color:#f3ba2f}
.right{width:310px;background:#111;border-left:1px solid #222;padding:12px;overflow:auto}
.inp{width:100%;background:#1e1e1e;border:1px solid #333;color:#fff;padding:10px;border-radius:6px;margin:5px 0}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:8px}
.buy{background:#0ecb81;color:#fff}.sell{background:#f6465d;color:#fff}
.tbox{background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:10px;margin-top:10px;position:relative;font-size:11px}
.closeX{position:absolute;right:6px;top:6px;background:#f6465d;color:#fff;border:none;border-radius:4px;padding:5px 10px;font-weight:800;cursor:pointer;font-size:10px}
.msg{position:fixed;top:60px;left:50%;transform:translateX(-50%);padding:14px 24px;border-radius:8px;display:none;z-index:999;font-weight:800;min-width:320px;text-align:center}
</style>
</head>
<body>
<div id="msg" class="msg"></div>
<div class="header">
<div style="color:#f3ba2f;font-weight:900">TRADING MASTER PRO <span style="background:#0ecb81;color:#000;padding:2px 6px;border-radius:4px;font-size:9px">FINAL</span></div>
<div style="display:flex;gap:12px"><span id="live" style="color:#f3ba2f;font-weight:900">$0.00</span><span>Bal: <b id="bal" style="color:#0ecb81">$1000</b></span></div>
</div>
<div class="main">
<div class="chart-wrap"><div id="chart"></div></div>
<div class="orderbook">
<div class="ob-head"><span>Order Book</span><span>BTC-USDT</span></div>
<div id="asks" class="ob-fixed"></div>
<div id="mid" class="mid">$0.00</div>
<div id="bids" class="ob-fixed"></div>
</div>
<div class="right">
<div style="background:#1a1a1a;padding:10px;border-radius:8px;display:flex;justify-content:space-between"><span>Available</span><b id="bal2">$1000</b></div>
<input class="inp" id="pInp" readonly>
<div style="display:flex;gap:6px"><input class="inp" id="amt" value="100"><input class="inp" id="lev" value="10"></div>
<div style="font-size:10px;color:#aaa">AUTO: BUY needs GREEN, SELL needs RED. Wrong = Auto Loss Cut</div>
<button class="btn buy" onclick="openTrade('BUY')">BUY / LONG</button>
<button class="btn sell" onclick="openTrade('SELL')">SELL / SHORT</button>
<div id="list"></div>
</div>
</div>
<script>
let curPrice=0, balance=parseFloat(localStorage.getItem('bal_final')||'1000'), trades=JSON.parse(localStorage.getItem('trades_final')||'[]');
let chart, series, ws=null, lastCandle=null;
function toast(t,c='#f6465d'){let m=document.getElementById('msg');m.innerText=t;m.style.background=c;m.style.display='block';setTimeout(()=>m.style.display='none',3500);}
function save(){localStorage.setItem('bal_final',balance);localStorage.setItem('trades_final',JSON.stringify(trades));document.getElementById('bal').innerText='$'+balance.toFixed(2);document.getElementById('bal2').innerText='$'+balance.toFixed(2);}
function pnlCalc(t){if(!curPrice)return 0;let ch=t.side==='BUY'?(curPrice-t.entry)/t.entry:(t.entry-curPrice)/t.entry;return ch*t.amount*t.lev;}
function render(){if(trades.length===0){document.getElementById('list').innerHTML='<div style="color:#555;margin-top:10px">No open trades</div>';return;}document.getElementById('list').innerHTML=trades.slice().reverse().map(t=>{let p=pnlCalc(t);let col=p>=0?'#0ecb81':'#f6465d';return `<div class="tbox"><button class="closeX" onclick="closeTrade(${t.id},false)">CLOSE</button><b style="color:${t.side==='BUY'?'#0ecb81':'#f6465d'}">${t.side} ${t.lev}X</b> $${t.amount}<br>Entry: $${t.entry.toFixed(2)} | Now: $${curPrice.toFixed(2)}<br>PnL: <b style="color:${col}">${p>=0?'+':''}$${p.toFixed(2)}</b><br><small>${t.time}</small></div>`;}).join('');}
function openTrade(side){if(balance<=10){toast('Purchase Demo First');return;}let amt=parseFloat(document.getElementById('amt').value||'0');if(amt>balance){toast('Insufficient Balance');return;}balance-=amt;let tr={id:Date.now(),side,entry:curPrice,amount:amt,lev:parseInt(document.getElementById('lev').value||10),time:new Date().toLocaleTimeString()};trades.push(tr);save();render();toast(side+' OPENED @ $'+curPrice.toFixed(2),'#0ecb81');}
function closeTrade(id,isAuto=false,reason=''){let i=trades.findIndex(t=>t.id===id);if(i===-1)return;let t=trades[i];let p=pnlCalc(t);balance+=t.amount+p;if(balance<0)balance=0;trades.splice(i,1);save();render();toast((isAuto?'AUTO '+reason+' ':'Closed ')+'PnL: '+(p>=0?'+':'')+'$'+p.toFixed(2),p>=0?'#0ecb81':'#f6465d');}
setInterval(()=>{if(!lastCandle||trades.length===0)return;let isGreen=lastCandle.close>lastCandle.open;let isRed=lastCandle.close<lastCandle.open;trades.slice().forEach(t=>{let age=Date.now()-t.id;if(age>60000){if(t.side==='BUY'&&isRed)closeTrade(t.id,true,'LOSS - Candle RED on BUY');else if(t.side==='SELL'&&isGreen)closeTrade(t.id,true,'LOSS - Candle GREEN on SELL');else if(t.side==='BUY'&&isGreen)closeTrade(t.id,true,'PROFIT - Candle GREEN on BUY');else if(t.side==='SELL'&&isRed)closeTrade(t.id,true,'PROFIT - Candle RED on SELL');}});},5000);
let el=document.getElementById('chart');chart=LightweightCharts.createChart(el,{layout:{background:{color:'#000'},textColor:'#888'},grid:{vertLines:{color:'#111'},horzLines:{color:'#111'}}});series=chart.addCandlestickSeries({upColor:'#0ecb81',downColor:'#f6465d',wickUpColor:'#0ecb81',wickDownColor:'#f6465d',borderVisible:false});
async function loadCandles(){try{let r=await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=200');let d=await r.json();let data=d.map(x=>({time:x[0]/1000,open:+x[1],high:+x[2],low:+x[3],close:+x[4]}));series.setData(data);lastCandle=data[data.length-1];chart.timeScale().fitContent();}catch(e){let r2=await fetch('https://www.okx.com/api/v5/market/candles?instId=BTC-USDT&bar=1m&limit=200');let j=await r2.json();if(j.data){let data=j.data.map(x=>({time:parseInt(x[0])/1000,open:+x[1],high:+x[2],low:+x[3],close:+x[4]})).reverse();series.setData(data);lastCandle=data[data.length-1];chart.timeScale().fitContent();}}}
function connectOKX(){if(ws)ws.close();ws=new WebSocket('wss://ws.okx.com:8443/ws/v5/public');ws.onopen=()=>ws.send(JSON.stringify({op:'subscribe',args:[{channel:'tickers',instId:'BTC-USDT'},{channel:'books',instId:'BTC-USDT',sz:'10'},{channel:'candle1m',instId:'BTC-USDT'}]}));ws.onmessage=(e)=>{let m=JSON.parse(e.data);if(!m.data||!m.arg)return;let d=m.data[0];if(m.arg.channel==='tickers'){curPrice=parseFloat(d.last);document.getElementById('live').innerText='$'+curPrice.toFixed(2);document.getElementById('mid').innerText='$'+curPrice.toFixed(2);document.getElementById('pInp').value=curPrice.toFixed(2);}if(m.arg.channel==='books'){let aH='',bH='';for(let i=0;i<8;i++){let a=d.asks&&d.asks[7-i]?d.asks[7-i]:null;aH+=a?`<div class="ob-row"><span style="color:#f6465d">${parseFloat(a[0]).toFixed(2)}</span><span>${parseFloat(a[1]).toFixed(4)}</span></div>`:`<div class="ob-row"><span>--</span><span>--</span></div>`;}for(let i=0;i<8;i++){let b=d.bids&&d.bids[i]?d.bids[i]:null;bH+=b?`<div class="ob-row"><span style="color:#0ecb81">${parseFloat(b[0]).toFixed(2)}</span><span>${parseFloat(b[1]).toFixed(4)}</span></div>`:`<div class="ob-row"><span>--</span><span>--</span></div>`;}document.getElementById('asks').innerHTML=aH;document.getElementById('bids').innerHTML=bH;}if(m.arg.channel==='candle1m'){let c={time:parseInt(d[0])/1000,open:+d[1],high:+d[2],low:+d[3],close:+d[4]};series.update(c);lastCandle=c;}};ws.onclose=()=>setTimeout(connectOKX,2000);}
save();render();loadCandles();connectOKX();
setInterval(()=>{if(lastCandle&&curPrice){let c={...lastCandle,close:curPrice,high:Math.max(lastCandle.high,curPrice),low:Math.min(lastCandle.low,curPrice)};series.update(c);}},900);
</script>
</body>
</html>
