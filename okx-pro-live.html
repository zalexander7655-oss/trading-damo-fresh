<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKX Pro Live - Final Fixed</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial, sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{height:54px;background:#101010;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{color:#f3ba2f;font-weight:900;font-size:15px}
.price{color:#f3ba2f;font-weight:900;font-size:14px}
.main{flex:1;display:flex;min-height:0}
.center{flex:1;display:flex;flex-direction:column;background:#000;min-width:0}
#chart{flex:1;width:100%;height:100%}
.orderbook{width:280px;background:#0a0a0a;border-left:1px solid #222;display:flex;flex-direction:column;flex-shrink:0}
.ob-head{padding:10px 12px;font-weight:800;font-size:12px;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.ob-list{height:170px;overflow:hidden;padding:6px 10px;font-family:monospace;font-size:11px;line-height:21px}
.ob-row{display:flex;justify-content:space-between;align-items:center;height:21px;white-space:nowrap}
.mid{height:40px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;background:#111;border-top:1px solid #222;border-bottom:1px solid #222;color:#f3ba2f}
.right{width:300px;background:#121212;border-left:1px solid #222;padding:12px;overflow:auto}
.inp{width:100%;background:#1e1e1e;border:1px solid #333;color:#fff;padding:10px;border-radius:6px;margin:6px 0}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:900;cursor:pointer;margin-top:8px}
.buy{background:#0ecb81;color:#fff}.sell{background:#f6465d;color:#fff}
.msg{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#0ecb81;color:#000;padding:12px 20px;border-radius:8px;font-weight:800;display:none;z-index:99}
</style>
</head>
<body>
<div class="msg" id="msg"></div>
<div class="header">
<div class="logo">OKX PRO LIVE</div>
<div class="price" id="livePrice">$0.00</div>
<div>Balance: <b id="bal" style="color:#0ecb81">$1000.00</b></div>
</div>
<div class="main">
<div class="center"><div id="chart"></div></div>
<div class="orderbook">
<div class="ob-head"><span>Order Book</span><span>BTC-USDT</span></div>
<div id="asks" class="ob-list"></div>
<div id="midPrice" class="mid">$0.00</div>
<div id="bids" class="ob-list"></div>
</div>
<div class="right">
<input class="inp" id="priceInp" readonly placeholder="Live Price">
<input class="inp" id="amt" value="100" placeholder="Amount">
<input class="inp" id="lev" value="10" placeholder="Leverage">
<button class="btn buy" onclick="trade('BUY')">BUY / LONG</button>
<button class="btn sell" onclick="trade('SELL')">SELL / SHORT</button>
<div id="trades" style="margin-top:12px;color:#666;font-size:11px">No trades</div>
</div>
</div>
<script>
let price=0,chart,candleSeries,ws=null,lastCandle=null,trades=[],balance=1000;
function showMsg(t){let m=document.getElementById('msg');m.innerText=t;m.style.display='block';setTimeout(()=>m.style.display='none',2500);}
const el=document.getElementById('chart');
chart=LightweightCharts.createChart(el,{layout:{background:{color:'#000'},textColor:'#888'},grid:{vertLines:{color:'#111'},horzLines:{color:'#111'}},rightPriceScale:{borderColor:'#222'},timeScale:{borderColor:'#222',timeVisible:true}});
candleSeries=chart.addCandlestickSeries({upColor:'#0ecb81',downColor:'#f6465d',wickUpColor:'#0ecb81',wickDownColor:'#f6465d',borderVisible:false});
new ResizeObserver(()=>chart.timeScale().fitContent()).observe(el);

async function loadCandles(){
try{
let r=await fetch('https://www.okx.com/api/v5/market/candles?instId=BTC-USDT&bar=1m&limit=200');
let j=await r.json();
if(j.data){
let data=j.data.map(x=>({time:parseInt(x[0])/1000,open:+x[1],high:+x[2],low:+x[3],close:+x[4]})).reverse();
candleSeries.setData(data);
lastCandle=data[data.length-1];
chart.timeScale().fitContent();
}
}catch(e){console.log(e)}
}
function connect(){
if(ws)ws.close();
ws=new WebSocket('wss://ws.okx.com:8443/ws/v5/public');
ws.onopen=()=>{
ws.send(JSON.stringify({op:'subscribe',args:[{channel:'tickers',instId:'BTC-USDT'},{channel:'books',instId:'BTC-USDT',sz:'15'},{channel:'candle1m',instId:'BTC-USDT'}]}));
};
ws.onmessage=(e)=>{
let msg=JSON.parse(e.data);
if(!msg.data||!msg.arg)return;
let d=msg.data[0];
if(msg.arg.channel==='tickers'){
price=parseFloat(d.last);
document.getElementById('livePrice').innerText='$'+price.toFixed(2);
document.getElementById('midPrice').innerText='$'+price.toFixed(2);
document.getElementById('priceInp').value=price.toFixed(2);
}
if(msg.arg.channel==='books'){
let asks='',bids='';
(d.asks||[]).slice(0,8).reverse().forEach(a=>{asks+=`<div class="ob-row"><span style="color:#f6465d">${parseFloat(a[0]).toFixed(2)}</span><span>${parseFloat(a[1]).toFixed(4)}</span></div>`;});
(d.bids||[]).slice(0,8).forEach(b=>{bids+=`<div class="ob-row"><span style="color:#0ecb81">${parseFloat(b[0]).toFixed(2)}</span><span>${parseFloat(b[1]).toFixed(4)}</span></div>`;});
document.getElementById('asks').innerHTML=asks;
document.getElementById('bids').innerHTML=bids;
}
if(msg.arg.channel==='candle1m'){
let c={time:parseInt(d[0])/1000,open:+d[1],high:+d[2],low:+d[3],close:+d[4]};
candleSeries.update(c);
lastCandle=c;
}
};
ws.onerror=()=>setTimeout(connect,2000);
}
function trade(side){
let amt=parseFloat(document.getElementById('amt').value);
trades.push({side,price,amt,time:new Date().toLocaleTimeString()});
document.getElementById('trades').innerHTML=trades.slice().reverse().map(t=>`<div style="background:#1a1a1a;padding:8px;margin-top:6px;border-radius:6px"><b style="color:${t.side==='BUY'?'#0ecb81':'#f6465d'}">${t.side}</b> $${t.amt} @ $${t.price.toFixed(2)}<br><small>${t.time}</small></div>`).join('');
showMsg(side+' Order Placed @ $'+price.toFixed(2));
}
loadCandles();
connect();
// Make last candle move live every second
setInterval(()=>{if(lastCandle&&price){let c={...lastCandle,close:price,high:Math.max(lastCandle.high,price),low:Math.min(lastCandle.low,price)};candleSeries.update(c);}},900);
</script>
</body>
</html>
