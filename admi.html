<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Trading Master</title>
<style>
body{font-family: Arial; background:#0f172a; color:white; padding:15px;}
.box{background:#1e293b; padding:15px; border-radius:12px; margin:10px 0;}
img{max-width:100%; border-radius:8px; margin-top:10px; border:2px solid white;}
button{padding:10px 20px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; margin:5px;}
.approve{background:#22c55e; color:white;}
.reject{background:#ef4444; color:white;}
.status-pending{color:orange;}.status-approved{color:#22c55e;}
</style>
</head>
<body>
<h2>Admin Panel - Trading Master</h2>
<p>Till ID: 981149773 | USDT: T9yimC9YJdVtCQbgfHdj8bDh1c8uNGKDmu</p>
<div id="requests"></div>

<script>
function loadRequests(){
  let reqs = JSON.parse(localStorage.getItem('purchaseRequests') || "[]");
  let users = JSON.parse(localStorage.getItem('tradingUsers') || "{}");
  let html="";
  if(reqs.length==0) html="<p>No payment requests yet.</p>";
  reqs.slice().reverse().forEach((r, idx)=>{
    let realIdx = reqs.length-1-idx;
    html+=`<div class="box">
      <b>Email:</b> ${r.email}<br>
      <b>Package:</b> Pay $${r.payUSD} = ${r.payPKR} PKR = Get $${r.demoAmount} Demo<br>
      <b>Method:</b> ${r.method}<br>
      <b>Date:</b> ${r.date}<br>
      <b>Status:</b> <span class="status-${r.status}">${r.status}</span><br>
      <img src="${r.screenshot}" /><br><br>
      ${r.status==='pending'? `<button class="approve" onclick="approveReq(${realIdx})">Approve & Add $${r.demoAmount} Demo</button> <button class="reject" onclick="rejectReq(${realIdx})">Reject</button>` : `<i>Already ${r.status}</i>`}
    </div>`;
  });
  document.getElementById('requests').innerHTML=html;
}

function approveReq(i){
  let reqs = JSON.parse(localStorage.getItem('purchaseRequests') || "[]");
  let users = JSON.parse(localStorage.getItem('tradingUsers') || "{}");
  let r = reqs[i];
  if(!confirm(`Approve? Add $${r.demoAmount} demo to ${r.email}?`)) return;

  if(!users[r.email]) users[r.email] = { balance: 0, demoBalance: 0 };
  users[r.email].demoBalance = (users[r.email].demoBalance || 0) + r.demoAmount;

  reqs[i].status = "approved";
  localStorage.setItem('purchaseRequests', JSON.stringify(reqs));
  localStorage.setItem('tradingUsers', JSON.stringify(users));
  alert(`Approved! $${r.demoAmount} added to ${r.email}`);
  loadRequests();
}

function rejectReq(i){
  let reqs = JSON.parse(localStorage.getItem('purchaseRequests') || "[]");
  reqs[i].status = "rejected";
  localStorage.setItem('purchaseRequests', JSON.stringify(reqs));
  loadRequests();
}

loadRequests();
</script>
</body>
</html>
