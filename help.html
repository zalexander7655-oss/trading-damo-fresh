<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help Centre - Trading Master</title>
<style>
body{font-family:sans-serif;background:#eef6f7;margin:0}
.wrap{max-width:600px;margin:0 auto;padding:20px;height:100vh;display:flex;flex-direction:column;box-sizing:border-box}
h1{text-align:center}
.chat{flex:1;overflow-y:auto;border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:10px;background:#fff}
.msg{margin:8px 0}
.msg.right{text-align:right}
.bubble{display:inline-block;padding:10px 14px;border-radius:12px;max-width:80%}
.bot{background:#f1f1f1;color:black}
.user{background:black;color:white}
.typing{background:#f1f1f1;color:#888;font-size:13px;display:inline-block;padding:10px 14px;border-radius:12px}
.bar{display:flex;gap:8px;margin-top:12px}
input{flex:1;padding:12px;border-radius:8px;border:1px solid #ccc}
button.send{background:black;color:white;padding:12px 20px;border-radius:8px;border:none;cursor:pointer}
button.back{margin-top:10px;background:#e2e8f0;border:none;padding:10px;border-radius:8px;cursor:pointer;width:100%}
</style>
</head>
<body>
<div class="wrap">
<h1>Help Centre</h1>
<div class="chat" id="chat"></div>
<div class="bar">
<input id="inp" placeholder="Type your question...">
<button class="send" onclick="send()">Send</button>
</div>
<button class="back" onclick="location.href='index.html'">Back to Home</button>
</div>
<script>
let chat=document.getElementById('chat');
function addMsg(text,who){
let d=document.createElement('div');d.className='msg '+(who=='user'?'right':'');
let s=document.createElement('span');s.className='bubble '+(who=='user'?'user':'bot');s.innerText=text;
d.appendChild(s);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}
function smartReply(text){
let t=text.toLowerCase();
if(t.includes('thank')) return 'You are Welcome Sir!';
if(t.includes('hi')||t.includes('hello')||t.includes('hlo')) return 'Hello Sir! How can I help you today?';
if(t.includes('purch')||t.includes('pack')||t.includes('price')) return 'To buy packages, please go to the Purchase Packages page from the top left. There you will see different packages. You can choose your desired package and buy it easily.';
if(t.includes('demo')||t.includes('10000')||t.includes('free')||t.includes('virtual')) return 'Free Demo 10000$ means you get $10,000 virtual funds for practice. Click on Free Demo 10000$ or Start Trading Now button to start demo trading with no risk.';
if(t.includes('start')) return 'Click on the Start Trading Now button in the center of the home page. You will get $10,000 virtual funds to practice trading with no risk.';
if(t.includes('real')){
if(t.includes('buy')||t.includes('purch')||t.includes('binance')) return 'After completing verification, now you should buy from Real Binance and do trading there. In Trading Master only learning is provided.';
return 'To do Real Trading, please go to Real and complete your verification first.';
}
if((t.includes('what')||t.includes('wath'))&&(t.includes('trad')||t.includes('master'))) return 'Trading Master is a professional trading learning platform only for learning purpose. Here you can learn trading step by step, get daily signals, and start trading with Free Demo 10000$ practice funds.';
if(t.includes('trad')) return 'Trading means buying low and selling high to make profit. We provide complete learning, live charts and daily signals. You can start with Free Demo 10000$.';
if(t.includes('sign')) return 'To create a new account, click on the Sign Up button on the top right, enter your full name, email and password, then submit.';
if(t.includes('log')) return 'To login, click on the Log In button on the top right, enter your registered email and password, then click Login.';
if(t.includes('forg')||t.includes('pasw')||t.includes('pass')||t.includes('reset')) return 'To reset your password, click on the Forget button on the top right, enter your registered email. You will receive a reset link.';
return 'Sorry';
}
addMsg('Hello Sir! Welcome to Help Centre. How can I help you?','bot');
function send(){
let inp=document.getElementById('inp');let txt=inp.value.trim();if(!txt) return;
addMsg(txt,'user');inp.value='';
let tp=document.createElement('div');tp.innerHTML='<span class="typing">typing...</span>';chat.appendChild(tp);
let reply=smartReply(txt);
setTimeout(()=>{tp.remove();addMsg(reply,'bot')},5000);
}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter') send()});
</script>
</body>
</html>
